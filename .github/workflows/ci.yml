name: CI

on:
  push:
    branches: [main, dev]
    # Docs-only changes do not need the full suite. The workflow file itself is
    # excluded from the ignore list on purpose: editing CI must still run CI.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'

# One run per branch: if pushes arrive back to back, the previous one is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # The fast part of `make check` (Engineering, CI): lint, typecheck, unit and integration
    # tests. The integration tests bring up the `postgres-test` service of the root
    # docker-compose.yml themselves (make test-integration). The end-to-end level runs
    # locally against `make up`, not here.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Compiles packages/* via postinstall: api and core consume them from dist/.
      - name: Install
        run: npm ci

      # Catches a half-applied version bump here, in the pull request, instead of
      # at tag time when the release is already blocked.
      - name: Versions agree across the monorepo
        run: ./scripts/set-version.sh --check

      - name: Lint and typecheck
        run: make lint typecheck

      - name: Unit and integration tests
        run: make test-unit test-integration
