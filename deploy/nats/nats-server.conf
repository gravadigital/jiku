# nats-server.conf — NATS de Jiku, modo operator.
#
# El modo operator es un REQUISITO del auth callout: la autorización se decide con JWTs
# firmados por cuentas, y es lo que le permite al callout emitir un User JWT distinto por
# conexión. Un server en modo `authorization {}` clásico no puede hacerlo.
#
# La configuración del auth callout NO está acá: vive en el JWT de la cuenta AUTH, puesta
# por `nsc edit authcallout` durante el bootstrap.

port: 4222
http: 8222

server_name: jiku-nats

# Operator, system account y JWTs de cuenta. Los genera ./bootstrap.sh (una sola vez).
# Sin este archivo el server NO arranca en modo operator.
# Ver ./creds/README.md para generarlo.
include ./creds/nats-resolver.conf

# JetStream, habilitado SOLO para el transporte de los eventos de dominio
# ({instance}.events.v1.>). Los comandos y las consultas siguen siendo request/reply sin
# JetStream: ver ADR-002, que esta habilitación NO deroga.
#
# EL store_dir NECESITA UN VOLUMEN. Sin él vive en el filesystem efímero del contenedor y
# el stream JIKU_EVENTS desaparece en el próximo recreate, en silencio: los tres compose
# (docker-compose.yml, .dev.yml, .local.yml) montan un volumen nombrado acá.
#
# LOS LÍMITES EFECTIVOS NO SON ESTOS. El server corre en modo operator, así que el techo
# real lo pone el JWT de la cuenta (nsc edit account --js-disk-storage/--js-mem-storage).
# Lo de acá es el techo del server; el de la cuenta es el que decide si puede crear streams.
#
# NO se agrega `domain`: no hay leaf nodes ni superclúster, y un `domain` cambia los
# subjects de la API de JetStream ($JS.<domain>.API.>), lo que rompería el $JS.API.> que
# S-063 va a autorizar.
jetstream {
  store_dir: "/data/jetstream"
}

# El auth callout agrega un round-trip (validar el token contra Zitadel) al handshake de
# cada conexión, así que el timeout tiene que tolerarlo. El default de 2s alcanza para un
# JWKS cacheado, pero no para el primer fetch.
authorization {
  timeout: 5
}

# trace loguearía los CONNECT, que llevan el access token del cliente. Mantener apagado.
debug: false
trace: false
logtime: true
