# Rol de Zitadel -> plantilla de permisos. Ver README.md.
#
# Gana la PRIMERA regla que coincida; sin coincidencia la conexión se rechaza.
# Las reglas de servicio van ARRIBA de las de persona: reordenar rompe eso en silencio.
#
# Todo cambio acá es un cambio de seguridad (ADR-007).

version: 1

rules:
  # `docs` TIENE que ir arriba de `internal-app`: el machine user de jiku-docs lleva los dos
  # roles y gana la primera regla que coincide. Debajo, caería en connector.yaml y reiniciaría
  # en loop al suscribirse a `jiku-docs-*`. Los nombres de subject de docs son LITERALES: registrar
  # un módulo con otro `serviceName` es un cambio de seguridad deliberado (ADR-008).
  - match: docs
    template: templates/docs.yaml

  - match: internal-app
    template: templates/connector.yaml

  - match: core
    template: templates/core.yaml

  - match: admin
    template: templates/person-internal.yaml

  - match: user
    template: templates/person-internal.yaml

  - match: external-user
    template: templates/person-external.yaml

  # Sin catch-all: un rol que no esté acá NO conecta.
