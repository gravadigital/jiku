# rules.yaml — rol de Zitadel -> (tipo de identidad, plantilla)
#
# CÓMO SE EVALÚA
#   Se recorren las reglas EN ORDEN y gana la PRIMERA cuyo `match` coincida con algún rol
#   del token. Sin coincidencia, la conexión se RECHAZA: no hay permisos por defecto.
#   Poner lo más restrictivo arriba.
#
# EL ROL ES LO ÚNICO QUE DECIDE
#   No hay heurística que adivine si un token es de una persona o de un servicio: lo
#   declara `type`, y el rol lo asigna quien administra Zitadel.
#
# `service` ES EL ENDPOINT, NO LA IDENTIDAD
#   La identidad de todo caller —persona o servicio— es su `sub` de Zitadel, y es lo que
#   va como `<user-id>` en el subject. El campo `service` de acá abajo nombra el ENDPOINT
#   que ese usuario atiende: es el `{{service}}` de la plantilla y el segmento `<svc>` por
#   el que otros lo llaman.
#
#   Gramática completa: <instance>.<user-id>.<svc>.<version>.<method>
#
# ROLES DEL PRODUCTO
#   admin               administrador web  -> accede a NATS con permiso de SOLO CONSULTAS
#   user                usuario de la web  -> accede a NATS con permiso de SOLO CONSULTAS
#   external-user       usuario de opus    -> accede a NATS con permiso de SOLO CONSULTAS
#   internal-app        la api             -> accede a NATS y consulta a core
#   core                el servicio core   -> atiende los comandos
#   external-publisher  servicio de afuera -> sube archivos y los vincula, con permiso
#                                             acotado a esos comandos
#   bus-observer        diagnóstico local  -> escucha todo, no publica nada
#
# LAS PERSONAS CONECTAN AL BUS, Y SOLO PUEDEN LEER
#   Los tres roles de producto tienen regla acá, y su plantilla —templates/person.yaml—
#   autoriza exactamente dos cosas: publicar sobre el prefijo de consultas y escuchar su
#   propio inbox. Ningún comando, y nada más.
#
#   Los comandos los sigue publicando la api con su propio service_user, y ESA PARTE NO
#   CAMBIÓ: una persona que necesita escribir habla HTTP con la api, igual que siempre.
#
#   LA GARANTÍA DE QUE UNA PERSONA NO ESCRIBA PASÓ DEL TRANSPORTE A DOS CAPAS, y las dos
#   tienen que seguir siendo verdad:
#     1. templates/person.yaml no le da permiso de publicación sobre el prefijo de
#        comandos -> el servidor NATS le rechaza la publicación con una violación de
#        permisos, en el momento.
#     2. El mapa rol -> método de core (core/src/authorize-caller.ts, S-017) no autoriza
#        ningún comando para roles de producto -> si ese permiso existiera por un error
#        de plantilla, core responde `caller_not_authorized`.
#   CADA UNA ALCANZA POR SÍ SOLA. Antes la garantía era que una persona no podía
#   CONECTARSE: una sola, implícita, y del transporte. La de ahora es más fuerte en un
#   sentido —defensa en profundidad, dos capas explícitas— y más frágil en otro:
#   depende de DOS ARCHIVOS CORRECTOS en vez de la AUSENCIA de uno. Un rol nuevo con
#   acceso al bus se declara en los dos lugares.

version: 1

rules:
  # Publicador externo: un servicio de afuera que sube archivos y los vincula.
  #
  # VA ARRIBA DE `internal-app` A PROPÓSITO. Gana la primera regla que coincida, y esta es
  # la más restrictiva de las dos: su plantilla enumera los comandos en vez de abrir
  # `jiku-commands.v1.>`. Si un token llegara con los dos roles, queremos que caiga en esta.
  #
  # Para habilitar uno: crear un machine user en Zitadel con Access Token Type = JWT y
  # asignarle el rol `external-publisher` en GESTION_ZITADEL_PROJECT_ID. No hace falta
  # tocar nada más de este archivo.
  - match: external-publisher
    type: service
    service: external-publisher
    template: templates/external-publisher.yaml

  # La api. Único emisor de comandos hacia core.
  #
  # `service: api` reserva el nombre del endpoint, pero la api HOY NO ATIENDE NINGUNO:
  # su plantilla no se suscribe a `{{instance}}.*.{{service}}.>`, solo publica y escucha
  # su inbox. Queda declarado para el día que algo tenga que llamarla por el bus.
  - match: internal-app
    type: service
    service: api
    template: templates/api.yaml

  # Core: atiende DOS endpoints en un mismo proceso y con una sola conexión —
  # `jiku-commands` (por donde entran todos los comandos) y `jiku-queries` (las consultas).
  #
  # `service` NOMBRA UNO SOLO, Y YA NO DETERMINA QUÉ ESCUCHA LA PLANTILLA. El placeholder
  # `{{service}}` es un solo valor y acá hacen falta dos prefijos, así que
  # `templates/core.yaml` los ENUMERA literalmente en su `sub.allow` en vez de usarlo.
  # Consecuencia: cambiar este `service` NO mueve la suscripción — solo cambia cómo se
  # identifica el endpoint en los logs del callout. Para mover la suscripción hay que
  # editar la plantilla.
  - match: core
    type: service
    service: jiku-commands
    template: templates/core.yaml

  # Rol de diagnóstico: escucha todo sin publicar. Solo para entornos locales.
  # Ídem que `core`: su plantilla enumera los dos prefijos, así que este `service` tampoco
  # determina qué escucha.
  - match: bus-observer
    type: service
    service: bus-observer
    template: templates/observer.yaml

  # PERSONAS CON UN ROL DE PRODUCTO. Las tres reglas de abajo son las que hacen que una
  # persona pueda conectarse, y las tres apuntan a la MISMA plantilla: `person.yaml`
  # autoriza publicar SOLO sobre el prefijo de consultas y escuchar su propio inbox.
  # Ninguna escritura, ningún `$SRV.>`, ninguna suscripción de servicio.
  #
  # ESO ES COHERENTE CON EL MAPA ROL -> MÉTODO DE core, A PROPÓSITO. `authorize-caller.ts`
  # autoriza a estos tres roles TODAS las consultas y NINGÚN comando, así que la
  # plantilla no mintea un permiso que el escritor va a rechazar: las dos capas dicen lo
  # mismo, y el diagnóstico es más claro — el rechazo llega como violación de permisos en
  # el cliente al publicar, no como un `failure` a los 5 segundos de un request que nadie
  # iba a autorizar.
  #
  # `type: person` ES LO QUE PRODUCE `identity_type: "person"` EN EL EVENTO de
  # {instance}.events.auth. Estas tres reglas son lo que hace observable la distinción
  # person / service: hasta que existieron, las cuatro de arriba eran las únicas del
  # archivo y TODO evento salía con `identity_type: "service"`.
  #
  # SIN `service`, A DIFERENCIA DE LAS CUATRO DE ARRIBA. Ese campo nombra el ENDPOINT que
  # el usuario atiende, y una persona no atiende ninguno: `person.yaml` no tiene
  # `sub.allow` de servicio y no usa `{{service}}`. Declararlo sería inventar un endpoint
  # que nadie atiende y nadie puede alcanzar.
  #
  # LAS TRES VAN ÚLTIMAS, Y NO ES ORDEN ALFABÉTICO NI CASUALIDAD. Gana la primera regla
  # que coincida, así que un token que llegara con un rol de servicio Y uno de producto
  # —un machine user al que alguien le asignó `admin` por error— tiene que caer en la
  # regla DE SERVICIO, que es la que tiene el permiso acotado y correcto para lo que ese
  # usuario hace. Con la de persona arriba perdería el permiso que necesita, y el síntoma
  # sería una violación de permisos sobre un subject que "siempre funcionó". Es el mismo
  # argumento con que `external-publisher` VA ARRIBA DE `internal-app`, y si reordenás
  # este archivo "para agrupar", rompés esto sin enterarte.
  - match: admin
    type: person
    template: templates/person.yaml

  # Usuario de la web.
  - match: user
    type: person
    template: templates/person.yaml

  # Usuario de opus, el portal de clientes.
  - match: external-user
    type: person
    template: templates/person.yaml

  # SIN catch-all: un token válido de Zitadel con un rol que no está acá NO conecta.
  # Lo que queda afuera es CUALQUIER ROL QUE NO ESTÉ EN ESTAS SIETE REGLAS. Ya no son
  # `user` ni `external-user` —los dos tienen regla, como `admin`—: es cualquier otro,
  # y agregar uno es un cambio de seguridad (ADR-007), no un renglón más.
