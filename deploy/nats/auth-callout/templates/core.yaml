# El servicio `core`: atiende los dos planos y publica eventos de dominio. Ver README.md.
#
# Es el ÚNICO que recibe requests por el bus (el único con `sub.allow` de servicio).

pub:
  allow:
    # Requests salientes. Hoy core no llama a nadie; queda declarado.
    - "{{instance}}.{{user_id}}.>"
    # Los eventos de dominio al stream JIKU_EVENTS. CON la versión: sin ella se comería
    # `{{instance}}.events.auth`.
    - "{{instance}}.events.v1.>"
    # NO lleva `$JS.API`, y no le hace falta: `js.publish()` es un request al subject del
    # evento y el PubAck vuelve por el inbox. Las dos líneas de arriba son todo.

sub:
  allow:
    - "{{instance}}.*.jiku-commands.v1.>"
    - "{{instance}}.*.jiku-queries.v1.>"
    # El evento de autenticación del callout. LITERAL, nunca un wildcard sobre el namespace
    # de eventos. Sin esta línea core no espeja ninguna identidad y reinicia en loop.
    - "{{instance}}.events.auth"
    # Discovery de micro: sin esto core es invisible para `nats micro ls`, en silencio.
    - "$SRV.>"
    - "_INBOX.{{user_id_hash}}.>"

response:
  max: 1
  ttl: 45s
