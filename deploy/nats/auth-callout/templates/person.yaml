# PERSONA con un rol de producto (`admin`, `user`, `external-user`).
#
# QUÉ ES
#   Una persona de carne y hueso conectada al bus con su propio token de Zitadel, y no un
#   service user. Su identidad es su `sub`, igual que la de la api o la de un publicador
#   externo, y es lo que va como `<user-id>` en el subject: cada consulta queda atribuida
#   a la persona que la hizo, sin service user intermedio.
#
#   Las tres reglas de rules.yaml que apuntan acá son `admin`, `user` y `external-user`, y
#   las tres son `type: person`. Ese `type` es lo que hace que el evento de
#   `{instance}.events.auth` llegue con `identity_type: "person"`: no hay heurística que lo
#   adivine, lo declara la regla que ganó.
#
# POR QUÉ EXISTE
#   Para darle a una persona un camino de LECTURA DIRECTA al bus. Hasta que esta plantilla
#   existió, rules.yaml no tenía regla para los roles de producto y —sin catch-all— la
#   conexión se rechazaba: una persona solo podía leer a través de la api, por HTTP.
#
#   Lo que NO habilita es un camino de escritura. Los comandos los sigue publicando la api
#   con su propio service user, y esa parte no cambió.
#
# GRAMÁTICA
#   {instance}.{user-id}.{svc}.{version}.{método}
#     instance  despliegue (dev / prod)
#     user-id   QUIÉN llama: el `sub` del token de Zitadel, crudo — el de la persona
#     svc       A QUIÉN le habla: `jiku-queries`, las lecturas, atendidas por core. Es el
#               ÚNICO valor que este rol puede usar, y es el punto de toda la plantilla.
#     version   versión del protocolo: v1
#     método    projects.list, projects.get, tasks.list, tasks.get, comments.list,
#               comments.get
#
#   Ejemplo: dev.281234567890123456.jiku-queries.v1.projects.list
#
# PLACEHOLDERS
#   {{instance}}      la instancia de deploy
#   {{user_id}}       el `sub` del token, crudo (guion BAJO, no `{{user-id}}`)
#   {{user_id_hash}}  hash estable del user id — solo para el prefijo de inbox
#   {{service}}       el nombre del endpoint que atiende; una persona no atiende ninguno,
#                     así que esta plantilla NO lo usa y las tres reglas de persona no
#                     declaran `service`
#
# IDENTIDAD vs ENDPOINT
#   Su identidad es su `sub` de Zitadel. No atiende ningún endpoint: no tiene `sub.allow`
#   de servicio, solo publica consultas y escucha su propio inbox. Nadie la llama por el
#   bus y no hay `<svc>` que la nombre.
#
# ES EL PERMISO MÁS CHICO DEL DIRECTORIO, Y ES INTENCIONAL
#   api.yaml abre DOS prefijos enteros con `>`: el de las escrituras y el de las lecturas.
#   Esta plantilla es su inversa exacta: UNA sola línea de publicación —el prefijo de
#   consultas— y CERO escrituras.
#
#   De los cuatro tipos de caller de este directorio, la persona es el ÚNICO QUE PUBLICA Y
#   NO PUEDE ESCRIBIR: los otros dos que publican —api y core— pueden los dos. El
#   observador tampoco escribe, pero porque no publica NADA (`pub.allow: []`), y es un rol
#   de diagnóstico local, no un caller del producto.
#
#   Contando permisos, esta plantilla tiene DOS y es la más chica de las cuatro:
#   api 3, observer 5, core 6. El inbox propio como única suscripción NO es exclusivo suyo
#   —api tiene el mismo—: lo distintivo es la combinación de ese inbox con cero escrituras.
#
#   AQUÍ SE CONTABAN CINCO. La quinta era external-publisher.yaml, que enumeraba nueve
#   subjects de escritura y ninguna consulta; el rol se eliminó del producto porque nunca
#   existió en Zitadel, y con él su plantilla.
#
# LAS TRES COSAS QUE NO ESTÁN, Y POR QUÉ
#   1. NINGUNA ESCRITURA. El prefijo de comandos del protocolo —el que api.yaml abre con
#      `>`— NO aparece en
#      `pub.allow`, y agregarlo "por adelantado" sería una AMPLIACIÓN REAL de la superficie
#      de escritura. api.yaml se autorizó las consultas por adelantado y lo justificó
#      diciendo que "un permiso sobre un subject sin suscriptores no hace absolutamente
#      nada"; acá el argumento NO aplica al revés, porque core SÍ está suscripto al prefijo
#      de escrituras. Habilitarlo requiere antes mudar a core reglas de negocio que hoy
#      solo viven en la api: la ventana de carga de horas, quién puede imputar horas a otra
#      persona, y no modificar semanas pasadas de asignación.
#   2. SIN `$SRV.>`. Es discovery y stats del protocolo micro: qué servicios hay, en qué
#      versión y con qué endpoints. Una persona no atiende ningún endpoint y no necesita
#      enumerar los servicios del bus; dárselo sería exponerle metadata del protocolo sin
#      un caso de uso que lo pida. Es el mismo criterio con que api.yaml tampoco lo tiene.
#      Los únicos que lo declaran son core.yaml —lo necesita para ser visible en
#      `nats micro ls`— y observer.yaml, que es el rol de diagnóstico local.
#   3. SIN SUSCRIPCIÓN DE SERVICIO. `sub.allow` no tiene ninguna línea de la forma
#      instancia + comodín + endpoint, ni usa `{{service}}`: nadie le manda requests a una
#      persona.
#
#   LAS TRES AUSENCIAS SON EL ENTREGABLE, no un archivo a medio escribir. Si alguna te
#   parece un olvido, la respuesta está en el párrafo de arriba antes que en un commit.
#
# POR QUÉ NO HAY BLOQUE `response:`
#   Es la única de las cinco plantillas sin él, y NO es un olvido. `response`
#   (`allow_responses` de NATS) autoriza a CONTESTAR en el subject de un request RECIBIDO,
#   y una persona nunca recibe requests: su `sub.allow` es solo su propio inbox, sin
#   ninguna suscripción de servicio. El bloque sería configuración muerta. Lo que permite
#   que core le conteste a la persona es el `response` de core.yaml, no uno de acá.
#
# LA SEGUNDA CAPA VIVE EN core, Y NO ES OPCIONAL
#   Esta plantilla es la primera de dos garantías independientes de que una persona no
#   escriba. La otra es el mapa rol -> método de core (`core/src/authorize-caller.ts`), que
#   para `admin`, `user` y `external-user` autoriza TODAS las consultas y NINGÚN comando.
#   Cada una alcanza por sí sola: si esta plantilla ganara un permiso de escritura por
#   error, core igual responde `caller_not_authorized`. Un rol nuevo con acceso al bus se
#   declara en los DOS lugares.

pub:
  allow:
    # Consultas hacia core, bajo su propia identidad. El `>` final cubre los seis métodos
    # del servicio de lecturas, Y ESE ES EL ÚNICO LUGAR DONDE VA EL COMODÍN: subirlo un
    # segmento —`{{instance}}.{{user_id}}.>`— le daría también las escrituras, que es
    # exactamente lo que esta plantilla existe para no dar. Si tenés que tocar esta línea,
    # leé antes el bloque "LAS TRES COSAS QUE NO ESTÁN" del encabezado.
    - "{{instance}}.{{user_id}}.jiku-queries.v1.>"

sub:
  allow:
    # Inbox propio: por acá llegan las respuestas de core. Va bajo el HASH del user id,
    # no el user id crudo.
    #
    # EL CLIENTE DEBE FIJAR ESTE PREFIJO AL CONECTAR (`inboxPrefix` en nats.js). Si no lo
    # hace, la librería genera un _INBOX.<aleatorio> que ningún permiso autoriza y las
    # respuestas NUNCA LLEGAN. El síntoma es un TIMEOUT, no un error de permisos, y es el
    # error más caro de diagnosticar de esta plantilla.
    #
    # Para saber qué hash le toca a un usuario: `go run ./cmd/session <sub>` en el repo
    # de auth-callout.
    - "_INBOX.{{user_id_hash}}.>"
