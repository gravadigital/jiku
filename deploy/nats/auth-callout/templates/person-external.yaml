# Personas con rol `external-user`: SOLO consultas. Ver README.md.
#
# Es el permiso más chico del directorio, y la ausencia de escrituras es el entregable:
# `external-user` escribe solo por el portal, vía HTTP a la api (RF-1 §20 de REQ-007).
# La segunda defensa es `commands: []` en el mapa de core; cada capa alcanza por sí sola.

pub:
  allow:
    # Sin prefijo de comandos. Agregarlo "por adelantado" es una ampliación real.
    - "{{instance}}.{{user_id}}.jiku-queries.v1.>"

sub:
  allow:
    # El cliente DEBE fijar `inboxPrefix`, o las respuestas nunca llegan (síntoma: timeout).
    - "_INBOX.{{user_id_hash}}.>"
