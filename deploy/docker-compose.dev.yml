# Desarrollo local: buildea desde las carpetas del repo, expone puertos
# y no depende de redes externas ni de un proxy de ingress.
#
#   cd deploy && cp .env.dist .env && docker compose -f docker-compose.dev.yml up
#
# Los fronts se sirven builded (no hot reload): el objetivo es tener el
# stack completo levantado. Para iterar en un front conviene correrlo
# aparte con `npm run dev` apuntando a la api de este compose.
name: jiku-dev

services:
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: jiku-dev-web
    ports:
      - "3001:3000"
    environment:
      # Toda la configuración va en runtime: la imagen no lleva nada horneado.
      - API_URL=http://api:3000/
      - APP_NAME=${APP_NAME:-Jiku}
      - AUTH_URL=http://localhost:3001
      - AUTH_SECRET=${WEB_NEXTAUTH_SECRET:-devsecret}
      - ZITADEL_ISSUER=${IDENTITY_ISSUER}
      - ZITADEL_CLIENT_ID=${IDENTITY_CLIENT_ID}
      - ZITADEL_PROJECT_ID=${IDENTITY_PROJECT_ID}
    networks:
      - jiku

  opus-web:
    build:
      context: ..
      dockerfile: opus-web/Dockerfile
    container_name: jiku-dev-opus-web
    ports:
      - "3002:3000"
    environment:
      # El navegador pega al mismo origen; el proxy de Next reenvía a esta URL.
      - API_URL=http://api:3000/
      - NEXTAUTH_URL=http://localhost:3002
      - NEXTAUTH_SECRET=${OPUS_NEXTAUTH_SECRET:-devsecret}
      - ZITADEL_ISSUER=${IDENTITY_ISSUER}
      - ZITADEL_CLIENT_ID=${IDENTITY_CLIENT_ID}
      - ZITADEL_PROJECT_ID=${IDENTITY_PROJECT_ID}
    networks:
      - jiku

  nats:
    image: nats:2.10-alpine
    container_name: jiku-dev-nats
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "4222:4222"   # clientes
      - "8222:8222"   # monitoreo: http://localhost:8222
    volumes:
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - ./nats/creds:/etc/nats/creds:ro
    networks:
      - jiku

  auth-callout:
    image: ${AUTH_CALLOUT_IMAGE}:${AUTH_CALLOUT_VERSION}
    container_name: jiku-dev-auth-callout
    environment:
      # Prefijo CALLOUT_*: es el contrato de la imagen publicada.
      - CALLOUT_SERVER_MODE=operator
      - CALLOUT_NATS_URL=nats://nats:4222
      - CALLOUT_HANDLER_CREDS=/etc/nats-creds/sentinel-handler.creds
      - CALLOUT_APP_ACCOUNT_SK_SEED=/etc/nats-creds/app-account.sk.seed
      - CALLOUT_APP_ACCOUNT_PUB=/etc/nats-creds/app-account.pub
      - CALLOUT_AUTH_ACCOUNT_SK_SEED=/etc/nats-creds/auth-account.sk.seed
      - CALLOUT_XKEY_SEED=/etc/nats-creds/callout-xkey.seed
      - CALLOUT_RULES_PATH=/etc/auth-callout/rules.yaml
      - CALLOUT_INSTANCE=${NATS_INSTANCE}
      # `mock` decodifica la identidad del texto del token (`mock:<sub>:<user>:<roles>`),
      # sin secretos ni red. NO sirve para producción: acepta cualquier identidad.
      - CALLOUT_IDP_MODE=${GESTION_IDP_MODE:-mock}
      - CALLOUT_ZITADEL_ISSUER_URL=${GESTION_ZITADEL_ISSUER_URL}
      - CALLOUT_ZITADEL_PROJECT_ID=${GESTION_ZITADEL_PROJECT_ID}
      # Eventos de autenticación: el callout publica uno por conexión autenticada. La
      # credencial la emite nats/add-events-user.sh y SIN EL ARCHIVO EL CALLOUT NO ARRANCA.
      # OJO CON EL MOCK: con CALLOUT_IDP_MODE=mock el token no trae `name` ni `email` y no hay
      # userinfo al que llamar, así que los eventos llegan con esos campos vacíos y la guarda
      # de obligatorios de core LOS DESCARTA TODOS. El camino feliz del evento se verifica en
      # docker-compose.local.yml (Zitadel real) o publicándolo a mano con `nats pub`, no acá.
      - CALLOUT_EVENTS_SUBJECT=${NATS_INSTANCE}.events.auth
      - CALLOUT_EVENTS_CREDS=/etc/nats-creds/callout-events.creds
      # Se pone igual que en los otros dos compose para que cambiar GESTION_IDP_MODE=zitadel
      # acá no herede un stack que descarta todo. Con el mock no tiene a quién preguntarle.
      - CALLOUT_IDP_ENRICH=profile
      #
      # NO HAY CALLOUT_EVENTS_STREAM, Y ES DELIBERADO acá igual que en los otros dos: elige el
      # MODO DE ENTREGA, no nombra un stream, y agregarla sola es un arranque fallido del
      # callout. El detalle completo está en docker-compose.yml, donde vive el bloque canónico.
      - CALLOUT_LOG_LEVEL=debug
    volumes:
      - ./nats/auth-callout:/etc/auth-callout:ro
      - ./nats/creds:/etc/nats-creds:ro
    depends_on:
      - nats
    networks:
      - jiku

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: jiku-dev-api
    ports:
      - "3000:3000"
    environment:
      # Credenciales de SOLO LECTURA: la api no escribe.
      - POSTGRESQL_DB=${DATABASE_NAME}
      - POSTGRESQL_USER=${DATABASE_READONLY_USER}
      - POSTGRESQL_PASSWORD=${DATABASE_READONLY_PASSWORD}
      - POSTGRESQL_HOST=database
      # Las migraciones corren al arrancar y necesitan escribir.
      - POSTGRESQL_MIGRATION_USER=${DATABASE_USER}
      - POSTGRESQL_MIGRATION_PASSWORD=${DATABASE_PASSWORD}
      - IDENTITY_URL=${IDENTITY_URL}
      - NATS_URL=nats://nats:4222
      - NATS_CREDS=/run/secrets/nats.creds
      - ZITADEL_SERVICE_USER_KEY_B64=${API_SERVICE_USER_KEY_B64}
      - ZITADEL_ISSUER_URL=${GESTION_ZITADEL_ISSUER_URL}
      - ZITADEL_PROJECT_ID=${GESTION_ZITADEL_PROJECT_ID}
      - NATS_INSTANCE=${NATS_INSTANCE}
      # Los DOS nombres de servicio del bus: la api publica los comandos en uno y las
      # consultas en el otro. El auth-callout autoriza los dos prefijos en
      # nats/auth-callout/templates/api.yaml.
      - NATS_COMMAND_SERVICE=${NATS_COMMAND_SERVICE}
      - NATS_QUERY_SERVICE=${NATS_QUERY_SERVICE}
      - NATS_PROTOCOL_VERSION=${NATS_PROTOCOL_VERSION}
      - NATS_REQUEST_TIMEOUT_MS=${NATS_REQUEST_TIMEOUT_MS}
      # Cuánto espera la api la respuesta de una CONSULTA. Más holgado que el de comandos, y
      # por encima del statement_timeout de la conexión de lectura de core, para que la base
      # corte primero y el error sea explicable en vez de un timeout mudo del bus.
      - NATS_QUERY_TIMEOUT_MS=${NATS_QUERY_TIMEOUT_MS}
    volumes:
      - ./nats/creds/sentinel-client.creds:/run/secrets/nats.creds:ro
    depends_on:
      - nats
      - database
    networks:
      - jiku

  core:
    build:
      # El contexto es el root: estos servicios usan los paquetes de packages/.
      context: ..
      dockerfile: core/Dockerfile
    container_name: jiku-dev-core
    environment:
      - POSTGRESQL_DB=${DATABASE_NAME}
      - POSTGRESQL_USER=${DATABASE_USER}
      - POSTGRESQL_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRESQL_HOST=database
      # Conexión de SOLO LECTURA para las consultas que entran por el bus. Reusa el MISMO
      # rol de solo lectura que ya usa la api: es de solo lectura y no hay razón para
      # duplicar una credencial en dos claves de .env — eso es lo que se desincroniza en la
      # primera rotación de contraseña, con core leyendo con la vieja y la api con la nueva.
      - POSTGRESQL_READ_USER=${DATABASE_READONLY_USER}
      - POSTGRESQL_READ_PASSWORD=${DATABASE_READONLY_PASSWORD}
      - POSTGRESQL_READ_POOL_MAX=${POSTGRESQL_READ_POOL_MAX}
      # Corte de la sentencia de lectura, ESTRICTAMENTE MENOR que NATS_QUERY_TIMEOUT_MS: la
      # base tiene que vencer antes que el bus, o el caller espera sin saber por qué.
      - POSTGRESQL_STATEMENT_TIMEOUT_MS=${POSTGRESQL_STATEMENT_TIMEOUT_MS}
      - NATS_URL=nats://nats:4222
      - NATS_CREDS=/run/secrets/nats.creds
      # La key del service user, en base64: el servicio pide el token y lo renueva solo.
      - ZITADEL_SERVICE_USER_KEY_B64=${CORE_SERVICE_USER_KEY_B64}
      - ZITADEL_ISSUER_URL=${GESTION_ZITADEL_ISSUER_URL}
      - ZITADEL_PROJECT_ID=${GESTION_ZITADEL_PROJECT_ID}
      - NATS_INSTANCE=${NATS_INSTANCE}
      # Los DOS nombres de servicio del bus: core atiende los dos endpoints en el MISMO
      # proceso y con una sola conexión. El auth-callout autoriza las dos suscripciones en
      # nats/auth-callout/templates/core.yaml.
      - NATS_COMMAND_SERVICE=${NATS_COMMAND_SERVICE}
      - NATS_QUERY_SERVICE=${NATS_QUERY_SERVICE}
      # Versión que core anuncia al registrarse como servicio micro en el bus. SemVer
      # ESTRICTO: micro valida con la regex oficial y rechaza cualquier otra cosa, así que un
      # valor mal formado es un arranque fallido. NO se ata a ${CORE_VERSION}: el tag de la
      # imagen y la versión que el bus publica no tienen por qué moverse juntos.
      - SERVICE_VERSION=${SERVICE_VERSION}
      - NATS_PROTOCOL_VERSION=${NATS_PROTOCOL_VERSION}
      # Queue group de la suscripción de core al evento de autenticación
      # ({instance}.events.auth). La lee SOLO core: la api no consume el evento.
      # EL PERMISO DE ESA SUSCRIPCIÓN VIVE EN nats/auth-callout/templates/core.yaml —
      # sin la línea de `sub.allow` de ahí, core loguea que se suscribió y acto seguido se
      # cae con `PERMISSIONS_VIOLATION`: reinicia en loop sin espejar una sola identidad.
      - NATS_EVENTS_QUEUE=${NATS_EVENTS_QUEUE:-jiku-events}
      # A diferencia de los otros dos compose, acá lleva default: este archivo levanta el
      # stack con el IdP mock del callout y `cp .env.dist .env` sin editar, y el assert de core
      # rechaza el valor vacío además del ausente. No hay service user real cuyo `sub` proteger.
      - CORE_TRUSTED_PUBLISHER_ID=${CORE_TRUSTED_PUBLISHER_ID:-dev-api-service-user}
      # Storage: core es el dueño del bucket. Se leen perezosamente, al primer comando de
      # files, así que el servicio arranca aunque no haya bucket en este entorno.
      - STORAGE_S3_ENDPOINT=${STORAGE_S3_ENDPOINT}
      - STORAGE_S3_CREDENTIALS_ACCESSKEY=${STORAGE_S3_CREDENTIALS_ACCESSKEY}
      - STORAGE_S3_CREDENTIALS_SECRETKEY=${STORAGE_S3_CREDENTIALS_SECRETKEY}
      - STORAGE_S3_BUCKETNAME=${STORAGE_S3_BUCKETNAME}
      - STORAGE_S3_REGION=${STORAGE_S3_REGION}
      - STORAGE_S3_FORCEPATHSTYLE=${STORAGE_S3_FORCEPATHSTYLE}
      - STORAGE_S3_KEY_PREFIX=${STORAGE_S3_KEY_PREFIX}
    volumes:
      - ./nats/creds/sentinel-client.creds:/run/secrets/nats.creds:ro
    depends_on:
      - nats
      - database
    networks:
      - jiku

  database:
    image: postgres:15.4-alpine3.18
    container_name: jiku-dev-database
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    environment:
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - jiku-dev-database-data:/var/lib/postgresql/data
    networks:
      - jiku

volumes:
  jiku-dev-database-data:

networks:
  jiku:
