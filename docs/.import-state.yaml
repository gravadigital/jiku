    gaps: docs/ux/gaps-as-is.md
    cross_surface_flows: docs/ux/cross-surface-flows.md
    audiences:
      - equipo-interno
      - cliente
    surfaces:
      web:
        screens: 25
        viewports: [desktop]
        accent: "#DA2C6A"
        wireframes: docs/ux/surfaces/web/wireframes.excalidraw
        wireframe_stats: "4431 elementos, 115 frames, 51 flechas · 25 pantallas + 9 overlays (O-10 excluido: codigo muerto)"
      opus-web:
        screens: 5
        viewports: [desktop, mobile]
        accent: "#2563eb"
        breakpoint: 768
        wireframes: docs/ux/surfaces/opus-web/wireframes.excalidraw
