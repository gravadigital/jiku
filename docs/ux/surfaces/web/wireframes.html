:root{
  --ink:#1f2328; --mut:#7a828a; --line:#c3c9cf; --fill:#f4f6f8; --paper:#fff;
  --accent:#DA2C6A; --ann:#b0468c; --u:8px;
}
*{box-sizing:border-box;margin:0}
body{font-family:Excalifont,'Patrick Hand','Comic Neue',system-ui,sans-serif;
  color:var(--ink);background:#eceff1;display:flex;height:100vh;overflow:hidden;font-size:14px}

/* ---- chrome of the book itself (not the wireframe) ---- */
aside.book{width:250px;flex:0 0 auto;background:#fafbfc;border-right:1px solid var(--line);
  overflow:auto;padding:14px;font-family:system-ui,sans-serif}
aside.book h1{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:10px}
aside.book a{display:block;padding:7px 9px;border-radius:5px;color:var(--ink);
  text-decoration:none;font-size:13px;cursor:pointer}
aside.book a:hover{background:#eef1f4}
aside.book a.on{background:var(--ink);color:#fff}
aside.book .vp{font-size:11px;color:var(--mut);margin-left:6px}
main.book{flex:1;overflow:auto;padding:20px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;
  font-family:system-ui,sans-serif}
.bar button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:5px 11px;
  font-size:12px;cursor:pointer;font-family:inherit}
.bar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar .sep{width:1px;height:20px;background:var(--line)}
.bar .rt{margin-left:auto;font-size:12px;color:var(--mut)}
body.noann .wf-ann{display:none}

/* ---- the wireframe frame ---- */
.wf-screen{background:var(--paper);border:2px solid var(--ink);margin:0 auto;
  display:flex;flex-direction:column;min-height:600px;transition:width .15s ease}
.wf-body{flex:1;display:flex;flex-direction:column;min-width:0}
.wf-header{height:52px;flex:0 0 auto;border-bottom:2px solid var(--ink);display:flex;
  align-items:center;justify-content:space-between;padding:0 14px}
.wf-burger{font-size:20px}

/* ---- layout: real CSS grid ---- */
.wf-row{display:grid;gap:calc(var(--u)*1.5);align-items:start;padding:0}
.wf-row>*{min-width:0}                     /* else grid children refuse to shrink */
.wf-col{display:flex;flex-direction:column;gap:calc(var(--u)*1.25);min-width:0}
.wf-pad{padding:calc(var(--u)*2);gap:calc(var(--u)*1.25)}

.wf-body>.wf-row{flex:1;gap:0;align-items:stretch}

  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.wf-area{min-height:90px;align-items:flex-start;color:var(--mut)}

/* border-box so the declared %ages stay true once padding is added — otherwise the last

  background:var(--line)}
.wf-switch.on::after{left:auto;right:2px;background:var(--ink)}
.wf-slider{position:relative;height:20px;display:flex;align-items:center}

#x27;, block: &#x27;start&#x27; }) tras un setTimeout de 100ms. El scroll no mueve el foco, así que un lector de pantalla no anuncia el salto</p><div class=\"wf-section\">Grupo del proyecto · &lt;div id=&quot;project-{id}&quot;&gt;</div><p class=\"wf-ann\">un grupo por proyecto en pila vertical, sin paginación ni límite. El layout dibuja dos grupos para mostrar la repetición: es el mismo bloque, cambian el nombre del proyecto y las horas del mes</p><div class=\"wf-row\" style=\"grid-template-columns:7fr 3fr 2fr\"><div class=\"wf-col\"><h2 class=\"wf-h\">Portal Opus</h2><p class=\"wf-ann\">el nombre del proyecto, vía la prop title de &lt;ObjectivesGroup&gt;. El &lt;h2&gt; contiene un &lt;div&gt; y un &lt;button&gt;, así que su nombre accesible queda como &quot;{proyecto} {horas} add icon&quot;</p></div><div class=\"wf-col\"><span class=\"wf-badge\" data-kind=\"\">142 hs 30 min</span><p class=\"wf-ann\">horas trabajadas en el mes, calculadas en la página con Math.floor(monthWorkedMinutes / 60) y el resto en minutos. Solo se renderiza si currentMonthHours está definido: en tareas-por-responsable no se pasa y el tag no aparece</p><div class=\"wf-tip\">Trabajadas en el mes</div><p class=\"wf-ann\">visible solo al hacer hover sobre tag-horas-mes: es un &lt;div&gt; con clase mostrado por CSS, no el componente &lt;Tooltip&gt;, sin ARIA y sin alcance por teclado</p></div><div class=\"wf-col\"><div class=\"wf-goto\" data-goto=\"alta-tareas\" title=\"nueva tarea del proyecto\"><button class=\"wf-btn\" data-variant=\"secondary\">+</button><p class=\"wf-ann\">sin texto visible: el &lt;AddButton&gt; solo contiene una &lt;Image alt=&quot;add icon&quot;&gt;, sin aria-label. El texto útil (&quot;Crear una nueva tarea asociada&quot;) está en el title de la imagen. buildHref() agrega ?projectId={id} para precargar el proyecto en el alta</p></div></div></div><ul class=\"wf-list\"><li><span class=\"wf-thumb\"></span><span><b>Endpoint de exportación</b><i>Lautaro Álvarez · 12 hs 30 min trabajadas · VENCE HOY</i></span></li><li><span class=\"wf-thumb\"></span><span><b>Migrar el bus de eventos</b><i>Mariana Pérez · 6 hs trabajadas · Cierra en 4 días</i></span></li><li><span class=\"wf-thumb\"></span><span><b>Alta de suscriptores por proyecto</b><i>Sofía Godoy · 45 min trabajados · Cierre estimado N/D</i></span></li><li><span class=\"wf-thumb\"></span><span><b>Reporte de horas por actor</b><i>Lautaro Álvarez · 3 hs 15 min trabajadas · VENCIDO HACE 2 días</i></span></li><li><span class=\"wf-thumb\"></span><span><b>Adjuntos del requisito #1042</b><i>Mariana Pérez · 1 h trabajada · CIERRA EN 2 días</i></span></li></ul><p class=\"wf-ann\">es el &lt;div className={styles.containerObjectives}&gt; que contiene las card-tarea de abajo (las mismas tareas): display grid con repeat(auto-fit, minmax(350px, 1fr)) y 4 columnas fijas a partir de 1680px. Sin role=&quot;list&quot; ni conteo</p><div class=\"wf-row\" style=\"grid-template-columns:4fr 4fr 4fr\"><div class=\"wf-col wf-card\"><div class=\"wf-goto\" data-goto=\"detalle-tarea\" title=\"abre la tarea\"><div class=\"wf-card wf-cardblock\"><b>Endpoint de exportación</b></div><p class=\"wf-ann\">la card entera es un &lt;Link&gt; a /objectives/{id}. getCardClass() devuelve uno de cinco data-state de vencimiento: finished · expiresToday · expired · closeToDeadline · default. Su nombre accesible es todo el texto de la card (estado, área, responsable, horas y las tres fechas), que el lector lee completo como nombre del enlace</p></div><div class=\"wf-row\" style=\"grid-template-columns:9fr 3fr\"><div class=\"wf-col\"><div class=\"wf-goto\" data-goto=\"dropdown-estado-tarea\" title=\"cambia estado inline\"><div class=\"wf-field\"><div class=\"wf-ctl\">Activo<span class=\"wf-caret\">▾</span></div></div><p class=\"wf-ann\">&lt;StateTag&gt;: es un &lt;button&gt; dentro del &lt;Link&gt; de la card (contenido interactivo anidado), sin aria-expanded, sin cierre por click afuera ni Escape. Ofrece las 5 opciones incluso en u "wf-thumb\"></span><span><b>Presente → Portal Opus → #1042 Exportar reporte a Excel</b><i>1h 30min</i></span></li><li><span class=\"wf-thumb\"></span><span><b>Presente → Portal Opus → #1042 Exportar reporte a Excel → 842 Endpoint de exportación</b><i>0h 30min</i></span></li><li><span class=\"wf-thumb\"></span><span><b>Ausente → Trámite</b><i>1h 0min</i></span></li></ul><p class=\"wf-ann\">&lt;li className={styles.entry}&gt; (:188, :206). La etiqueta de una carga presente se compone con steps.join(&#x27; → &#x27;) a partir de [&quot;Presente&quot;, projectName] más requisito y tarea, con &quot;Proyecto desconocido&quot; como fallback (:135-136); las ausencias son `Ausente → ${motivo}` (:206-207). hasEntries considera las dos listas (horas y ausencias) (:102)</p></div></div><div class=\"wf-col\"><button class=\"wf-btn\" data-variant=\"tertiary\">Eliminar</button><p class=\"wf-ann\">sin texto visible: papelera con aria-label `Eliminar ${label}` en las cargas (DayEntriesList.tsx:197) y `Eliminar ausencia: ${motivo}` en las ausencias (:216), que sí dicen de qué registro se trata. Va uno por cada item-carga; se deshabilita mientras corre alguna de las dos mutaciones de borrado (:166)</p></div></div><p class=\"wf-ann\">cada &lt;li&gt; de la lista lleva su propio icono de tipo a la izquierda y su botón de borrar a la derecha</p></div></div><div class=\"wf-modalwrap\"><div class=\"wf-modal\"><b>Eliminar registro</b><p class=\"wf-p\">¿Estás seguro de que querés eliminar este registro de horas? · Cancelar · Eliminar</p></div></div><p class=\"wf-ann\">se abre desde boton-borrar-carga (sub-estado confirmación de borrado, DayEntriesList.tsx:225-235). &lt;ConfirmDialog&gt; con &lt;dialog&gt; nativo y showModal() (ConfirmDialog.tsx:35): el focus trap, el Escape y la devolución del foco al disparador los aporta el navegador. Relevado también como overlay compartido en _overlays.md</p><div class=\"wf-modalwrap\"><div class=\"wf-modal\"><b>Eliminar ausencia</b><p class=\"wf-p\">¿Queré pense&gt; de la página (worked-times/page.tsx:20): durante el loading inicial reemplaza toda la pantalla</p><div class=\"wf-row\" style=\"grid-template-columns:12fr\"><div class=\"wf-col wf-card\"><div class=\"wf-card wf-cardblock\"><b>Carga del día</b></div><p class=\"wf-ann\">&lt;div className={styles.formCard}&gt; (:241): pila vertical con cuatro &lt;hr&gt; como separadores explícitos (:252, :263, :267, :292)</p><div class=\"wf-field\"><label>Persona</label><div class=\"wf-ctl\">Seleccionar persona...<span class=\"wf-caret\">▾</span></div></div><p class=\"wf-ann\">solo se renderiza para admin (:243) — permite cargar horas en nombre de otra persona. Sin él la persona es la propia, resuelta desde zitadelId contra /persons (:88-91). usePersons no maneja isError: ante un fallo el select queda vacío</p><div class=\"wf-section\"></div><p class=\"wf-ann\">&lt;hr className={styles.divider}&gt; — separa semánticamente los bloques del formulario</p><div class=\"wf-section\">Lun 10 · Mar 11 · Mié 12 · Jue 13 · Vie 14 · Lun 17 · Mar 18 · Mié 19</div><p class=\"wf-ann\">muestra los últimos 8 días hábiles, no una semana: el bucle recorre hacia atrás desde hoy y saltea sábados y domingos (DaySelector.tsx:46), acumulando 8 y ordenándolos con unshift. En un lunes los 8 días llegan hasta el miércoles de la semana anterior. No hay navegación a otros períodos: no se puede corregir una carga de hace más de 8 días hábiles (:38-56)</p><div class=\"wf-row\" style=\"grid-template-columns:1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr\"><div class=\"wf-col\"><button class=\"wf-btn\" data-variant=\"secondary\">Mié 19</button><p class=\"wf-ann\">&lt;button aria-pressed aria-current&gt; por día (DaySelector.tsx:63-78): nombres verbatim [&quot;Dom&quot;,&quot;Lun&quot;,&quot;Mar&quot;,&quot;Mié&quot;,&quot;Jue&quot;,&quot;Vie&quot;,&quot;Sáb&quot;] (:16) más el número de la fecha. El día elegido va en primary; el nombre accesible no incluye el estado de carga</p><span class=\"wf-icon\" title=\"semaforo-dia\ la mutación los botones se deshabilitan pero no muestran spinner</p></div></div>"}}}, {"name": "dropdown-estado-tarea", "displayName": "Dropdown de estado de tarea", "route": "", "viewports": ["desktop"], "states": ["default"], "overlay": true, "overlayType": "popover", "triggeredBy": "listado-tareas", "widths": {"desktop": 1440}, "html": {"desktop": {"default": "<div class=\"wf-screen\"><div class=\"wf-body wf-pad\"><span class=\"wf-badge\" data-kind=\"\">Activo</span><p class=\"wf-ann\">es un &lt;button&gt; sin aria-expanded ni aria-haspopup</p><div class=\"wf-field\"><div class=\"wf-ctl\">Estados<span class=\"wf-caret\">▾</span></div></div><p class=\"wf-ann\">el menú es un &lt;div&gt; con &lt;button&gt;s: sin role=listbox/option, sin navegación por flechas, sin cierre por click afuera y sin Escape. Es el dropdown más usado del producto (tablas y cards de tarea) y el menos accesible. Una tarea finalizada o cancelada ofrece las mismas 5 opciones, incluida volver a activo</p><div class=\"wf-toast\" data-kind=\"success\">⚠ Se cambió el estado de la tarea a en_revision</div><p class=\"wf-ann\">interpola el valor crudo de la api en vez de la etiqueta, aunque el mapa de etiquetas está en el mismo archivo. Error: &quot;Hubo un error al cambiar el estado&quot;. No hay loading: la pill se puede clickear de nuevo mientras la mutación está en vuelo</p></div></div>"}}}, {"name": "pills-clasificacion", "displayName": "Pills de estado / tipo / prioridad", "route": "", "viewports": ["desktop"], "states": ["default"], "overlay": true, "overlayType": "popover", "triggeredBy": "detalle-requisito", "widths": {"desktop": 1440}, "html": {"desktop": {"default": "<div class=\"wf-screen\"><div class=\"wf-body wf-pad\"><span class=\"wf-badge\" data-kind=\"\">Desarrollo</span><p class=\"wf-ann\">&lt;button aria-haspopup=listbox aria-expanded&gt;: resuelve el mismo problema que StateTag pero con el juego completo de ARIA</p><div class=\"wf-field\"><div class=\"wf-ctl\">Estado<span class=\"w o: el picker es inalcanzable sin mouse. El alt del icono dice &quot;calendar icon&quot;: describe el icono, no su función</p><div class=\"wf-field\"><div class=\"wf-ctl\">Agosto 2026<span class=\"wf-caret\">▤</span></div></div><p class=\"wf-ann\">&lt;DatePicker inline&gt; montado por ReactDOM.createPortal, posicionado en absoluto según el getBoundingClientRect() del contenedor. Si el &lt;div&gt; del portal no existe, el picker no se abre y no hay aviso. Cierra por click afuera y con Escape (los aporta react-datepicker). El cambio de fecha no se anuncia</p></div></div>"}}}, {"name": "menu-react-select", "displayName": "Menú de react-select", "route": "", "viewports": ["desktop"], "states": ["default"], "overlay": true, "overlayType": "popover", "triggeredBy": "alta-proyecto", "widths": {"desktop": 1440}, "html": {"desktop": {"default": "<div class=\"wf-screen\"><div class=\"wf-body wf-pad\"><div class=\"wf-field\"><div class=\"wf-ctl\"><span class=\"wf-ico\">⌕</span>Buscar…</div></div><p class=\"wf-ann\">presente en 6 pantallas con selects de búsqueda</p><div class=\"wf-field\"><div class=\"wf-ctl\">Opciones<span class=\"wf-caret\">▾</span></div></div><p class=\"wf-ann\">aporta un cuarto comportamiento de dropdown al producto, con su propia accesibilidad y sus propios estilos, duplicados en 6 archivos. Sin resultados: &quot;Sin resultados&quot;. En carga-horas las opciones vienen agrupadas por tipo</p></div></div>"}}}, {"name": "tooltip", "displayName": "Tooltip", "route": "", "viewports": ["desktop"], "states": ["default"], "overlay": true, "overlayType": "popover", "triggeredBy": "detalle-tarea", "widths": {"desktop": 1440}, "html": {"desktop": {"default": "<div class=\"wf-screen\"><div class=\"wf-body wf-pad\"><div class=\"wf-tip\">Visible para externos</div><p class=\"wf-ann\">componente de 17 líneas, sin estado y sin ningún handler: el &lt;p&gt; está siempre en el DOM y la visibilidad la resuelve el CSS. El único selector es :hover, sin :focus ni :focus-visible, así que es inalcanzable por teclado. Sin role=tooltip ni aria-describedby. white-space: nowrap, así que un mensaje largo se estira en una línea y puede salir del viewport, sin reposicionamiento. 10 usos en el producto</p></div></div>"}}}, {"name": "acordeon-campos-estado", "displayName": "Acordeón de campos de estado", "route": "", "viewports": ["desktop"], "states": ["default"], "overlay": true, "overlayType": "popover", "triggeredBy": "detalle-requisito", "widths": {"desktop": 1440}, "html": {"desktop": {"default": "<div class=\"wf-screen\"><div class=\"wf-body wf-pad\"><div class=\"wf-section\">✓ Alcance — Qué se acordó con el cliente / qué entendió el equipo, y cómo impacta...</div><p class=\"wf-ann\">O-09 es in-place, no un overlay real: el acordeón se abre dentro del panel del requisito. Figura en el inventario de overlays del product-map por trazabilidad. in-place, no es un overlay real: se lista acá porque el inventario del producto lo agrupa con ellos. Cuáles se abren por defecto depende del estado real del requisito: analisis → Alcance; planificacion → Propuesta + Criterios; en_cola → Cierre estimado. En desarrollo, revision y los terminales no se abre ninguno</p><span class=\"wf-badge\" data-kind=\"\">✓ / !</span><p class=\"wf-ann\">✓ con valor, ! sin valor. Es informativo, no bloqueante: la transición de estado no exige que el campo del paso esté completo</p></div></div>"}}}, {"name": "cajon-actores", "displayName": "Cajón de actores (código muerto)", "route": "", "viewports": ["desktop"], "states": ["default"], "overlay": true, "overlayType": "drawer", "triggeredBy": "listado-actores", "widths": {"desktop": 1440}, "html": {"desktop": {"default": "<div class=\"wf-screen\"><div class=\"wf-header\"><b>Actores</b></div><div class=\"wf-body wf-pad\"><ul class=\"wf-list\"><li><span class=\"wf-thumb\"></span><span><b>Grava Digital</b></span></li><li><span class=\"wf-thumb\"></span><span><b>Municipalidad de Rosario</b></span></li><li><span class=\"wf-thumb\"></span><span><b>Cooperativa El Surco</b></span></li></ul><p class=\"wf-ann\">loading: &quot;Cargando...&quot; · empty: &quot;No hay actores disponibles.&quot;, mientras listado-actores dice &quot;No hay actores que coincidan con estos filtros.&quot;: dos textos para el mismo vacío</p><div class=\"wf-alert\" data-kind=\"warning\">Ningún componente lo importa: no es alcanzable desde la interfaz.</div><p class=\"wf-ann\">se releva porque está en el árbol de archivos y su contenido se solapa con listado-actores. Usa useClients({ enabled: isOpen }), o sea que estaba pensado para no traer datos hasta abrirse. No se puede determinar desde el código si es una feature planeada, una removida, o de otra iteración</p></div></div>"}}}];</script>
<script>
const S = window.__SCREENS__;
const stage = document.getElementById('stage');
const bar   = document.getElementById('bar');
const nav   = document.getElementById('nav');
let cur = 0, vp = null, st = null;

function chip(label, on, fn){
  const b = document.createElement('button');
  b.textContent = label; if(on) b.className = 'on';
  b.onclick = fn; return b;
}

function draw(){
  const s = S[cur];
  if(!s.viewports.includes(vp)) vp = s.viewports[0];
  if(!s.states.includes(st))    st = s.states[0];

  bar.innerHTML = '';
  s.viewports.forEach(v => bar.appendChild(chip(v + ' · ' + s.widths[v], v === vp,
    () => { vp = v; draw(); })));
  const sp = document.createElement('span'); sp.className = 'sep'; bar.appendChild(sp);
  s.states.forEach(x => bar.appendChild(chip(x, x === st, () => { st = x; draw(); })));
  const sp2 = document.createElement('span'); sp2.className = 'sep'; bar.appendChild(sp2);
  bar.appendChild(chip('anotaciones', !document.body.classList.contains('noann'),
    () => { document.body.classList.toggle('noann'); draw(); }));
  const rt = document.createElement('span');
  rt.className = 'rt'; rt.textContent = s.route || '';
  bar.appendChild(rt);

  stage.innerHTML = s.html[vp][st] || '<p>sin render</p>';
  const f = stage.querySelector('.wf-screen');
  if(f) f.style.width = s.widths[vp] + 'px';

  // Blocks that trigger a transition jump to the destination screen. This is what replaces the
  // arrows the Excalidraw canvas used to draw between frames: the flow is walked, not read.
  stage.querySelectorAll('[data-goto]').forEach(el => {
    el.onclick = ev => {
      ev.stopPropagation();
      const i = S.findIndex(x => x.name === el.dataset.goto);
      if(i >= 0){ cur = i; draw(); window.scrollTo(0,0); }
    };
  });

  [...nav.children].forEach((a,i) => a.className = (i === cur ? 'on' : ''));
}

S.forEach((s,i) => {
  const a = document.createElement('a');
  const tag = s.overlay ? '<span class="vp">' + (s.overlayType || 'overlay') + '</span>'
                        : '<span class="vp">' + s.viewports.join('/') + '</span>';
  a.innerHTML = s.displayName + tag;
  if(s.overlay) a.classList.add('ov');
  a.onclick = () => { cur = i; draw(); };
  nav.appendChild(a);
});
draw();
</script></body></html>
