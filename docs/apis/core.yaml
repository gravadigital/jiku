asyncapi: '2.6.0'

# Messaging contract of `core` — the 17 commands it serves over NATS.
#
# WHY AsyncAPI AND NOT OpenAPI
#   Core exposes no HTTP: no port, no endpoints, no verbs. Its only interface is the bus, with
#   request/reply over NATS. An OpenAPI spec would have to invent routes that do not exist.
#
# THIS FILE IS THE SOURCE OF TRUTH
#   Everything that travels over the bus is answered by core, so this spec is the whole
#   contract. Where the code and this file disagree, the file wins.
#
#   It was written by reading the Joi schemas in `core/src/commands/`, so it describes what
#   core actually accepts. Three points where an earlier prose version of this protocol said
#   otherwise are called out inline as "Corrected": in all three the code was right.

info:
  title: Jiku core — NATS command contract
  version: 1.0.0
  description: |
    `core` is the only service that writes to Jiku's database. It serves commands published by
    the api over NATS, validates the business rules and writes.

    **Pattern: request/reply, no JetStream.** Every message is answered on the spot. There is
    no queue, no retry and no persistence: if core is down, the api's request times out and
    the operation did not happen.

    **Core does not authenticate users and knows nothing about roles.** It trusts the
    `creator` / `author` / `editor` that travels in the body. That trust rests entirely on the
    bus access policy, which lets nobody but the api publish these commands.

    **People never connect to the bus.** They speak HTTP with the api, and the api publishes
    with its own service user. That is why the acting user travels in the body instead of
    being read from the subject: the subject identifies the api, not the person.

    **The transaction belongs to the dispatcher**: commit if the reply is `success`, rollback
    in any other case.

    ## REQ-001 — files, ownership and the storage

    **Core is the single owner of the storage.** With the `files` module it stops consuming only
    "PostgreSQL, NATS, Zitadel" and gains an S3 client that signs PUT and GET. **The api keeps no
    S3 credentials**, so it cannot reach an object core did not sign for it — a guarantee of
    infrastructure, not of discipline, the same kind ADR-001 achieved for database writes.

    **Ownership of a file is resolved per channel (`resolveActor`).** `CommandContext.caller` is
    the SERVICE that published, taken from the subject; for the api it is a single service user
    shared by every person. So neither comparison works on its own: `uploaded_by == caller`
    breaks the web, and `uploaded_by == payload.author` does not satisfy RF-14. The resolution is:

    ```
    resolveActor(ctx, payload):
      if ctx.caller == CORE_TRUSTED_PUBLISHER_ID   (the api's service user, from config)
         -> the actor is payload.author / creator / editor / uploader
            (the api ALREADY authenticated that person against Zitadel by JWT)
      else
         -> the actor is ctx.caller
            (an external publisher has no person behind it: its identity IS the subject's,
             vouched by the auth-callout and unforgeable. Whatever it declares is IGNORED)
    ```

    And then, uniform across both channels:
    `if File.uploaded_by != resolveActor(ctx, payload) -> failure(file_not_owned)`.

    - **`files.request-upload` and the six domain commands MUST use the same function.** If
      uploading and linking resolved identity differently, nobody could link what they uploaded.
    - **No exception by role** (RF-13): core knows nothing about roles, so the rule is uniform by
      construction — there is nowhere to put the exception even if one wanted to.
    - **What is still not covered:** inside the api's channel, core keeps trusting the `author` in
      the body (D-24). Someone holding the api's service user could link files as anybody. This
      design does not close that hole — it **narrows it to the api's channel**; the external
      publisher, which is the new actor, is fully covered.
    - **`CORE_TRUSTED_PUBLISHER_ID` is configuration, not a literal**, and **core MUST fail to
      start without it**: an empty default would send every `caller` down the external branch and
      break the web silently. The external branch should log at `warn`, since today it is the rare
      case.
  license:
    name: Apache-2.0
  contact:
    name: Grava Digital

defaultContentType: application/json

servers:
  dev:
    url: nats://localhost:4222
    protocol: nats
    description: |
      Development instance. `NATS_INSTANCE=dev`.

      Authentication has two layers: the sentinel creds (`NATS_CREDS`) grant no permissions on
      their own — it is the Zitadel service user token that triggers the auth-callout, which
      reads the role and mints the subject permissions for that connection.
  prod:
    url: nats://nats:4222
    protocol: nats
    description: Production instance. `NATS_INSTANCE=prod`.

# ---------------------------------------------------------------------------
# Subject grammar
# ---------------------------------------------------------------------------
#
#   {instance}.{user-id}.{svc}.{version}.{command}
#   dev.323332022539911171.gestion.v1.clients.new
#
#   instance   deployment: dev / prod              (NATS_INSTANCE)
#   user-id    WHO publishes: the token's `sub`, RAW
#   svc        who it talks to: `gestion`          (NATS_SERVICE_NAME)
#   version    protocol version: `v1`              (NATS_PROTOCOL_VERSION)
#   command    clients.new, requirements.{id}.edit, ...
#
# Core subscribes to `{instance}.*.{svc}.{version}.>` with queue group `gestion`, so the
# wildcard covers any caller and several replicas share the messages between them.
#
# The `channels` below are named after the COMMAND, not the full subject: the prefix is the same
# for all of them and depends on the environment.
#
# THE user-id IDENTIFIES THE SERVICE, NOT THE PERSON. The api uses a single service user for
# everybody; the end user travels in the body.
#
# The reply inbox uses the HASHED user id: `_INBOX.<sha256 base32, 16 chars, lowercase>`. The
# client MUST set that prefix when connecting, or the replies never arrive.

channels:

  # -------------------------------------------------------------------------
  # clients
  # -------------------------------------------------------------------------

  clients.new:
    description: Actor creation.
    publish:
      operationId: clientsNew
      summary: Create an actor
      tags:
        - name: clients
      message:
        $ref: '#/components/messages/ClientsNew'

  clients.{id}.edit:
    description: Partial edit of an actor.
    parameters:
      id:
        description: Actor id (`clients.id`).
        schema:
          type: string
    publish:
      operationId: clientsEdit
      summary: Edit an actor
      tags:
        - name: clients
      message:
        $ref: '#/components/messages/ClientsEdit'

  # -------------------------------------------------------------------------
  # projects
  # -------------------------------------------------------------------------

  projects.new:
    description: Project creation.
    publish:
      operationId: projectsNew
      summary: Create a project
      tags:
        - name: projects
      message:
        $ref: '#/components/messages/ProjectsNew'

  projects.{id}.edit:
    description: |
      Partial edit of a project.

      **Difference from the previous api:** `PATCH /projects/:id` required almost every field and
      cleared `endDate` when it was absent. Here an absent field is left as it was, which is what
      the protocol defines.
    parameters:
      id:
        description: Project id (`projects.id`).
        schema:
          type: string
    publish:
      operationId: projectsEdit
      summary: Edit a project
      tags:
        - name: projects
      message:
        $ref: '#/components/messages/ProjectsEdit'

  # -------------------------------------------------------------------------
  # tasks  (the table is `objectives`; the protocol calls them tasks)
  # -------------------------------------------------------------------------

  tasks.new:
    description: |
      Task creation.

      Validates the project, the existence of ALL the responsible people and, if
      `requirementId` is present, that the requirement belongs to the same project. The first of
      `responsiblePersonIds` becomes the lead.
    publish:
      operationId: tasksNew
      summary: Create a task
      tags:
        - name: tasks
      message:
        $ref: '#/components/messages/TasksNew'

  tasks.{id}.edit:
    description: |
      Partial edit of a task, with an activity log.

      Six fields leave a trace in `objective_activities`: `title`, `estimatedFinishDate`,
      `state`, `area`, `priority`, `description`. The log is computed BEFORE writing, because it
      needs the previous value. Going to empty is not logged, except for `estimatedFinishDate`.

      Each activity's visibility is automatic: `state`, `title` and `description` are `public`;
      the rest, `internal`.

      `responsiblePersonIds` is a full replacement.
    parameters:
      id:
        description: Task id (`objectives.id`).
        schema:
          type: string
    publish:
      operationId: tasksEdit
      summary: Edit a task
      tags:
        - name: tasks
      message:
        $ref: '#/components/messages/TasksEdit'

  tasks.{id}.comment:
    description: |
      Comment on a task. Stored as an `ObjectiveActivity` of type `comment`.

      **Difference from the previous api:** it did not check that the task existed, so commenting
      on a nonexistent id failed on the foreign key with a 500. Here it is validated and the
      reply is `objective_not_found`.
    parameters:
      id:
        description: Task id (`objectives.id`).
        schema:
          type: string
    publish:
      operationId: tasksComment
      summary: Comment on a task
      tags:
        - name: tasks
      message:
        $ref: '#/components/messages/TasksComment'

  # -------------------------------------------------------------------------
  # requirements
  # -------------------------------------------------------------------------

  requirements.new:
    description: |
      Requirement creation.

      **Files are linked, not confirmed from a draft** (REQ-001, S-003). `fileIds` carries ids of
      `files` that already exist on their own; the command creates the requirement and then, in
      the same transaction, validates ownership and inserts one `attachments` row per file. The
      requirement and its links commit together or not at all.

      Validation is deliberately **late** (after creating the entity) and that is safe: the
      dispatcher's rollback discards everything, which is the pattern
      `requirements-new.ts:116-121` already uses.
    publish:
      operationId: requirementsNew
      summary: Create a requirement
      tags:
        - name: requirements
      message:
        $ref: '#/components/messages/RequirementsNew'

  requirements.{id}.edit:
    description: |
      Partial edit of a requirement, with an activity log.

      The activity log is computed by the model's `@BeforeUpdate` hook, which fills `activityLog`
      and —when the state changes— sets the transition timestamps (`scheduledAt`,
      `inProgressAt`, ...). The command persists what the hook left behind. **This is a different
      mechanism from `tasks.{id}.edit`**, which computes it in the command.

      `fileIds` is the COMPLETE set that must end up linked: the ones that were not there get a
      new `attachments` row, and the ones no longer present have their **link** deleted — the
      file itself is always retained (REQ-001 D-04, S-003).

      `responsiblePersonIds` is a full replacement.
    parameters:
      id:
        description: Requirement id (`requirements.id`).
        schema:
          type: string
    publish:
      operationId: requirementsEdit
      summary: Edit a requirement
      tags:
        - name: requirements
      message:
        $ref: '#/components/messages/RequirementsEdit'

  requirements.{id}.resolve:
    description: |
      Resolve a requirement: moves it to `resuelto` and stores the reason.

      Inherited rule: an `incidencia` is not resolved without a conclusion. If none comes in the
      payload, the one already stored on the requirement is accepted.

      > **DEAD SURFACE.** It is implemented and tested, but **no api route publishes it**:
      > resolution still comes in through `requirements.{id}.edit`, which accepts
      > `resolutionType`, `resolutionConclusion` and `resolutionComment` for exactly that reason.
      >
      > Effect: the mandatory-conclusion rule lives only here, so **today it is not enforced**.
    parameters:
      id:
        description: Requirement id (`requirements.id`).
        schema:
          type: string
    publish:
      operationId: requirementsResolve
      summary: Resolve a requirement
      tags:
        - name: requirements
      message:
        $ref: '#/components/messages/RequirementsResolve'

  requirements.{id}.comment:
    description: |
      Comment on a requirement. Stored as a `RequirementActivity` of type `comment`.

      It does not notify: notifications were removed from the product.
    parameters:
      id:
        description: Requirement id (`requirements.id`).
        schema:
          type: string
    publish:
      operationId: requirementsComment
      summary: Comment on a requirement
      tags:
        - name: requirements
      message:
        $ref: '#/components/messages/RequirementsComment'

  requirements.{id}.subscriptors.new:
    description: |
      Subscribe a user to a requirement.

      Core checks that the user exists and is not subscribed already. **The permission over the
      project is validated by the api**, because it depends on the role.
    parameters:
      id:
        description: Requirement id (`requirements.id`).
        schema:
          type: string
    publish:
      operationId: requirementsSubscriptorsNew
      summary: Subscribe a user to a requirement
      tags:
        - name: requirements
      message:
        $ref: '#/components/messages/RequirementsSubscriptorsNew'

  requirements.{id}.subscriptors.{userId}.delete:
    description: |
      Unsubscribe a user from a requirement. No body: the user comes in the subject.

      **Core does not check whose subscription it is** — "core deletes what it is told to".
      That somebody can only unsubscribe themselves is validated by the api.
    parameters:
      id:
        description: Requirement id (`requirements.id`).
        schema:
          type: string
      userId:
        description: |
          User id in the identity provider (`users.id`, string). It may contain characters that
          are not digits, and that is why subject matching is done by segments and not by regex.
        schema:
          type: string
    publish:
      operationId: requirementsSubscriptorsDelete
      summary: Unsubscribe a user from a requirement
      tags:
        - name: requirements
      message:
        $ref: '#/components/messages/EmptyBody'

  # -------------------------------------------------------------------------
  # times
  # -------------------------------------------------------------------------

  # -------------------------------------------------------------------------
  # files  (REQ-001 — S-002)
  #
  # The sixth module of core, and the first one that talks to an external system.
  # `core` becomes the SINGLE OWNER of the storage: the api keeps no S3 credentials.
  # -------------------------------------------------------------------------

  files.request-upload:
    description: |
      Upload permission. Validates the upload policy, builds the S3 key, creates the `files` row
      with the byte **unverified**, and signs a `PutObject` presigned URL.

      **The byte never travels over the bus** (`max_payload` is 1 MB and attachments reach 10 MB,
      ADR-002) **nor through the api**: the client PUTs it straight to S3 with the returned URL.

      **The uploader does not choose where the file is stored** (D-08): core builds the key as
      `{STORAGE_S3_KEY_PREFIX}/f/{uuid}{ext}`, with no `entityType` and no `entityId`.

      **The double allowlist is validated here, not in the api**: extension AND MIME type, both
      read live from `system_settings`. A new type has to be added to **both** lists (RF-17).

      **The byte is NOT verified.** No `headObject`, because a network call inside the
      dispatcher's transaction would risk the 5 s timeout of ADR-002. The failure surfaces on
      download, never as a corrupted row.

      > **Revised 2026-08-20.** It no longer surfaces as `file_not_available`: see
      > `files.{fileId}.request-download`, which stopped checking `byte_status`. A byte that
      > never arrived now reaches the browser as an opaque `NoSuchKey` from S3.
    publish:
      operationId: filesRequestUpload
      summary: Request permission to upload a file
      tags:
        - name: files
      message:
        $ref: '#/components/messages/FilesRequestUpload'

  files.{fileId}.request-download:
    description: |
      Read permission. Validates that the file exists and is alive, and signs a `GetObject`
      presigned URL over its `storage_key`.

      > **`byte_status` is NOT checked (revised 2026-08-20).** The original design answered
      > `file_not_available` for a `pending` byte (CA-15, RF-21, D-15). That was unachievable
      > together with RF-1 / CA-7: `pending` meant two things at once — "the byte never arrived"
      > and "not linked yet" — because `uploaded` is written by the LINKING commands, when the
      > entity is saved. Blocking it made every just-uploaded file unpreviewable **by
      > construction**, which is exactly the case this command exists to serve.
      >
      > **What is given up:** a file whose PUT failed silently no longer answers a readable 404.
      > The URL is signed, the browser follows the redirect and S3 answers an opaque `NoSuchKey`.
      >
      > To recover the 404 later, the way is NOT to restore the check — it would break the
      > preview again — but to separate the two meanings of `pending`: confirm the PUT on upload,
      > or sign anyway when the resolved actor is the file's `uploaded_by`.

      **`fileId` is the id of `files`** — the file, not the link. The parameter name is explicit
      on purpose so it is not confused with the `attachments` id that travels in the HTTP
      contract. The api holds the `file_id` already, because it read the `attachments` row to
      authorize.

      **It carries no `requester`: ownership does NOT apply to reading.** A file is read through
      the permission over the linked entity, not through who uploaded it. RF-12 is about
      *linking*, not *reading* — a requirement can hold attachments from several people and the
      whole project team has to be able to see them.

      **What core does NOT validate here is the permission over the entity.** That stays with the
      api (`canUserViewEntity` / `canUserAccessEntity`), because core knows nothing about roles or
      end users. The api authorizes first and only then publishes.

      > **Consequence to keep on the record (ADR-007 revision).** The command takes a `fileId`, so
      > anyone able to publish on the bus can ask for the URL of **any file in the catalog**,
      > bypassing the api's authorization. It is the same trust model ADR-007 already declares for
      > every write — the auth-callout is the only defence — but it now covers **reading**, and the
      > surface is the whole file catalog rather than the set of authorizable links. An optional
      > `attachmentId` for core to validate was evaluated and **discarded**, to keep this command
      > symmetric with `request-upload`; it stays available as an additive defence-in-depth.
    parameters:
      fileId:
        description: File id (`files.id`) — **not** the link id (`attachments.id`).
        schema:
          type: string
    publish:
      operationId: filesRequestDownload
      summary: Request permission to download a file
      tags:
        - name: files
      message:
        $ref: '#/components/messages/FilesRequestDownload'

  # -------------------------------------------------------------------------
  # attachments  (REQ-001 — S-004)
  # -------------------------------------------------------------------------

  attachments.{id}.delete:
    description: |
      Unlinks a file from an entity. **Deletes only the `attachments` row: the file is retained**
      (D-04), and so is the object in the bucket.

      With 0..N links per file, deleting the object would break the other links. Unlinking **is**
      deleting the `Attachment`.

      **Why it is a command and not a direct write.** It was the third implicit write of the api
      (row + object). If the link becomes a domain row, deleting it MUST go through core, or it
      would reopen through another door the ADR-001 exception this redesign closes.

      **The parameter is the id of `attachments`** — the link — which is the opposite of
      `files.{fileId}.request-download`. The name says so on purpose: `attachments.{id}.delete`
      is more honest than `files.{id}.unlink`.
    parameters:
      id:
        description: Link id (`attachments.id`).
        schema:
          type: string
    publish:
      operationId: attachmentsDelete
      summary: Unlink a file from an entity
      tags:
        - name: attachments
      message:
        $ref: '#/components/messages/AttachmentsDelete'

  worked-times.new:
    description: |
      Log worked time.

      Cap of 1440 minutes (24 h) per person per day, counting worked time only.

      `taskId` and `requirementId` are mutually exclusive (`oxor`). If `requirementId` is
      present, it has to belong to the given project.

      **The submission window (the current day and the 10 before it) is validated by the api**,
      not core: it depends on the calendar and not on the data.
    publish:
      operationId: workedTimesNew
      summary: Log worked time
      tags:
        - name: times
      message:
        $ref: '#/components/messages/WorkedTimesNew'

  worked-times.{id}.delete:
    description: |
      Delete a worked time entry. No body.

      **Core deletes what it is told to:** that the entry is the caller's own and that the date is
      within the allowed window is validated by the api, which is the one that knows the role and
      the calendar.
    parameters:
      id:
        description: Entry id (`worked_times.id`).
        schema:
          type: string
    publish:
      operationId: workedTimesDelete
      summary: Delete worked time
      tags:
        - name: times
      message:
        $ref: '#/components/messages/EmptyBody'

  unworked-times.new:
    description: |
      Record unworked time.

      Cap of 1440 minutes (24 h) per person per day, **adding up worked AND unworked time** —
      unlike `worked-times.new`, which only counts worked time.
    publish:
      operationId: unworkedTimesNew
      summary: Record unworked time
      tags:
        - name: times
      message:
        $ref: '#/components/messages/UnworkedTimesNew'

  unworked-times.{id}.delete:
    description: Delete an unworked time record. No body. The permission is validated by the api.
    parameters:
      id:
        description: Record id (`unworked_times.id`).
        schema:
          type: string
    publish:
      operationId: unworkedTimesDelete
      summary: Delete unworked time
      tags:
        - name: times
      message:
        $ref: '#/components/messages/EmptyBody'

# ---------------------------------------------------------------------------

components:

  messages:

    ClientsNew:
      name: ClientsNew
      title: clients.new
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ClientsNewPayload'
      x-reply:
        $ref: '#/components/schemas/ReplyWithId'
      x-error-codes: [invalid_fields, internal_error]

    ClientsEdit:
      name: ClientsEdit
      title: clients.{id}.edit
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ClientsEditPayload'
      x-reply:
        $ref: '#/components/schemas/ReplyEmpty'
      x-error-codes: [invalid_fields, client_not_found, internal_error]

    ProjectsNew:
      name: ProjectsNew
      title: projects.new
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProjectsNewPayload'
      x-reply:
        $ref: '#/components/schemas/ReplyWithId'
      x-error-codes: [invalid_fields, client_not_found, internal_error]

    ProjectsEdit:
      name: ProjectsEdit
      title: projects.{id}.edit
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProjectsEditPayload'
      x-reply:
        $ref: '#/components/schemas/ReplyEmpty'
      x-error-codes: [invalid_fields, project_not_found, client_not_found, internal_error]

    TasksNew:
      name: TasksNew
      title: tasks.new
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TasksNewPayload'
      x-reply:
        $ref: '#/components/schemas/ReplyWithId'
      x-error-codes:
        - invalid_fields
        - project_not_found
        - person_not_found
        - requirement_project_mismatch
        # S-003: el comando ahora vincula archivos. `invalid_attachment_id` NO figura acá: un
        # `fileId` inexistente o retirado cae en `invalid_fields` (400), y uno ajeno en
        # `file_not_owned` (403). La distinción es la regla nueva del REQ-001.
        - file_not_owned
        - internal_error

    TasksEdit:
      name: TasksEdit
      title: tasks.{id}.edit
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TasksEditPayload'
      x-reply:
        $ref: '#/components/schemas/ReplyEmpty'
      x-error-codes:
        - invalid_fields
        - objective_not_found
        - person_not_found
        - requirement_project_mismatch
        - file_not_owned
        - internal_error

    TasksComment:
      name: TasksComment
      title: tasks.{id}.comment
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TasksCommentPayload'
      x-reply:
        $ref: '#/components/schemas/ReplyWithId'
      x-error-codes: [invalid_fields, objective_not_found, file_not_owned, internal_error]

    RequirementsNew:
      name: RequirementsNew
      title: requirements.new
      contentType: application/json
      payload:
        $ref: '#/components/schemas/RequirementsNewPayload'
      x-reply:
        $ref: '#/components/schemas/ReplyWithId'
      x-error-codes:
        - invalid_fields
        - project_not_found
        - invalid_responsible_person
        - file_not_owned
        - internal_error

    RequirementsEdit:
      name: RequirementsEdit
      title: requirements.{id}.edit
      contentType: application/json
      payload:
        $ref: '#/components/schemas/RequirementsEditPayload'
      x-reply:
        $ref: '#/components/schemas/ReplyEmpty'
      x-error-codes:
        - invalid_fields
        - requirement_not_found
        - invalid_responsible_person
        - file_not_owned
        - internal_error

    RequirementsResolve:
      name: RequirementsResolve
      title: requirements.{id}.resolve
      contentType: application/json
      payload:
        $ref: '#/components/schemas/RequirementsResolvePayload'
      x-reply:
        $ref: '#/components/schemas/ReplyEmpty'
      x-error-codes: [invalid_fields, requirement_not_found, resolution_required, internal_error]

    RequirementsComment:
      name: RequirementsComment
      title: requirements.{id}.comment
      contentType: application/json
      payload:
        $ref: '#/components/schemas/RequirementsCommentPayload'
      x-reply:
        $ref: '#/components/schemas/ReplyWithId'
      x-error-codes: [invalid_fields, requirement_not_found, file_not_owned, internal_error]

    RequirementsSubscriptorsNew:
      name: RequirementsSubscriptorsNew
      title: requirements.{id}.subscriptors.new
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscriptorNewPayload'
      x-reply:
        $ref: '#/components/schemas/ReplyWithId'
      x-error-codes:
        - invalid_fields
        - requirement_not_found
        - user_not_found
        - already_subscribed
        - internal_error

    FilesRequestUpload:
      name: FilesRequestUpload
      title: files.request-upload
      contentType: application/json
      payload:
        $ref: '#/components/schemas/FilesRequestUploadPayload'
      x-reply:
        $ref: '#/components/schemas/ReplyWithUploadTicket'
      x-error-codes: [invalid_fields, file_type_not_allowed, file_too_large, internal_error]

    FilesRequestDownload:
      name: FilesRequestDownload
      title: files.{fileId}.request-download
      contentType: application/json
      payload:
        $ref: '#/components/schemas/FilesRequestDownloadPayload'
      x-reply:
        $ref: '#/components/schemas/ReplyWithDownloadTicket'
      # `file_not_available` YA NO SE EMITE (revisado 2026-08-20): el comando dejó de verificar
      # `byte_status`. Se conserva en el catálogo de `ErrorCode` —no está cerrado y el paquete es
      # compartido (ADR-005)— y la api lo sigue mapeando a 404, pero ningún comando lo devuelve.
      x-error-codes: [file_not_found, internal_error]

    AttachmentsDelete:
      name: AttachmentsDelete
      title: attachments.{id}.delete
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EmptyPayload'
      x-reply:
        $ref: '#/components/schemas/ReplyEmpty'
      x-error-codes: [invalid_fields, internal_error]

    WorkedTimesNew:
      name: WorkedTimesNew
      title: worked-times.new
      contentType: application/json
      payload:
        $ref: '#/components/schemas/WorkedTimesNewPayload'
      x-reply:
        $ref: '#/components/schemas/ReplyWithId'
      x-error-codes:
        - invalid_fields
        - person_not_found
        - project_not_found
        - objective_not_found
        - requirement_not_found
        - requirement_project_mismatch
        - daily_limit_exceeded
        - internal_error

    UnworkedTimesNew:
      name: UnworkedTimesNew
      title: unworked-times.new
      contentType: application/json
      payload:
        $ref: '#/components/schemas/UnworkedTimesNewPayload'
      x-reply:
        $ref: '#/components/schemas/ReplyWithId'
      x-error-codes: [invalid_fields, person_not_found, daily_limit_exceeded, internal_error]

    EmptyBody:
      name: EmptyBody
      title: Command with no body
      contentType: application/json
      description: |
        The delete commands and the unsubscribe carry no body. They are validated all the same,
        with `joi.object({}).unknown(false)`, so **a payload with any field is rejected** with
        `invalid_fields`. An absent or empty body is normalized to `{}`.
      payload:
        $ref: '#/components/schemas/EmptyPayload'
      x-reply:
        $ref: '#/components/schemas/ReplyEmpty'
      x-error-codes:
        - invalid_fields
        - subscription_not_found
        - worked_time_not_found
        - unworked_time_not_found
        - internal_error

  schemas:

    # -----------------------------------------------------------------------
    # Reply — identical for every command
    # -----------------------------------------------------------------------

    Reply:
      type: object
      description: |
        Reply format, the same for every command. Defined in
        `@jiku/nats-protocol`.

        **The `status` decides the transaction**: the dispatcher commits if it is `success` and
        rolls back in any other case.
      required: [status]
      properties:
        status:
          type: string
          enum: [success, failure]
        errorCode:
          type: string
          description: 'Present only with `status: failure`. See `ErrorCode`.'
        errorMessage:
          type: string
          description: |
            Free text. **It reaches the end user** through the api.

            English and Spanish are mixed, sometimes in the same file. It is inherited
            inconsistency that was not unified because the frontends display some of them
            directly.
        data:
          type: object
          description: Reply body. Absent on edits and deletes.

    ReplyWithId:
      allOf:
        - $ref: '#/components/schemas/Reply'
        - type: object
          description: |
            Reply of a creation. It returns **only the id**: since the contract with the frontends
            is the full record with its relations, the api re-reads the entity from the database
            after the command.
          properties:
            data:
              type: object
              required: [id]
              properties:
                id:
                  type: integer
          example:
            status: success
            data:
              id: 7

    ReplyEmpty:
      allOf:
        - $ref: '#/components/schemas/Reply'
        - type: object
          description: 'Reply with no content: the `status` is the whole reply.'
          example:
            status: success

    ReplyWithUploadTicket:
      allOf:
        - $ref: '#/components/schemas/Reply'
        - type: object
          description: |
            Reply of `files.request-upload`.

            > **Declared exception to `conventions/commands.md`** ("creations return only the
            > `id`"). There is no alternative here: the presigned URL is generated by core, is
            > single-use and short-lived, and the api cannot rebuild it by re-reading the database
            > without duplicating the key policy and standing up its own write signer — which is
            > exactly what D-08 centralizes in core. Documented as an exception, not as a pattern.

            > **The field is `id` on the bus and `fileId` over HTTP.** On the bus `id` is the
            > convention of every creation; over HTTP `fileId` says which id it is, which matters
            > because the HTTP attachment contract handles **two** id spaces (the link's and the
            > file's). The api translates, as it already does in its five documented contract
            > translations.
          properties:
            data:
              type: object
              required: [id, uploadUrl, expiresIn]
              properties:
                id:
                  type: integer
                  description: '`files.id`. Travels as `fileIds` when saving the entity.'
                uploadUrl:
                  type: string
                  description: |
                    **PutObject** presigned URL, single object and short TTL (D-10). The client
                    uses it straight against the storage: it goes through neither the api nor the
                    bus. It grants no listing, no reading and no deleting.
                expiresIn:
                  type: integer
                  description: 'Seconds of validity. Read from `system_settings`.'
          example:
            status: success
            data:
              id: 1234
              uploadUrl: 'https://bucket.example/grava-gestion/f/9c1e.../abcd.pdf?X-Amz-...'
              expiresIn: 300

    ReplyWithDownloadTicket:
      allOf:
        - $ref: '#/components/schemas/Reply'
        - type: object
          description: |
            Reply of `files.{fileId}.request-download`. Same declared exception as
            `ReplyWithUploadTicket`.

            The three metadata fields travel in the reply **on purpose**: the api needs them to
            build the headers of its response (or of the 302) without querying the database again,
            and the `HEAD` to the preview the frontends already use to resolve name and size keeps
            working unchanged.
          properties:
            data:
              type: object
              required: [downloadUrl, expiresIn, fileName, mimeType, fileSize]
              properties:
                downloadUrl:
                  type: string
                  description: |
                    **GetObject** presigned URL over `files.storage_key`, carrying
                    `response-content-disposition` so the original file name travels signed and S3
                    returns it without anybody proxying the byte.
                expiresIn:
                  type: integer
                  description: |
                    Seconds of validity, from `download-url-ttl-seconds`.

                    > **Security note.** A leaked read URL grants access to the content with no
                    > credential at all, and with the 302 that URL reaches the browser on **every**
                    > preview: it lands in history, in proxy logs and in the `Referer`. The default
                    > should be the shortest the UI tolerates.
                fileName:
                  type: string
                mimeType:
                  type: string
                fileSize:
                  type: integer
          example:
            status: success
            data:
              downloadUrl: 'https://bucket.example/grava-gestion/f/9c1e....pdf?X-Amz-...'
              expiresIn: 300
              fileName: informe.pdf
              mimeType: application/pdf
              fileSize: 4194304

    ErrorCode:
      type: string
      description: |
        Catalog of error codes, defined in `@jiku/nats-protocol`.

        > **The catalog is not closed.** The api maps to HTTP only the codes its routes use
        > today; any other one falls through to a 500. In particular, `unknown_command` has
        > **no** mapping.

        Three codes are emitted today as a string literal instead of the constant
        (`resolution_required`, `worked_time_not_found`, `unworked_time_not_found`). The value is
        correct, but it is duplicated by hand.

        > **REQ-001 adds five codes** for the `files` module. All five MUST be mapped in
        > `api/lib/utils/bus/protocol.ts` (ADR-002) or they fall through to a generic 500:
        > `file_type_not_allowed` → 400, `file_too_large` → 400, `file_not_owned` → **403**,
        > `file_not_found` → 404, `file_not_available` → 404.
        >
        > `file_not_owned` has to be **403, not 400**. Reusing `invalid_attachment_id` (mapped to
        > 400) would make "the file does not exist" indistinguishable from "the file is not
        > yours", and the second one is the new rule.
      enum:
        - invalid_fields
        - internal_error
        - unknown_command
        - client_not_found
        - project_not_found
        - objective_not_found
        - requirement_not_found
        - user_not_found
        - person_not_found
        - invalid_responsible_person
        # CÓDIGO SIN EMISOR desde S-003: ningún comando lo devuelve ya. Los seis comandos de
        # dominio dejaron de emitirlo al pasar de `attachmentIds` a `fileIds` —un `fileId`
        # inválido cae en `invalid_fields` y uno ajeno en `file_not_owned`—. SE CONSERVA a
        # propósito: el catálogo no está cerrado, `@jiku/nats-protocol` es compartido (ADR-005)
        # y ningún criterio de aceptación pide retirarlo.
        - invalid_attachment_id
        - file_type_not_allowed
        - file_too_large
        - file_not_owned
        - file_not_found
        - file_not_available
        - requirement_project_mismatch
        - daily_limit_exceeded
        - invalid_date_range
        - already_subscribed
        - subscription_not_found
        - invalid_state_transition
        - stage_not_found
        - resolution_required
        - worked_time_not_found
        - unworked_time_not_found

    EmptyPayload:
      type: object
      additionalProperties: false
      description: No fields. Any property is rejected with `invalid_fields`.

    # -----------------------------------------------------------------------
    # Reused types
    # -----------------------------------------------------------------------

    IdentityUserId:
      type: string
      description: |
        User id from the identity provider (`users.id`). **Not to be confused with `personId`**,
        which is the id from the `persons` table (a number). Both concepts coexist in
        `worked-times`.

    DateOnly:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: '`YYYY-MM-DD` date. The column is a STRING, not a DATE.'
      example: '2026-08-12'

    Property:
      type: object
      description: |
        Pair from the bus contract. It is translated into the `key_value_pairs` column, which
        stores a flat object: `[{code: 'documentacion', value: 'https://...'}]` is stored as
        `{documentacion: 'https://...'}`.
      required: [code]
      properties:
        code:
          type: string
          enum: [documentacion, diseño, board_de_tareas, mattermost_group_name]
          description: Accepted keys (`DefaultKeyValuePairs`).
        value:
          type: [string, 'null']
          description: |
            The first three codes are validated as a URI; `mattermost_group_name` is free text.
            It accepts `null` and the empty string.

    Tag:
      type: object
      description: Requirement tag. Stored in a JSONB column.
      properties:
        key:
          type: string
        value:
          type: string

    FilesRequestUploadPayload:
      type: object
      required: [uploader, fileName, mimeType, fileSize]
      properties:
        uploader:
          allOf:
            - $ref: '#/components/schemas/IdentityUserId'
          description: |
            Who uploads. For the api it is the end user authenticated by JWT.

            **An external publisher omits it: core resolves it from the subject's `caller`.** And
            if it sends one, it is **ignored**. See `x-resolve-actor`.

            It is optional on purpose: it is the lever of D-26.
        fileName:
          type: string
          maxLength: 255
          description: 'The original name. It is **not** the key — core builds the key.'
        mimeType:
          type: string
          maxLength: 100
          description: |
            Declared by the client. Validated against `file-allowed-mime-types`, **and the
            extension of `fileName` is validated against `file-allowed-extensions` as well**: a
            new type has to be added to both lists (RF-17, D-18).
        fileSize:
          type: integer
          minimum: 1
          description: 'Declared by the client. Validated against `file-max-size-bytes`.'
        checksum:
          type: [string, 'null']
          description: |
            Hexadecimal sha256 declared by the client. **NOBODY verifies it** (D-25), the same way
            nobody verifies `mimeType` or `fileSize` against the actual byte. The double allowlist
            validates **what is declared**, which was never a guarantee about the byte; the
            standing defence is the one on serving (`nosniff` + sandbox CSP), not the one on
            uploading.

    FilesRequestDownloadPayload:
      type: object
      properties:
        disposition:
          type: string
          enum: [inline, attachment]
          default: inline
          description: |
            `inline` for preview, `attachment` for download with a name. It determines the
            presigned URL's `response-content-disposition`, so the original name travels in the
            signed URL and S3 returns it without anybody proxying the byte.

    FileIds:
      type: array
      maxItems: 10
      description: |
        Ids from `files` to link. Each one has to exist, be alive (`retention_status: 'active'`)
        and have been uploaded by the actor of this command (REQ-001 RF-12). If any of them does
        not comply, the reply is `file_not_owned` or `invalid_fields` and **the whole write is
        discarded**.

        **Replaces `AttachmentIds`** (REQ-001, S-003). There are no drafts any more: the file
        already exists on its own and the link is created against the entity, which by then
        exists too.

        **Ownership is resolved per channel** — see `x-resolve-actor` below. It has **no
        exception by role**: an administrator cannot link a file they did not upload either
        (RF-13). Core knows nothing about roles, so the rule is uniform by construction.

        `maxItems: 10` moves the 10-file cap from `multer` to **the bus contract** (D-20): it
        stops being a transport limit and becomes a domain rule, validated by Joi.
      items:
        type: integer
        minimum: 1

    ResponsiblePersonIds:
      type: array
      description: |
        Ids from the `persons` table. **The first one in the list becomes the lead** — the order is
        information, not a detail.

        It is validated with a `count` against the length of the list, so **it does not report
        which one is missing**.
      items:
        type: integer

    # -----------------------------------------------------------------------
    # clients
    # -----------------------------------------------------------------------

    ClientsNewPayload:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          description: Accepts the empty string.

    ClientsEditPayload:
      type: object
      description: |
        Partial edit: no field is required. Absent = left untouched; with a value = replaced;
        `null` = cleared; `null` on a field that is mandatory at creation = fails.
      properties:
        name:
          type: string
          description: '**Does not accept `null`**: it is mandatory at creation.'
        description:
          type: [string, 'null']

    # -----------------------------------------------------------------------
    # projects
    # -----------------------------------------------------------------------

    ProjectsNewPayload:
      type: object
      required: [creator, name, code]
      properties:
        creator:
          $ref: '#/components/schemas/IdentityUserId'
        name:
          type: string
        code:
          type: string
        status:
          type: string
          enum: [analisis, activo, inactivo, finalizado, cancelado]
          default: analisis
        type:
          type: string
          enum: [interno, comercial, investigacion, propuesta]
          default: comercial
        description:
          type: string
        initDate:
          type: string
          format: date-time
          description: 'Default: the moment of validation.'
        endDate:
          type: [string, 'null']
          format: date-time
        clientId:
          type: [integer, 'null']
          description: If present, the actor is validated to exist.
        properties:
          type: array
          items:
            $ref: '#/components/schemas/Property'

    ProjectsEditPayload:
      type: object
      description: 'Partial edit: no field is required and no defaults are applied.'
      properties:
        name:
          type: string
          description: Does not accept `null`.
        code:
          type: string
          description: Does not accept `null`.
        status:
          type: string
          enum: [analisis, activo, inactivo, finalizado, cancelado]
        type:
          type: string
          enum: [interno, comercial, investigacion, propuesta]
        description:
          type: [string, 'null']
        initDate:
          type: string
          format: date-time
          description: Does not accept `null`.
        endDate:
          type: [string, 'null']
          format: date-time
        clientId:
          type: [integer, 'null']
        properties:
          type: array
          items:
            $ref: '#/components/schemas/Property'

    # -----------------------------------------------------------------------
    # tasks
    # -----------------------------------------------------------------------

    TaskPriority:
      type: string
      description: |
        Task priority. **An enum on the bus, an integer in the column** (`objectives.priority` is
        INTEGER NOT NULL): `sin_prioridad`=0, `baja`=1, `media`=2, `alta`=3, `urgente`=4.

        Not to be confused with `requirements.priority`, which is an actual enum in the database.
      enum: [sin_prioridad, baja, media, alta, urgente]

    TasksNewPayload:
      type: object
      required: [creator, title, projectId, responsiblePersonIds]
      properties:
        creator:
          $ref: '#/components/schemas/IdentityUserId'
        title:
          type: string
        description:
          type: [string, 'null']
        estimatedFinishDate:
          type: [string, 'null']
          description: |
            Accepted as a date and coerced to `YYYY-MM-DD`: the column is a STRING, not a DATE.
        state:
          type: string
          enum: [backlog, activo, finalizado, cancelado, en_revision]
          default: backlog
        area:
          type: string
          enum: [diseño, desarrollo, gestion, investigacion]
          default: desarrollo
          description: |
            **Corrected:** an earlier prose version marked this both required and defaulted,
            which is contradictory. It is optional, with default `desarrollo`.
        priority:
          allOf:
            - $ref: '#/components/schemas/TaskPriority'
          default: sin_prioridad
        priorityValue:
          type: integer
          minimum: 0
          maximum: 5
          description: |
            **A transitional escape hatch, not part of the contract.** The enum has 5 values and
            the column accepted 0-5, so the round-trip translation would collapse 5 into 4. The api
            sends the original number here and core uses it as is, ignoring `priority`.

            It goes away once the web speaks in priority names.
        projectId:
          type: integer
        responsiblePersonIds:
          $ref: '#/components/schemas/ResponsiblePersonIds'
        visibilityLevel:
          type: string
          enum: [public, internal]
          default: public
        requirementId:
          type: [integer, 'null']
          description: If present, it has to belong to the given project.
        fileIds:
          allOf:
            - $ref: '#/components/schemas/FileIds'
          description: |
            Files to link to the task being created.

            > **Discrepancy resolved by REQ-001 (S-003).** This payload did not declare
            > `attachmentIds`, yet the message declared `invalid_attachment_id` among its
            > `x-error-codes`. RF-9 requires linking files to tasks, so in the new model this
            > command carries `fileIds`. **Verify against `core/src/commands/tasks/` when
            > implementing** and keep spec and code consistent.

    TasksEditPayload:
      type: object
      required: [editor]
      description: 'Partial edit: only `editor` is required.'
      properties:
        editor:
          allOf:
            - $ref: '#/components/schemas/IdentityUserId'
          description: |
            **Required even though the protocol does not declare it.**
            `objective_activities.changed_by` has a foreign key against `users`, so without a real
            user id the activity cannot be logged.
        title:
          type: string
        description:
          type: [string, 'null']
        estimatedFinishDate:
          type: [string, 'null']
        state:
          type: string
          enum: [backlog, activo, finalizado, cancelado, en_revision]
        area:
          type: string
          enum: [diseño, desarrollo, gestion, investigacion]
        priority:
          $ref: '#/components/schemas/TaskPriority'
        priorityValue:
          type: integer
          minimum: 0
          maximum: 5
          description: See `TasksNewPayload.priorityValue`.
        responsiblePersonIds:
          allOf:
            - $ref: '#/components/schemas/ResponsiblePersonIds'
          description: |
            Full replacement: the ones not present are deleted and the ones that are get upserted,
            preserving the row and its `createdAt`.
        visibilityLevel:
          type: string
          enum: [public, internal]
        requirementId:
          type: [integer, 'null']
        fileIds:
          allOf:
            - $ref: '#/components/schemas/FileIds'
          description: |
            The **COMPLETE set** that must end up linked to the task, same semantics as
            `RequirementsEditPayload.fileIds`.

            > Same discrepancy as `TasksNewPayload.fileIds`, resolved the same way by REQ-001.

    TasksCommentPayload:
      type: object
      required: [author, comment]
      properties:
        author:
          $ref: '#/components/schemas/IdentityUserId'
        comment:
          type: string
        visibilityLevel:
          type: string
          enum: [public, internal]
          default: internal
          description: |
            The comment is the only activity type whose visibility the user chooses; in the rest it
            is automatic, per field.
        fileIds:
          allOf:
            - $ref: '#/components/schemas/FileIds'
          description: |
            Files to link to the comment. **No draft `entityType` is involved any more**: the
            files already exist on their own and the link is created against the comment once it
            exists (REQ-001, S-003). The web always sends this field, even when the array is
            empty.

    # -----------------------------------------------------------------------
    # requirements
    # -----------------------------------------------------------------------

    RequirementsNewPayload:
      type: object
      required: [creator, title, description, projectId]
      properties:
        creator:
          $ref: '#/components/schemas/IdentityUserId'
        title:
          type: string
        description:
          type: string
        projectId:
          type: integer
        type:
          type: [string, 'null']
          enum: [funcionalidad, mejora, incidencia, otro, null]
        priority:
          type: string
          enum: [sin_prioridad, baja, media, alta, urgente]
          default: sin_prioridad
          description: 'Unlike tasks, here the enum is an enum in the database too.'
        visibilityLevel:
          type: string
          enum: [public, internal]
          default: public
        state:
          type: string
          enum: [analisis, planificacion, en_cola, desarrollo, revision, resuelto, cancelado]
          description: |
            **Corrected:** an earlier prose version did not declare `state` on creation, but
            the api accepts it and the web uses it. Default `analisis`.
        responsiblePersonIds:
          $ref: '#/components/schemas/ResponsiblePersonIds'
        estimatedFinishDate:
          type: [string, 'null']
          format: date-time
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        fileIds:
          allOf:
            - $ref: '#/components/schemas/FileIds'
          description: |
            Files to link to the requirement being created. The requirement and its links are
            written in **a single transaction**: if anything fails, neither the requirement nor a
            single link survives — but the `files` rows do, unlinked, which is a valid state
            (REQ-001 RF-1).
        # attachmentScope - REMOVED by REQ-001 (S-003). It existed only to choose the draft's
        # anchor, and there are no drafts any more.
        scope:
          type: [string, 'null']
        technicalSolution:
          type: [string, 'null']
        acceptanceCriteria:
          type: [string, 'null']

    RequirementsEditPayload:
      type: object
      required: [editor]
      description: 'Partial edit: only `editor` is required.'
      properties:
        editor:
          allOf:
            - $ref: '#/components/schemas/IdentityUserId'
          description: 'Required: `requirement_activities.changed_by` has an FK against `users`.'
        title:
          type: string
        description:
          type: string
        type:
          type: [string, 'null']
          enum: [funcionalidad, mejora, incidencia, otro, null]
        priority:
          type: string
          enum: [sin_prioridad, baja, media, alta, urgente]
        visibilityLevel:
          type: string
          enum: [public, internal]
        state:
          type: string
          enum: [analisis, planificacion, en_cola, desarrollo, revision, resuelto, cancelado]
          description: |
            A state change triggers the model's hook, which sets the transition timestamps and logs
            the activity.
        responsiblePersonIds:
          allOf:
            - $ref: '#/components/schemas/ResponsiblePersonIds'
          description: 'Full replacement: ALL of them are deleted and recreated.'
        estimatedFinishDate:
          type: [string, 'null']
          format: date-time
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        fileIds:
          allOf:
            - $ref: '#/components/schemas/FileIds'
          description: |
            The **COMPLETE set** that must end up linked: the ones that were not there get a new
            `attachments` row and the ones no longer present have their link deleted. This differs
            from creation, where it is only the list to link.

            **It operates on the link, not on the file** (REQ-001, S-003): deleting a link never
            deletes the file, because a file can have 0..N links and removing the object would
            break the others.
        resolutionType:
          type: [string, 'null']
          enum: [error_interno, fuera_de_alcance, error_externo, discutible, otro, null]
          description: |
            **Known overlap:** resolution has its own command (`requirements.{id}.resolve`), but
            the api's `PATCH` still sends these three fields here, and in fact it is the only path
            through which resolution happens today.
        resolutionConclusion:
          type: [string, 'null']
        resolutionComment:
          type: [string, 'null']
        scope:
          type: [string, 'null']
        technicalSolution:
          type: [string, 'null']
        acceptanceCriteria:
          type: [string, 'null']

    RequirementsResolvePayload:
      type: object
      required: [editor, type]
      properties:
        editor:
          $ref: '#/components/schemas/IdentityUserId'
        type:
          type: string
          enum: [error_interno, fuera_de_alcance, error_externo, discutible, otro]
          description: |
            Resolution type (`RequirementResolution`). Not to be confused with the `state`, which
            moves to `resuelto`: this is the REASON.
        conclusion:
          type: [string, 'null']
          description: |
            If the requirement is of type `incidencia`, a conclusion is needed: the one in the
            payload or the one already stored. If there is neither, it replies
            `resolution_required`.
        comment:
          type: [string, 'null']

    RequirementsCommentPayload:
      type: object
      required: [author, comment]
      properties:
        author:
          $ref: '#/components/schemas/IdentityUserId'
        comment:
          type: string
        visibilityLevel:
          type: string
          enum: [public, internal]
          default: internal
        fileIds:
          allOf:
            - $ref: '#/components/schemas/FileIds'
          description: |
            Files to link to the comment. **No draft `entityType` is involved any more**: the link
            is created against the already existing comment (REQ-001, S-003).

    SubscriptorNewPayload:
      type: object
      required: [userId]
      properties:
        userId:
          $ref: '#/components/schemas/IdentityUserId'

    # -----------------------------------------------------------------------
    # times
    # -----------------------------------------------------------------------

    WorkedTimesNewPayload:
      type: object
      required: [date, minutes, projectId, personId]
      description: 'Extra constraint: `taskId` and `requirementId` are mutually exclusive.'
      properties:
        date:
          $ref: '#/components/schemas/DateOnly'
        minutes:
          type: integer
          minimum: 1
          description: 'Cap: the day''s total cannot go over 1440.'
        projectId:
          type: integer
        taskId:
          type: [integer, 'null']
          description: |
            The bus name for `objective_id`. **Exclusive with `requirementId`.**
        requirementId:
          type: [integer, 'null']
          description: |
            **Exclusive with `taskId`.** If present, it has to belong to the given project.
        personId:
          type: integer
          description: |
            Id from the `persons` table, **required**.

            **Corrected:** an earlier prose version declared it optional, defaulting to "the
            authenticated user's person". Core cannot do that — it does not know the end user.
            The api resolves that default before publishing.

    UnworkedTimesNewPayload:
      type: object
      required: [date, minutes, reason, personId]
      properties:
        date:
          $ref: '#/components/schemas/DateOnly'
        minutes:
          type: integer
          minimum: 1
          description: |
            Cap of 1440 per day, **adding up worked AND unworked time**.
        reason:
          type: string
          enum:
            - tramite
            - corte_servicios
            - vacaciones
            - dia_no_laborable
            - personal
            - medico
            - estudio
            - enfermedad
            - otro
        personId:
          type: integer
          minimum: 1
          description: 'Required, just like in `worked-times.new`.'

tags:
  - name: clients
    description: Actors — called `clients` in the database and on the bus. 2 commands.
  - name: projects
    description: Projects. 2 commands.
  - name: tasks
    description: |
      Tasks. 3 commands. The table is `objectives`; the protocol calls them `tasks`.
  - name: requirements
    description: Requirements, comments and subscriptions. 6 commands.
  - name: times
    description: Worked and unworked time logging. 4 commands.
