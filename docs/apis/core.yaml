      contentType: application/json
      payload:
        $ref: '#/components/schemas/UnworkedTimesNewPayload'
      x-reply:
        $ref: '#/components/schemas/ReplyWithId'
      x-error-codes: [invalid_fields, person_not_found, daily_limit_exceeded, internal_error, access_denied]

    EmptyBody:
      name: EmptyBody
      title: Command with no body
      contentType: application/json
      description: |
        The delete commands and the unsubscribe carry no body. They are validated all the same,
        with `joi.object({}).unknown(false)`, so **a payload with any field is rejected** with
        `invalid_fields`. An absent or empty body is normalized to `{}`.
      payload:
        $ref: '#/components/schemas/EmptyPayload'
      x-reply:
        $ref: '#/components/schemas/ReplyEmpty'
      x-error-codes:
        - invalid_fields
        - subscription_not_found
        - worked_time_not_found
        - unworked_time_not_found
        # REQ-007 (S-031): emitted ONLY by `worked-times.{id}.delete`, whose entry has to fall
        # inside the submission window. NOT by `unworked-times.{id}.delete` —absences never had
        # that window and did not gain it— and NOT by the unsubscribe.
        - invalid_date_range
        - internal_error
        - access_denied

  schemas:

    # -----------------------------------------------------------------------
    # Reply — identical for every command
    # -----------------------------------------------------------------------

    Reply:
      type: object
      description: |
        Reply format, the same for every command. Defined in
        `@jiku/nats-protocol`.

        **The `status` decides the transaction**: the dispatcher commits if it is `success` and
        rolls back in any other case.
      required: [status]
      properties:
        status:
          type: string
          enum: [success, failure]
        errorCode:
          type: string
          description: 'Present only with `status: failure`. See `ErrorCode`.'
        errorMessage:
          type: string
          description: |
            Free text. **It reaches the end user** through the api.

            English and Spanish are mixed, sometimes in the same file. It is inherited
            inconsistency that was not unified because the frontends display some of them
            directly.

            **Never put structured data in here** — see `errorDetails`. And **never the full
            subject**: it carries the user id.
        errorDetails:
          type: object
          additionalProperties: true
          description: |
            > **REQ-006 adds this field.** Optional, additive, and **absent** unless the emitter
            > passes it: `failure(errorCode, errorMessage)` keeps producing a reply **without the
            > key**, so the 21 commands are byte-for-byte unchanged.

            Structured data about the error, so a caller never has to parse `errorMessage` with a
            regex. The query contract (`jiku-queries`) uses it from day one — a rejected name comes
            back as `{ field, value, allowed }` — and any command may start using it.

            **What goes in here is CONTRACT data**: which field, which value, what was accepted.
            Never stack traces, never database column names, never SQL fragments. It reaches the
            caller and, once a consumer maps it to HTTP, potentially the end user.

            Consumers that do not know the field ignore it (`api/lib/utils/bus/protocol.ts` parses
            the envelope and drops unknown keys), so it is compatible in both directions.
        data:
          type: object
          description: Reply body. Absent on edits and deletes.

    ReplyWithId:
      allOf:
        - $ref: '#/components/schemas/Reply'
        - type: object
          description: |
            Reply of a creation. It returns **only the id**: since the contract with the frontends
            is the full record with its relations, the api re-reads the entity from the database
            after the command.
          properties:
            data:
              type: object
              required: [id]
              properties:
                id:
                  type: integer
          example:
            status: success
            data:
              id: 7

    ReplyEmpty:
      allOf:
        - $ref: '#/components/schemas/Reply'
        - type: object
          description: 'Reply with no content: the `status` is the whole reply.'
          example:
            status: success

    ReplyWithUploadTicket:
      allOf:
        - $ref: '#/components/schemas/Reply'
        - type: object
          description: |
            Reply of `files.request-upload`.

            > **Declared exception to `conventions/commands.md`** ("creations return only the
            > `id`"). There is no alternative here: the presigned URL is generated by core, is
            > single-use and short-lived, and the api cannot rebuild it by re-reading the database
            > without duplicating the key policy and standing up its own write signer — which is
            > exactly what D-08 centralizes in core. Documented as an exception, not as a pattern.

            > **The field is `id` on the bus and `fileId` over HTTP.** On the bus `id` is the
            > convention of every creation; over HTTP `fileId` says which id it is, which matters
            > because the HTTP attachment contract handles **two** id spaces (the link's and the
            > file's). The api translates, as it already does in its five documented contract
            > translations.
          properties:
            data:
              type: object
              required: [id, uploadUrl, expiresIn]
              properties:
                id:
                  type: integer
                  description: '`files.id`. Travels as `fileIds` when saving the entity.'
                uploadUrl:
                  type: string
                  description: |
                    **PutObject** presigned URL, single object and short TTL (D-10). The client
                    uses it straight against the storage: it goes through neither the api nor the
                    bus. It grants no listing, no reading and no deleting.
                expiresIn:
                  type: integer
                  description: 'Seconds of validity. Read from `system_settings`.'
          example:
            status: success
            data:
              id: 1234
              uploadUrl: 'https://bucket.example/grava-gestion/f/9c1e.../abcd.pdf?X-Amz-...'
              expiresIn: 300

    ReplyWithDownloadTicket:
      allOf:
        - $ref: '#/components/schemas/Reply'
        - type: object
          description: |
            Reply of `files.{fileId}.request-download`. Same declared exception as
            `ReplyWithUploadTicket`.

            The three metadata fields travel in the reply **on purpose**: the api needs them to
            build the headers of its response (or of the 302) without querying the database again,
            and the `HEAD` to the preview the frontends already use to resolve name and size keeps
            working unchanged.
          properties:
            data:
              type: object
              required: [downloadUrl, expiresIn, fileName, mimeType, fileSize]
              properties:
                downloadUrl:
                  type: string
                  description: |
                    **GetObject** presigned URL over `files.storage_key`, carrying
                    `response-content-disposition` so the original file name travels signed and S3
                    returns it without anybody proxying the byte.
                expiresIn:
                  type: integer
                  description: |
                    Seconds of validity, from `download-url-ttl-seconds`.

                    > **Security note.** A leaked read URL grants access to the content with no
                    > credential at all, and with the 302 that URL reaches the browser on **every**
                    > preview: it lands in history, in proxy logs and in the `Referer`. The default
                    > should be the shortest the UI tolerates.
                fileName:
                  type: string
                mimeType:
                  type: string
                fileSize:
                  type: integer
          example:
            status: success
            data:
              downloadUrl: 'https://bucket.example/grava-gestion/f/9c1e....pdf?X-Amz-...'
              expiresIn: 300
              fileName: informe.pdf
              mimeType: application/pdf
              fileSize: 4194304

    ErrorCode:
      type: string
      description: |
        Catalog of error codes, defined in `@jiku/nats-protocol`.

        > **The catalog is not closed.** The api maps to HTTP only the codes its routes use
        > today; any other one falls through to a 500. In particular, `unknown_command` has
        > **no** mapping.

        Three codes are emitted today as a string literal instead of the constant
        (`resolution_required`, `worked_time_not_found`, `unworked_time_not_found`). The value is
        correct, but it is duplicated by hand.

        > **REQ-001 adds five codes** for the `files` module. All five MUST be mapped in
        > `api/lib/utils/bus/protocol.ts` (ADR-002) or they fall through to a generic 500:
        > `file_type_not_allowed` → 400, `file_too_large` → 400, `file_not_owned` → **403**,
        > `file_not_found` → 404, `file_not_available` → 404.
        >
        > `file_not_owned` has to be **403, not 400**. Reusing `invalid_attachment_id` (mapped to
        > 400) would make "the file does not exist" indistinguishable from "the file is not
        > yours", and the second one is the new rule.

        > **REQ-005 adds one code, and it is the first one emitted by the DISPATCHER rather than
        > by a command**: `caller_not_authorized` → **403**. Core now authorises the CALLER of the
        > subject against the roles persisted in `users.roles`, before resolving the method and
        > before opening the transaction.
        >
        > **One code for two situations, deliberately.** "No row in `users`" and "there is a row
        > but the role does not allow this method" answer **the same thing**. Telling them apart
        > would leak to an unauthorised caller whether an identity exists in the database — a free
        > oracle. `user_not_found` is **not** reused for the same reason, and because it is already
        > mapped to **404**, which is the wrong status for a permissions refusal.
        >
        > **403 and not 400:** it describes a permission, not malformed input — the same argument
        > already written next to `file_not_owned`. **In practice the api never receives it** (its
        > channel is exempt from the gate, see `info.description`); it is mapped anyway because
        > **the map belongs to the service, not to the endpoint**.

        > **REQ-006 adds five codes, and NONE of them is emitted by a command.** They belong to the
        > query plane (`jiku-queries`), whose contract lives in its own spec —
        > `docs/apis/core-queries.yaml`. They are listed here because
        > **`ErrorCode` is one shared catalog** in `@jiku/nats-protocol`, not one per plane.
        >
        > | Code | Emitter | HTTP (once a consumer exists) |
        > |---|---|---|
        > | `unknown_caller` | query dispatcher | **403** |
        > | `query_timeout` | query engine (PostgreSQL `statement_timeout`, 8000 ms) | **504** |
        > | `invalid_cursor` | query engine (keyset cursor) | **400** |
        > | `comment_not_found` | `comments.get` | **404** |
        > | `task_not_found` | `tasks.get` | **404** |
        >
        > **The HTTP column is documentation, not code.** REQ-006 does **not** implement
        > `httpStatusForQuery` and does **not** touch `api/lib/utils/bus/protocol.ts`: when that REQ
        > closes, `bus.query()` still has no caller, so none of these five ever reaches an HTTP
        > response. The map belongs to the requirement that migrates the `GET` routes.
        >
        > **`unknown_caller` is NOT `caller_not_authorized`, and merging them would be a bug.**
        > Two different questions, both live in the query plane, in this order:
        > `authorizeCaller()` answers *"may this caller run this method?"* →
        > `caller_not_authorized`; resolving the caller **class** answers *"what do I trim for
        > them?"* → `unknown_caller` when there is no row in `users`, `roles` is empty, or the roles
        > map to no known class. Merging them would force a future `httpStatusForQuery` to map one
        > code to two causes and — worse — would erase the rule that **a caller with no row gets an
        > ERROR, never an empty list**, which would read as "there is no data".
        >
        > **`task_not_found` COEXISTS with `objective_not_found`, deliberately.** The bus resource is
        > called `tasks` (ADR-004: the product vocabulary lives in the contract, not in the schema),
        > so its not-found code is `task_not_found`. `objective_not_found` stays exactly where it is
        > — emitted by the commands — because retiring it would mean touching commands that REQ-006
        > declares untouched, and changing `sendCommand`'s HTTP map, which it also declares
        > untouched.
        >
        > **The `*_not_found` codes of the query plane do not distinguish "does not exist" from "you
        > cannot see it".** Answering a permission error would confirm to an external user that the
        > resource exists. And **a `list` never returns `*_not_found`**: a filter that matches
        > nothing is `items: []`.
      enum:
        - invalid_fields
        - internal_error
        - unknown_command
        - caller_not_authorized
        # REQ-006 — the five codes of the query plane. NONE is emitted by a command; see the note
        # above. Their contract lives in `docs/apis/core-queries.yaml`.
        - unknown_caller
        - query_timeout
        - invalid_cursor
        - comment_not_found
        - task_not_found
        - client_not_found
        - project_not_found
        - objective_not_found
        - requirement_not_found
        - user_not_found
        - person_not_found
        - invalid_responsible_person
        # CÓDIGO SIN EMISOR desde S-003: ningún comando lo devuelve ya. Los seis comandos de
        # dominio dejaron de emitirlo al pasar de `attachmentIds` a `fileIds` —un `fileId`
        # inválido cae en `invalid_fields` y uno ajeno en `file_not_owned`—. SE CONSERVA a
        # propósito: el catálogo no está cerrado, `@jiku/nats-protocol` es compartido (ADR-005)
        # y ningún criterio de aceptación pide retirarlo.
        - invalid_attachment_id
        - file_type_not_allowed
        - file_too_large
        - file_not_owned
        - file_not_found
        - file_not_available
        - requirement_project_mismatch
        - daily_limit_exceeded
        - invalid_date_range
        - already_subscribed
        - subscription_not_found
        - invalid_state_transition
        - stage_not_found
        - resolution_required
        # REQ-007 — "can you touch THIS entity?", decided by THE GATE with the row in front of
        # it. NOT the same question as `caller_not_authorized`, which is "does your role enable
        # this method?" and is decided by the role -> method map before touching the domain.
        #
        # THE GATE, NOT THE COMMAND (S-030 CA-15). The check lives in the dispatcher — after Joi
        # validation and before the transaction opens — and NONE of the 20 `execute()` were
        # touched. That is what makes it possible to tell a gate bug from a command bug. It runs
        # ONLY for callers in external mode.
        # It is also the code both frontends already know for this case, which is what keeps the
        # HTTP contract unchanged. Maps to 403 in the api's `STATUS_BY_ERROR_CODE`.
        - access_denied
        - worked_time_not_found
        - unworked_time_not_found

    # REQ-007 — the identity envelope.
    Actor:
      type: object
      description: |
        **Reserved top-level key of every command message.** Optional, and only the trusted
        publisher (`CORE_TRUSTED_PUBLISHER_ID`) may send it — any other caller that includes it is
        rejected with `invalid_fields`.

        The dispatcher **extracts it from the body before validating**, so the Joi schema of each
        command never sees it and the 21 `execute()` functions are unchanged.

        **It does not replace `creator` / `author` / `editor` / `uploader`.** Those are domain
        data (they end up in `requirements.created_by`, in the Activity's author, in
        `files.uploaded_by`). What changes is **who wins**:

        ```
        resolveActor(ctx, payload):
          if there is an envelope                          -> actor.id
          else if ctx.caller == CORE_TRUSTED_PUBLISHER_ID  -> payload.author/creator/editor/uploader
          else                                             -> ctx.caller
        ```

        If the envelope AND the domain field are both present **and differ**, the command is
        rejected with `invalid_fields` and `errorDetails: { field, value, expected }`. Two
        different identities in one message is a publisher bug, and resolving it silently is how
        one writes in someone else's name.
      required: [id, roles]
      properties:
        id:
          $ref: '#/components/schemas/IdentityUserId'
        roles:
          type: array
          items:
            type: string
          description: |
            From the `urn:zitadel:iam:org:project:roles` claim the api already verified against
            Zitadel. **Mandatory**: it is the input of the authorisation decision, and the role
            that decides is this one and not the publisher's.
        name:
          type: string
          description: 'Optional. Missing logs a warning; on INSERT it falls back to `email` or `id`.'
        username:
          type: string
          description: 'Optional. Same fallback as `name`.'
        email:
          type: string
          description: |
            Optional. **This is where the two mirrors differ on purpose:** the
            `{instance}.events.auth` event DISCARDS a person event without `email` rather than
            create a partial row; the command path does not, because rejecting a write over a
            profile field is disproportionate and a misconfigured `CALLOUT_IDP_ENRICH` would leave
            the product with no writes at all.

    EmptyPayload:
      type: object
      additionalProperties: false
      description: No fields. Any property is rejected with `invalid_fields`.

    # -----------------------------------------------------------------------
    # Reused types
    # -----------------------------------------------------------------------

    IdentityUserId:
      type: string
      description: |
        User id from the identity provider (`users.id`). **Not to be confused with `personId`**,
        which is the id from the `persons` table (a number). Both concepts coexist in
        `worked-times`.

    DateOnly:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: '`YYYY-MM-DD` date. The column is a STRING, not a DATE.'
      example: '2026-08-12'

    Property:
      type: object
      description: |
        Pair from the bus contract. It is translated into the `key_value_pairs` column, which
        stores a flat object: `[{code: 'documentacion', value: 'https://...'}]` is stored as
        `{documentacion: 'https://...'}`.
      required: [code]
      properties:
        code:
          type: string
          enum: [documentacion, diseño, board_de_tareas, mattermost_group_name]
          description: Accepted keys (`DefaultKeyValuePairs`).
        value:
          type: [string, 'null']
          description: |
            The first three codes are validated as a URI; `mattermost_group_name` is free text.
            It accepts `null` and the empty string.

    Tag:
      type: object
      description: Requirement tag. Stored in a JSONB column.
      properties:
        key:
          type: string
        value:
          type: string

    FilesRequestUploadPayload:
      type: object
      required: [uploader, fileName, mimeType, fileSize]
      properties:
        uploader:
          allOf:
            - $ref: '#/components/schemas/IdentityUserId'
          description: |
            Who uploads. For the api it is the end user authenticated by JWT.

            **An external publisher omits it: core resolves it from the subject's `caller`.** And
            if it sends one, it is **ignored**. See `x-resolve-actor`.

            It is optional on purpose: it is the lever of D-26.
        fileName:
          type: string
          maxLength: 255
          description: 'The original name. It is **not** the key — core builds the key.'
        mimeType:
          type: string
          maxLength: 100
          description: |
            Declared by the client. Validated against `file-allowed-mime-types`, **and the
            extension of `fileName` is validated against `file-allowed-extensions` as well**: a
            new type has to be added to both lists (RF-17, D-18).
        fileSize:
          type: integer
          minimum: 1
          description: 'Declared by the client. Validated against `file-max-size-bytes`.'
        checksum:
          type: [string, 'null']
          description: |
            Hexadecimal sha256 declared by the client. **NOBODY verifies it** (D-25), the same way
            nobody verifies `mimeType` or `fileSize` against the actual byte. The double allowlist
            validates **what is declared**, which was never a guarantee about the byte; the
            standing defence is the one on serving (`nosniff` + sandbox CSP), not the one on
            uploading.

    FilesRequestDownloadPayload:
      type: object
      properties:
        disposition:
          type: string
          enum: [inline, attachment]
          default: inline
          description: |
            `inline` for preview, `attachment` for download with a name. It determines the
            presigned URL's `response-content-disposition`, so the original name travels in the
            signed URL and S3 returns it without anybody proxying the byte.

    FileIds:
      type: array
      maxItems: 10
      description: |
        Ids from `files` to link. Each one has to exist, be alive (`retention_status: 'active'`)
        and have been uploaded by the actor of this command (REQ-001 RF-12). If any of them does
        not comply, the reply is `file_not_owned` or `invalid_fields` and **the whole write is
        discarded**.

        **Replaces `AttachmentIds`** (REQ-001, S-003). There are no drafts any more: the file
        already exists on its own and the link is created against the entity, which by then
        exists too.

        **Ownership is resolved per channel** — see `x-resolve-actor` below. It has **no
        exception by role**: an administrator cannot link a file they did not upload either
        (RF-13). Core knows nothing about roles, so the rule is uniform by construction.

        `maxItems: 10` moves the 10-file cap from `multer` to **the bus contract** (D-20): it
        stops being a transport limit and becomes a domain rule, validated by Joi.
      items:
        type: integer
        minimum: 1

    ResponsiblePersonIds:
      type: array
      description: |
        Ids from the `persons` table. **The first one in the list becomes the lead** — the order is
        information, not a detail.

        It is validated with a `count` against the length of the list, so **it does not report
        which one is missing**.
      items:
        type: integer

    # -----------------------------------------------------------------------
    # clients
    # -----------------------------------------------------------------------

    ClientsNewPayload:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          description: Accepts the empty string.

    ClientsEditPayload:
      type: object
      description: |
        Partial edit: no field is required. Absent = left untouched; with a value = replaced;
        `null` = cleared; `null` on a field that is mandatory at creation = fails.
      properties:
        name:
          type: string
          description: '**Does not accept `null`**: it is mandatory at creation.'
        description:
          type: [string, 'null']

    # -----------------------------------------------------------------------
    # projects
    # -----------------------------------------------------------------------

    ProjectsNewPayload:
      type: object
      required: [creator, name, code]
      properties:
        creator:
          $ref: '#/components/schemas/IdentityUserId'
        name:
          type: string
        code:
          type: string
        status:
          type: string
          enum: [analisis, activo, inactivo, finalizado, cancelado]
          default: analisis
        type:
          type: string
          enum: [interno, comercial, investigacion, propuesta]
          default: comercial
        description:
          type: string
        initDate:
          type: string
          format: date-time
          description: 'Default: the moment of validation.'
        endDate:
          type: [string, 'null']
          format: date-time
        clientId:
          type: [integer, 'null']
          description: If present, the actor is validated to exist.
        properties:
          type: array
          items:
            $ref: '#/components/schemas/Property'

    ProjectsEditPayload:
      type: object
      description: 'Partial edit: no field is required and no defaults are applied.'
      properties:
        name:
          type: string
          description: Does not accept `null`.
        code:
          type: string
          description: Does not accept `null`.
        status:
          type: string
          enum: [analisis, activo, inactivo, finalizado, cancelado]
        type:
          type: string
          enum: [interno, comercial, investigacion, propuesta]
        description:
          type: [string, 'null']
        initDate:
          type: string
          format: date-time
          description: Does not accept `null`.
        endDate:
          type: [string, 'null']
          format: date-time
        clientId:
          type: [integer, 'null']
        properties:
          type: array
          items:
            $ref: '#/components/schemas/Property'

    # -----------------------------------------------------------------------
    # tasks
    # -----------------------------------------------------------------------

    TaskPriority:
      type: string
      description: |
        Task priority. **An enum on the bus, an integer in the column** (`objectives.priority` is
        INTEGER NOT NULL): `sin_prioridad`=0, `baja`=1, `media`=2, `alta`=3, `urgente`=4.

        Not to be confused with `requirements.priority`, which is an actual enum in the database.
      enum: [sin_prioridad, baja, media, alta, urgente]

    TasksNewPayload:
      type: object
      required: [creator, title, projectId, responsiblePersonIds]
      properties:
        creator:
          $ref: '#/components/schemas/IdentityUserId'
        title:
          type: string
        description:
          type: [string, 'null']
        estimatedFinishDate:
          type: [string, 'null']
          description: |
            Accepted as a date and coerced to `YYYY-MM-DD`: the column is a STRING, not a DATE.
        state:
          type: string
          enum: [backlog, activo, finalizado, cancelado, en_revision]
          default: backlog
        area:
          type: string
          enum: [diseño, desarrollo, gestion, investigacion]
          default: desarrollo
          description: |
            **Corrected:** an earlier prose version marked this both required and defaulted,
            which is contradictory. It is optional, with default `desarrollo`.
        priority:
          allOf:
            - $ref: '#/components/schemas/TaskPriority'
          default: sin_prioridad
        priorityValue:
          type: integer
          minimum: 0
          maximum: 5
          description: |
            **A transitional escape hatch, not part of the contract.** The enum has 5 values and
            the column accepted 0-5, so the round-trip translation would collapse 5 into 4. The api
            sends the original number here and core uses it as is, ignoring `priority`.

            It goes away once the web speaks in priority names.
        projectId:
          type: integer
        responsiblePersonIds:
          $ref: '#/components/schemas/ResponsiblePersonIds'
        visibilityLevel:
          type: string
          enum: [public, internal]
          default: public
        requirementId:
          type: [integer, 'null']
          description: If present, it has to belong to the given project.
        fileIds:
          allOf:
            - $ref: '#/components/schemas/FileIds'
          description: |
            Files to link to the task being created.

            > **Discrepancy resolved by REQ-001 (S-003).** This payload did not declare
            > `attachmentIds`, yet the message declared `invalid_attachment_id` among its
            > `x-error-codes`. RF-9 requires linking files to tasks, so in the new model this
            > command carries `fileIds`. **Verify against `core/src/commands/tasks/` when
            > implementing** and keep spec and code consistent.

    TasksEditPayload:
      type: object
      required: [editor]
      description: 'Partial edit: only `editor` is required.'
      properties:
        editor:
          allOf:
            - $ref: '#/components/schemas/IdentityUserId'
          description: |
            **Required even though the protocol does not declare it.**
            `objective_activities.changed_by` has a foreign key against `users`, so without a real
            user id the activity cannot be logged.
        title:
          type: string
        description:
          type: [string, 'null']
        estimatedFinishDate:
          type: [string, 'null']
        state:
          type: string
          enum: [backlog, activo, finalizado, cancelado, en_revision]
        area:
          type: string
          enum: [diseño, desarrollo, gestion, investigacion]
        priority:
          $ref: '#/components/schemas/TaskPriority'
        priorityValue:
          type: integer
          minimum: 0
          maximum: 5
          description: See `TasksNewPayload.priorityValue`.
        responsiblePersonIds:
          allOf:
            - $ref: '#/components/schemas/ResponsiblePersonIds'
          description: |
            Full replacement: the ones not present are deleted and the ones that are get upserted,
            preserving the row and its `createdAt`.
        visibilityLevel:
          type: string
          enum: [public, internal]
        requirementId:
          type: [integer, 'null']
        fileIds:
          allOf:
            - $ref: '#/components/schemas/FileIds'
          description: |
            The **COMPLETE set** that must end up linked to the task, same semantics as
            `RequirementsEditPayload.fileIds`.

            > Same discrepancy as `TasksNewPayload.fileIds`, resolved the same way by REQ-001.

    TasksCommentPayload:
      type: object
      required: [author, comment]
      properties:
        author:
          $ref: '#/components/schemas/IdentityUserId'
        comment:
          type: string
        visibilityLevel:
          type: string
          enum: [public, internal]
          default: internal
          description: |
            The comment is the only activity type whose visibility the user chooses; in the rest it
            is automatic, per field.
        fileIds:
          allOf:
            - $ref: '#/components/schemas/FileIds'
          description: |
            Files to link to the comment. **No draft `entityType` is involved any more**: the
            files already exist on their own and the link is created against the comment once it
            exists (REQ-001, S-003). The web always sends this field, even when the array is
            empty.

    # -----------------------------------------------------------------------
    # requirements
    # -----------------------------------------------------------------------

    RequirementsNewPayload:
      type: object
      required: [creator, title, description, projectId]
      properties:
        creator:
          $ref: '#/components/schemas/IdentityUserId'
        title:
          type: string
        description:
          type: string
        projectId:
          type: integer
        type:
          type: [string, 'null']
          enum: [funcionalidad, mejora, incidencia, otro, null]
        priority:
          type: string
          enum: [sin_prioridad, baja, media, alta, urgente]
          default: sin_prioridad
          description: 'Unlike tasks, here the enum is an enum in the database too.'
        visibilityLevel:
          type: string
          enum: [public, internal]
          default: public
        state:
          type: string
          enum: [analisis, planificacion, en_cola, desarrollo, revision, resuelto, cancelado]
          description: |
            **Corrected:** an earlier prose version did not declare `state` on creation, but
            the api accepts it and the web uses it. Default `analisis`.
        responsiblePersonIds:
          $ref: '#/components/schemas/ResponsiblePersonIds'
        estimatedFinishDate:
          type: [string, 'null']
          format: date-time
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        fileIds:
          allOf:
            - $ref: '#/components/schemas/FileIds'
          description: |
            Files to link to the requirement being created. The requirement and its links are
            written in **a single transaction**: if anything fails, neither the requirement nor a
            single link survives — but the `files` rows do, unlinked, which is a valid state
            (REQ-001 RF-1).
        # attachmentScope - REMOVED by REQ-001 (S-003). It existed only to choose the draft's
        # anchor, and there are no drafts any more.
        scope:
          type: [string, 'null']
        technicalSolution:
          type: [string, 'null']
        acceptanceCriteria:
          type: [string, 'null']

    RequirementsEditPayload:
      type: object
      required: [editor]
      description: 'Partial edit: only `editor` is required.'
      properties:
        editor:
          allOf:
            - $ref: '#/components/schemas/IdentityUserId'
          description: 'Required: `requirement_activities.changed_by` has an FK against `users`.'
        title:
          type: string
        description:
          type: string
        type:
          type: [string, 'null']
          enum: [funcionalidad, mejora, incidencia, otro, null]
        priority:
          type: string
          enum: [sin_prioridad, baja, media, alta, urgente]
        visibilityLevel:
          type: string
          enum: [public, internal]
        state:
          type: string
          enum: [analisis, planificacion, en_cola, desarrollo, revision, resuelto, cancelado]
          description: |
            A state change triggers the model's hook, which sets the transition timestamps and logs
            the activity.
        responsiblePersonIds:
          allOf:
            - $ref: '#/components/schemas/ResponsiblePersonIds'
          description: 'Full replacement: ALL of them are deleted and recreated.'
        estimatedFinishDate:
          type: [string, 'null']
          format: date-time
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        fileIds:
          allOf:
            - $ref: '#/components/schemas/FileIds'
          description: |
            The **COMPLETE set** that must end up linked: the ones that were not there get a new
            `attachments` row and the ones no longer present have their link deleted. This differs
            from creation, where it is only the list to link.

            **It operates on the link, not on the file** (REQ-001, S-003): deleting a link never
            deletes the file, because a file can have 0..N links and removing the object would
            break the others.
        resolutionType:
          type: [string, 'null']
          enum: [error_interno, fuera_de_alcance, error_externo, discutible, otro, null]
          description: |
            **Known overlap:** resolution has its own command (`requirements.{id}.resolve`), but
            the api's `PATCH` still sends these three fields here, and in fact it is the only path
            through which resolution happens today.
        resolutionConclusion:
          type: [string, 'null']
        resolutionComment:
          type: [string, 'null']
        scope:
          type: [string, 'null']
        technicalSolution:
          type: [string, 'null']
        acceptanceCriteria:
          type: [string, 'null']

    RequirementsResolvePayload:
      type: object
      required: [editor, type]
      properties:
        editor:
          $ref: '#/components/schemas/IdentityUserId'
        type:
          type: string
          enum: [error_interno, fuera_de_alcance, error_externo, discutible, otro]
          description: |
            Resolution type (`RequirementResolution`). Not to be confused with the `state`, which
            moves to `resuelto`: this is the REASON.
        conclusion:
          type: [string, 'null']
          description: |
            If the requirement is of type `incidencia`, a conclusion is needed: the one in the
            payload or the one already stored. If there is neither, it replies
            `resolution_required`.
        comment:
          type: [string, 'null']

    RequirementsCommentPayload:
      type: object
      required: [author, comment]
      properties:
        author:
          $ref: '#/components/schemas/IdentityUserId'
        comment:
          type: string
        visibilityLevel:
          type: string
          enum: [public, internal]
          default: internal
        fileIds:
          allOf:
            - $ref: '#/components/schemas/FileIds'
          description: |
            Files to link to the comment. **No draft `entityType` is involved any more**: the link
            is created against the already existing comment (REQ-001, S-003).

    SubscriptorNewPayload:
      type: object
      required: [userId]
      properties:
        userId:
          $ref: '#/components/schemas/IdentityUserId'

    # -----------------------------------------------------------------------
    # times
    # -----------------------------------------------------------------------

    WorkedTimesNewPayload:
      type: object
      required: [date, minutes, projectId]
      description: |
        Extra constraint: `taskId` and `requirementId` are mutually exclusive.

        **REQ-007: `personId` moved out of `required`.** See its description below.
      properties:
        date:
          $ref: '#/components/schemas/DateOnly'
        minutes:
          type: integer
          minimum: 1
          description: 'Cap: the day''s total cannot go over 1440.'
        projectId:
          type: integer
        taskId:
          type: [integer, 'null']
          description: |
            The bus name for `objective_id`. **Exclusive with `requirementId`.**
        requirementId:
          type: [integer, 'null']
          description: |
            **Exclusive with `taskId`.** If present, it has to belong to the given project.
        personId:
          type: integer
          description: |
            Id from the `persons` table. **OPTIONAL since REQ-007** (S-031). When absent, core
            resolves it **from the actor**: `SELECT id FROM people WHERE user_id = {actor}`. If
            the actor has no linked Person: `person_not_found`.

            > **The "Corrected" note that used to be here is DEROGATED.** It read: *"an earlier
            > prose version declared it optional, defaulting to 'the authenticated user's person'.
            > Core cannot do that — it does not know the end user. The api resolves that default
            > before publishing."* **With the identity envelope, core DOES know the end user.**
            >
            > Without this change a person publishing straight to the bus would have to know their
            > own `people.id` — an id no interface shows them — and the parity between the two
            > paths would be false.

            **If it IS sent and differs from the actor's own Person**, only an `admin` is allowed
            (C-41); anyone else gets `access_denied`.

    # REQ-007 — S-032. The 21st command.
    WeekAssignedTimesReplacePayload:
      type: object
      required: [dateFrom, assignments]
      additionalProperties: false
      description: |
        Full-week replacement of the assignment grid. `internal` is NOT accepted: core derives it
        from `projects.type`.
      properties:
        dateFrom:
          allOf:
            - $ref: '#/components/schemas/DateOnly'
          description: |
            **Monday** of the week being replaced. Any other weekday: `invalid_fields`. A week in
            the past: `invalid_date_range` (C-36).
        assignments:
          type: array
          description: |
            The whole grid for that week. Entries with `minutes: 0` are **discarded**, not stored.
            An empty array is valid and clears the week.
          items:
            type: object
            required: [projectId, personId, minutes]
            additionalProperties: false
            properties:
              projectId:
                type: integer
              personId:
                type: integer
                description: 'Id from the `persons` table.'
              minutes:
                type: integer
                minimum: 0

    UnworkedTimesNewPayload:
      type: object
      required: [date, minutes, reason, personId]
      properties:
        date:
          $ref: '#/components/schemas/DateOnly'
        minutes:
          type: integer
          minimum: 1
          description: |
            Cap of 1440 per day, **adding up worked AND unworked time**.
        reason:
          type: string
          enum:
            - tramite
            - corte_servicios
            - vacaciones
            - dia_no_laborable
            - personal
            - medico
            - estudio
            - enfermedad
            - otro
        personId:
          type: integer
          minimum: 1
          description: |
            **Still required, on purpose.** It used to say *"required, just like in
            `worked-times.new`"* — that sentence went stale with REQ-007 (S-031), where
            `personId` moved OUT of `required` in `worked-times.new`.

            It did **not** move here: S-031 CA-10 only moved **ownership** to core for absences,
            not the default resolution. The api keeps its `resolvePersonId` for this route.

            > **Ownership (REQ-007, S-031):** if the Person is not the actor's own and the actor
            > is not `admin`, core answers `access_denied`. Same rule as `worked-times.new`
            > (C-41), and the same one that guards `unworked-times.{id}.delete`.

tags:
  - name: clients
    description: Actors — called `clients` in the database and on the bus. 2 commands.
  - name: projects
    description: Projects. 2 commands.
  - name: tasks
    description: |
      Tasks. 3 commands. The table is `objectives`; the protocol calls them `tasks`.
  - name: requirements
    description: Requirements, comments and subscriptions. 6 commands.
  - name: times
    description: |
      Worked and unworked time logging, and the weekly assignment grid. **5 commands** since
      REQ-007 added `week-assigned-times.replace`.
