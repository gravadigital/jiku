components:

  messages:

    ClientsNew:
      name: ClientsNew
      title: clients.new
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ClientsNewPayload'
      x-reply:
        $ref: '#/components/schemas/ReplyWithId'
      # REQ-007 / S-030 — `access_denied` FIGURA EN LOS 20 CANALES DE COMANDO, y este comentario
      # va UNA SOLA VEZ para no repetirlo veinte (el mismo criterio con que la clave `actor` se
      # documenta una vez y no por canal).
      #
      # POR QUÉ `access_denied` SÍ Y `caller_not_authorized` NO. Son dos preguntas distintas,
      # decididas en dos momentos distintos:
      #
      #   caller_not_authorized -> "¿tu rol habilita este método?". Lo decide el mapa rol → método
      #      ANTES de resolver el canal, así que no es una respuesta DE ESTE canal sino del
      #      despachador. Por eso no figura en el `x-error-codes` de ningún mensaje (mismo
      #      criterio que `api/lib/utils/bus/protocol.ts`).
      #
      #   access_denied -> "¿podés tocar ESTA entidad?". Se decide CON LA ENTIDAD DEL CANAL
      #      DELANTE —resolviendo el proyecto desde el tipo de entidad y exigiendo la fila en
      #      `user_project_permissions`—, así que SÍ es una respuesta posible de este canal.
      #
      # SOLO SE EMITE EN MODO EXTERNO (clase de caller `external`). Un `admin`, un `user` o un
      # conector NUNCA lo reciben: los usuarios internos no tienen filas en
      # `user_project_permissions`, y exigírselas rompería toda la escritura interna.
      #
      # OJO CON `EmptyBody`: LO COMPARTEN TRES CANALES —`requirements.{id}.subscriptors.{userId}.delete`,
      # `worked-times.{id}.delete` y `unworked-times.{id}.delete`—, así que el código se agrega
      # una vez y aplica a los tres. `WeekAssignedTimesReplace` NO lo lleva: es el canal 21, su
      # comando todavía no existe en el registry y su dueño es S-032.
      #
      # EL TERCER LUGAR DEL CÓDIGO SIGUE ABIERTO: `STATUS_BY_ERROR_CODE` de la api tiene que
      # mapear `access_denied` -> 403, y es de `S-030.api.*`. SIN ESE MAPEO el código cae en el
      # `|| 500` de `httpStatusFor` y el frontend lo trata como error de servidor en vez de
      # mostrar el mensaje. El síntoma no es un error de compilación.
      x-error-codes: [invalid_fields, internal_error, access_denied]

