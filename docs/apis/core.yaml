asyncapi: '2.6.0'

# Messaging contract of `core` — the 21 commands it serves over NATS as the `jiku-commands` micro
# service.
#
# REQ-007 — WRITES OPEN TO PEOPLE, AND THE RULES MOVE HERE
#   Three things change in this contract and they are called out inline as "REQ-007":
#     1. Every message accepts a reserved top-level key `actor` (see `components/schemas/Actor`),
#        extracted by the dispatcher BEFORE validation. Only the trusted publisher may send it.
#     2. `week-assigned-times.replace` is the 21st command: the weekly assignment grid stops being
#        the only domain write that does not go through core.
#     3. Rules that used to live in the api now live here: the submission window, who may log time
#        for someone else, the requirement state workflow and the mandatory conclusion.
#
# WHY AsyncAPI AND NOT OpenAPI
#   Core exposes no HTTP: no port, no endpoints, no verbs. Its only interface is the bus, with
#   request/reply over NATS. An OpenAPI spec would have to invent routes that do not exist.
#
# THIS FILE IS THE SOURCE OF TRUTH
#   Everything that travels over the bus is answered by core, so this spec is the whole
#   contract. Where the code and this file disagree, the file wins.
#
#   It was written by reading the Joi schemas in `core/src/commands/`, so it describes what
#   core actually accepts. Three points where an earlier prose version of this protocol said
#   otherwise are called out inline as "Corrected": in all three the code was right.

info:
  title: Jiku core — NATS command contract
  version: 1.0.0
  description: |
    `core` is the only service that writes to Jiku's database. It serves commands published by
    the api over NATS, validates the business rules and writes.

    **One process, two logical services on the bus.** Since REQ-004 the `core` process registers
    **two NATS micro services over a single connection**: `jiku-commands`, the 21 write commands
    this spec describes, and `jiku-queries`, the read endpoints, with their own queue group and
    their own read-only connection to PostgreSQL. **The contract of `jiku-queries` is OUT OF SCOPE
    of this spec, and that is permanent** — this file stays the contract of the commands.

    **That contract now EXISTS and lives in `docs/apis/core-queries.yaml`** (AsyncAPI 2.6, same
    format, same "the document wins" rule), written by REQ-006: **23 endpoints over 16 resources**,
    all of them with a resource sheet. `nats micro info jiku-queries` lists the 23 with their own
    queue group, and none of them answers `unknown_command` — the transitional stub
    (`core/src/queries/pending.ts`) was deleted by the last story of that requirement.

    > **16 resources, not 18.** The "18" this file carried came from counting the sections of the
    > *Recursos* chapter of the analysis document, which counted `requirements.tags` and
    > `meta.describe` as if they were resources. They are not: the first is an OPERATION of
    > `requirements` and the second is the describer. The ENDPOINT count is exact at 23.

    **What REQ-006 changes IN THIS FILE** is only what is shared with the commands: the `Reply`
    envelope gains the optional `errorDetails`, and `ErrorCode` gains five codes that **no command
    emits**. Both changes are additive; the 20 commands are unchanged.

    **What REQ-007 changes in this file.** Every message accepts the reserved key `actor`
    (`components/schemas/Actor`), the 21st command appears (`week-assigned-times.replace`), and
    several channels gain business rules that used to be enforced by the api. `ErrorCode` gains
    `access_denied`. **The `actor` key is described ONCE, here and in `Actor` — it is not repeated
    on the 21 channels**, because it belongs to the transport and not to the domain: the
    dispatcher extracts it before `registry.resolve()` and before `sequelize.transaction()`, so
    the Joi schema of each command never sees it.

    **Who may send `actor`.** Only the trusted publisher (`CORE_TRUSTED_PUBLISHER_ID`, the api). A
    caller that is not the trusted publisher and sends `actor` is rejected with `invalid_fields`:
    for everyone else the identity **is** the second token of the subject, which the auth-callout
    makes unforgeable. It is the same doctrine `core-queries.yaml` already states for the read
    plane.

    **The identity mirror.** When `actor` arrives, core writes `users` (`INSERT … ON CONFLICT DO
    UPDATE` over `name`, `username`, `email`, `roles`, `identity_type`) **in its own transaction
    and BEFORE authorising**, so the row that authorises a direct bus caller is written by the
    same claim that authorises the api's caller. `actor.id` and `actor.roles` are mandatory;
    missing profile fields log a warning and do **not** reject the command.

    **Both services are discoverable.** `$SRV.PING` / `INFO` / `STATS` report, per endpoint,
    request count, mean latency and last error. One caveat worth knowing before building a
    dashboard: **`num_errors` stays at 0 by design of the library** — `respondError()` does not
    increment it — so failures are measured by logs and by `errorCode`, never by that metric.

    **Pattern: request/reply, no JetStream.** Every message is answered on the spot. There is
    no queue, no retry and no persistence: if core is down, the api's request times out and
    the operation did not happen.

    **Core does not authenticate users, but since REQ-005 it DOES know about roles.** It still
    trusts the `creator` / `author` / `editor` that travels in the body **inside the api's
    channel** — but that trust **no longer rests entirely on the bus access policy**. There is now
    a second plane:

    **Authorisation gate on the caller (REQ-005).** Both dispatchers — commands and queries —
    check the caller of the subject **before resolving the method and before opening the
    transaction**:

    ```
    caller == CORE_TRUSTED_PUBLISHER_ID  -> passes WITHOUT touching the database
    otherwise                            -> User.findByPk(caller)
                                              no row                        -> caller_not_authorized
                                              row, no role allows the method -> caller_not_authorized
    ```

    The map of role → method is closed and **deny-by-default** (ADR-008): `internal-app` — **the
    connector role** — gets **every command and every query**; the product roles (`admin`, `user`,
    `external-user`) get **every query**; anything absent from the map authorises nothing.

    **Since REQ-007 / S-030 the product roles DO authorise commands, and the map distinguishes two
    channels.** Until that story it said "no command" for all three, because the business rules
    that depend on the end user lived in the api and had nowhere to live on the writer's side.

    | Role | Commands published DIRECTLY to the bus | Commands published WITH AN ENVELOPE |
    |---|---|---|
    | `internal-app` | all | all |
    | `admin` | the 18 enumerated | the same 18 |
    | `user` | the same 18 as `admin` | those 18 + `requirements.{id}.subscriptors.new` |
    | `external-user` | **none** | the 6 the portal reaches over HTTP |
    | `core` · `bus-observer` | none | none |
    | unknown role | none | none |

    **Why the two channels are not the same list, and why only one role declares the difference.**
    An `external-user` **does not write over the bus** (REQ-007 §20): its callout template gives it
    no publish permission, and this map is the *second, independent* defence in case that template
    were ever wrong. But it **does write through the portal** — six opus endpoints declare
    `external-user` and publish a command — and since S-029 that write arrives here inside an
    envelope carrying `actor.roles`. With a single list you have to choose between breaking the
    portal and opening the bus. With two, you don't.

    **A command a person reaches ONLY because the api publishes it on their behalf goes in the
    envelope column, not the direct one.** `user` reaches
    `requirements.{id}.subscriptors.new` solely as the secondary command of
    `POST /api/opus/requirements`; the subscription endpoint itself is `external-user` only. Putting
    it in the direct column would let any `user` on the bus subscribe anyone to any requirement —
    more than their HTTP surface allows. This story migrates rules; it does not invent them.

    **The role that decides is the ACTOR's, not the publisher's.** `internal-app` is still exempt
    as a **publisher** — that is what lets it send the envelope — but it is **no longer the
    authoriser**: when a command arrives with an envelope, the map is consulted with the person's
    roles.

    **The enumeration is derived from `x-roles` in `docs/apis/api.yaml`, endpoint by endpoint**, and
    a parity test verifies it against that spec. It is not written from memory, and it must not be
    edited by hand. Note that a route may publish **more than one command**: `x-bus-command`
    documents the 1:1 endpoint → command correspondence, so a secondary command (such as the
    subscription `POST /api/opus/requirements` publishes after creating the requirement) does not
    appear in the spec at all and is declared as data in that test.

    `week-assigned-times.replace` is **not** in the map: the 21st command does not exist in the
    registry yet, and its entry (`admin` only) belongs to S-032.

    > **`external-publisher` was removed.** It enumerated the 9 subjects of a callout template of
    > its own, for the channel REQ-001 RF-11 defined — an outside service that uploads files and
    > links them without going through the api. **The role never existed in Zitadel**, so the
    > channel was never used and the two enumerations were dead configuration kept in sync by
    > hand. The capability survives — an outside service now carries `internal-app` — but its
    > size changed: **from 9 enumerated write subjects to both planes in full**, plus the
    > `connector` caller class, which applies **no row-level trimming** to reads. A narrower
    > connector is a new role, with its own template and its own entry in the map.

    **Why the api's channel is exempt, and why it is not a shortcut.** Without the exemption there
    is a **silent total write outage**: if the api connects to the bus before core is subscribed,
    its authentication event is lost (core NATS, no retry, no record), the api stays connected and
    functional **without a row in `users`**, and core refuses **all 21 commands** with a 403 — until
    the api reconnects, which with a hot-renewed ~1 h token may not happen for days. The api also
    already authorises by role before publishing (`hasAnyRole`), so consulting `users.roles` for its
    service user would be authorising the same thing twice from two sources, with the worse of the
    two deciding. The exemption reuses the very constant and branch that `resolveActor` already has.

    > **REQ-007 — the two paragraphs that used to be here are DEROGATED, and this is the change
    > that gives the requirement its name.**
    >
    > They read: *"Product roles authorise no command on purpose. Core does not hold the business
    > rules that depend on the end user — the worked-hours window, who may charge hours to someone
    > else, the frozen past weeks of assignment. They live in the api"*; and *"People CAN now
    > connect to the bus (REQ-005), but **only to read**"*.
    >
    > **Both are now false, and in this order:**
    >
    > 1. **The three rules moved here** (S-031, S-032). The window and the charge-to-others rule
    >    live in `worked-times.new`; the frozen past week lives in the 21st command,
    >    `week-assigned-times.replace`, which had to be created because there was nowhere to put
    >    it. The requirement state workflow (S-033) joined them, and it was never in the api
    >    either — it lived only in `web`.
    > 2. **The role -> method map enumerates commands for `admin` and `user`** (S-030), instead of
    >    saying "no command". It is still deny-by-default: no match, no authorisation, and an
    >    unknown role authorises nothing. `external-user` still gets **no command at all**.
    > 3. **`templates/person.yaml` was split** (S-035) into `person-internal.yaml` — queries **and**
    >    commands — and `person-external.yaml`, which keeps exactly today's permissions. Adding
    >    commands to the shared template would have given them to `external-user` too.
    >
    > **The acting user still travels in the body for the api's channel**, now as the reserved
    > `actor` key rather than scattered across `creator`/`author`/`editor`/`uploader` — the subject
    > identifies the api, not the person. **For every other channel the identity IS the subject**,
    > and sending `actor` from a non-trusted caller is `invalid_fields`.

    **The transaction belongs to the dispatcher**: commit if the reply is `success`, rollback
    in any other case.

    ## REQ-001 — files, ownership and the storage

    **Core is the single owner of the storage.** With the `files` module it stops consuming only
    "PostgreSQL, NATS, Zitadel" and gains an S3 client that signs PUT and GET. **The api keeps no
    S3 credentials**, so it cannot reach an object core did not sign for it — a guarantee of
    infrastructure, not of discipline, the same kind ADR-001 achieved for database writes.

    **Ownership of a file is resolved per channel (`resolveActor`).** `CommandContext.caller` is
    the SERVICE that published, taken from the subject; for the api it is a single service user
    shared by every person. So neither comparison works on its own: `uploaded_by == caller`
    breaks the web, and `uploaded_by == payload.author` does not satisfy RF-14. The resolution is:

    ```
    resolveActor(ctx, payload):
      if ctx.caller == CORE_TRUSTED_PUBLISHER_ID   (the api's service user, from config)
         -> the actor is payload.author / creator / editor / uploader
            (the api ALREADY authenticated that person against Zitadel by JWT)
      else
         -> the actor is ctx.caller
            (an external publisher has no person behind it: its identity IS the subject's,
             vouched by the auth-callout and unforgeable. Whatever it declares is IGNORED)
    ```

    And then, uniform across both channels:
    `if File.uploaded_by != resolveActor(ctx, payload) -> failure(file_not_owned)`.

    - **`files.request-upload` and the six domain commands MUST use the same function.** If
      uploading and linking resolved identity differently, nobody could link what they uploaded.
    - **No exception by role** (RF-13): core knows nothing about roles, so the rule is uniform by
      construction — there is nowhere to put the exception even if one wanted to.
    - **What is still not covered:** inside the api's channel, core keeps trusting the `author` in
      the body (D-24). Someone holding the api's service user could link files as anybody. This
      design does not close that hole — it **narrows it to the api's channel**; the external
      publisher, which is the new actor, is fully covered.
    - **`CORE_TRUSTED_PUBLISHER_ID` is configuration, not a literal**, and **core MUST fail to
      start without it**: an empty default would send every `caller` down the external branch and
      break the web silently. The external branch should log at `warn`, since today it is the rare
      case.
  license:
    name: Apache-2.0
  contact:
    name: Grava Digital

defaultContentType: application/json

servers:
  dev:
    url: nats://localhost:4222
    protocol: nats
    description: |
      Development instance. `NATS_INSTANCE=dev`.

      Authentication has two layers: the sentinel creds (`NATS_CREDS`) grant no permissions on
      their own — it is the Zitadel service user token that triggers the auth-callout, which
      reads the role and mints the subject permissions for that connection.
  prod:
    url: nats://nats:4222
    protocol: nats
    description: Production instance. `NATS_INSTANCE=prod`.

# ---------------------------------------------------------------------------
# Subject grammar
# ---------------------------------------------------------------------------
#
#   {instance}.{user-id}.{svc}.{version}.{method}
#   dev.323332022539911171.jiku-commands.v1.clients.new
#
#   instance   deployment: dev / prod              (NATS_INSTANCE)
#   user-id    WHO publishes: the token's `sub`, RAW
#   svc        jiku-commands                       (NATS_COMMAND_SERVICE)
#              jiku-queries                        (NATS_QUERY_SERVICE)
#   version    protocol version: `v1`              (NATS_PROTOCOL_VERSION)
#   method     clients.new, requirements.{id}.edit, ...
#
# THE GRAMMAR DID NOT CHANGE — the set of values of the `{svc}` token went from one to two.
#
# Core registers the group `{instance}.*.{svc}.{version}` per service and subscribes one endpoint
# per method, with queue group `jiku-commands` for the commands and `jiku-queries` for the
# queries. The wildcard covers any caller and several replicas share the messages between them.
#
# WHY THE SEPARATION LIVES IN `{svc}` AND NOT NESTED UNDER THE COMMANDS SERVICE. The commands
# subscription used to be `{instance}.*.{svc}.v1.>`, and that `>` would also swallow the queries
# if they shared the `{svc}` token. Two different queue groups over overlapping subjects means the
# message is delivered to BOTH subscriptions and TWO replies reach the same inbox; a plain
# `request()` returns the first and DISCARDS THE SECOND SILENTLY. Sharing the process does not
# avoid it: the overlap is in the subject. With a distinct `{svc}` the problem cannot happen,
# because subject tokens are compared whole.
#
# ---------------------------------------------------------------------------
# THE EVENT SUBJECT DOES NOT FOLLOW THIS GRAMMAR, AND THAT IS CORRECT (REQ-005)
# ---------------------------------------------------------------------------
#
#   {instance}.events.auth                          3 segments, fire-and-forget, NO reply
#   {instance}.{user-id}.{svc}.{version}.{method}    5+ segments, request/reply
#
# DO NOT "FIX" IT into the grammar above. It is a different shape because it is a different
# pattern:
#   - There is no reply. The publisher (`auth-callout`, credential `callout-events`) does not
#     wait for anything, and there is nothing to ack: `CALLOUT_EVENTS_STREAM` is deliberately
#     left undefined, so the message is plain core NATS, not JetStream.
#   - There is no caller in the subject. The identity travels in the payload (`id` = the Zitadel
#     `sub`), because the event is ABOUT an identity rather than published BY one on its behalf.
#   - It is NOT a micro endpoint. Micro is request/reply and every endpoint must answer;
#     `respond()` on a message without a reply subject is a silent no-op that also pollutes the
#     `$SRV` counters. Core consumes it with a FLAT subscription plus a queue group, in
#     `src/bus/host.ts`, and `registerService()` is untouched.
#   - It has its own dispatcher (`src/events/`), not a branch of the command one: no `Reply`, no
#     caller in the subject, total-replacement update semantics, and no `status` to decide the
#     transaction. Four `if`s make a different dispatcher.
#
# CORE CONSUMES, IT STILL DOES NOT PUBLISH. The ADR-002 rule ("Core MUST NOT publish messages")
# is intact.
#
# THE SUBSCRIPTION PERMISSION IS THE LITERAL SUBJECT in `templates/core.yaml` `sub.allow` — never
# `{{instance}}.events.>`. Deny-by-default applies on the bus too (ADR-008): a future event MUST
# require a new line there, so no consumer starts receiving a new event type just because someone
# added it to the namespace. WITHOUT THAT LINE core starts, serves the 21 commands, logs that it
# subscribed, and receives nothing — the permissions violation is asynchronous and lands in the
# NATS SERVER's log, never as a failure of `subscribe()`.
#
# The event's contract (payload, guards, field mapping) is documented in
# `docs/flows/sincronizacion-de-identidades.md`, not in `channels` below: it is not a
# request/reply channel and modelling it as one would be wrong.
#
# The `channels` below are named after the COMMAND, not the full subject: the prefix is the same
# for all of them and depends on the environment.
#
# EVERY CHANNEL IS A MICRO ENDPOINT. The endpoint name and subject are DERIVED from the command
# pattern by `endpointName()` / `endpointSubject()` of `@jiku/nats-protocol` — nothing is written
# by hand, so adding command 21 to the registry registers it as an endpoint too. This is the table
# `nats micro info jiku-commands` shows:
#
#   #   command pattern                                    endpoint subject                      endpoint name
#   1   clients.new                                        clients.new                           clients-new
#   2   clients.{id}.edit                                  clients.*.edit                        clients-edit
#   3   projects.new                                       projects.new                          projects-new
#   4   projects.{id}.edit                                 projects.*.edit                       projects-edit
#   5   tasks.new                                          tasks.new                             tasks-new
#   6   tasks.{id}.edit                                    tasks.*.edit                          tasks-edit
#   7   tasks.{id}.comment                                 tasks.*.comment                       tasks-comment
#   8   requirements.new                                   requirements.new                      requirements-new
#   9   requirements.{id}.edit                             requirements.*.edit                   requirements-edit
#   10  requirements.{id}.resolve                          requirements.*.resolve                requirements-resolve
#   11  requirements.{id}.comment                          requirements.*.comment                requirements-comment
#   12  requirements.{id}.subscriptors.new                 requirements.*.subscriptors.new        requirements-subscriptors-new
#   13  requirements.{id}.subscriptors.{userId}.delete     requirements.*.subscriptors.*.delete   requirements-subscriptors-delete
#   14  attachments.{id}.delete                            attachments.*.delete                  attachments-delete
#   15  files.request-upload                               files.request-upload                  files-request-upload
#   16  files.{fileId}.request-download                    files.*.request-download              files-request-download
#   17  worked-times.new                                   worked-times.new                      worked-times-new
#   18  worked-times.{id}.delete                           worked-times.*.delete                 worked-times-delete
#   19  unworked-times.new                                 unworked-times.new                    unworked-times-new
#   20  unworked-times.{id}.delete                         unworked-times.*.delete               unworked-times-delete
#
# Two shape rules the derivation respects, and why:
#   - THE NAME CARRIES NO DOTS. Micro validates the endpoint name against /^[-\w]+$/; the subject,
#     with its dots and `*`, travels separately in `opts.subject`.
#   - `{param}` BECOMES `*`. A subject token cannot carry braces, and the dispatcher already
#     extracts the params from the full subject with the segment registry — it does not need them
#     from the endpoint.
#
# NO TWO ENDPOINTS MAY MATCH THE SAME SUBJECT: that would put two replies on one inbox. The 20
# above do not overlap, and the reason is structural rather than luck — the registry matches BY
# SEGMENT COUNT, and those sharing a length differ in their first or last literal token. But the
# design does not rest on that manual check: `registerService()` keeps a Set of subjects and FAILS
# THE STARTUP on a duplicate, naming the service and the subject.
#
# ON A `failure`, THE ENVELOPE TRAVELS IN THE BODY, and the `Nats-Service-Error` /
# `Nats-Service-Error-Code` headers are ADDED — never a replacement for the body. The `500` of
# `respondError` is the MICRO TRANSPORT status, not the HTTP one: the status the person sees is
# decided by the api's `httpStatusFor` over the `errorCode` OF THE BODY.
#
# THE user-id IDENTIFIES THE SERVICE, NOT THE PERSON. The api uses a single service user for
# everybody; the end user travels in the body.
#
# The reply inbox uses the HASHED user id: `_INBOX.<sha256 base32, 16 chars, lowercase>`. The
# client MUST set that prefix when connecting, or the replies never arrive.

channels:

  # -------------------------------------------------------------------------
  # clients
  # -------------------------------------------------------------------------

  clients.new:
    description: Actor creation.
    publish:
      operationId: clientsNew
      summary: Create an actor
      tags:
        - name: clients
      message:
        $ref: '#/components/messages/ClientsNew'

  clients.{id}.edit:
    description: Partial edit of an actor.
    parameters:
      id:
        description: Actor id (`clients.id`).
        schema:
          type: string
    publish:
      operationId: clientsEdit
      summary: Edit an actor
      tags:
        - name: clients
      message:
        $ref: '#/components/messages/ClientsEdit'

  # -------------------------------------------------------------------------
  # projects
  # -------------------------------------------------------------------------

  projects.new:
    description: Project creation.
    publish:
      operationId: projectsNew
      summary: Create a project
      tags:
        - name: projects
      message:
        $ref: '#/components/messages/ProjectsNew'

  projects.{id}.edit:
    description: |
      Partial edit of a project.

      **Difference from the previous api:** `PATCH /projects/:id` required almost every field and
      cleared `endDate` when it was absent. Here an absent field is left as it was, which is what
      the protocol defines.
    parameters:
      id:
        description: Project id (`projects.id`).
        schema:
          type: string
    publish:
      operationId: projectsEdit
      summary: Edit a project
      tags:
        - name: projects
      message:
        $ref: '#/components/messages/ProjectsEdit'

  # -------------------------------------------------------------------------
  # tasks  (the table is `objectives`; the protocol calls them tasks)
  # -------------------------------------------------------------------------

  tasks.new:
    description: |
      Task creation.

      Validates the project, the existence of ALL the responsible people and, if
      `requirementId` is present, that the requirement belongs to the same project. The first of
      `responsiblePersonIds` becomes the lead.
    publish:
      operationId: tasksNew
      summary: Create a task
      tags:
        - name: tasks
      message:
        $ref: '#/components/messages/TasksNew'

  tasks.{id}.edit:
    description: |
      Partial edit of a task, with an activity log.

      Six fields leave a trace in `objective_activities`: `title`, `estimatedFinishDate`,
      `state`, `area`, `priority`, `description`. The log is computed BEFORE writing, because it
      needs the previous value. Going to empty is not logged, except for `estimatedFinishDate`.

      Each activity's visibility is automatic: `state`, `title` and `description` are `public`;
      the rest, `internal`.

      `responsiblePersonIds` is a full replacement.
    parameters:
      id:
        description: Task id (`objectives.id`).
        schema:
          type: string
    publish:
      operationId: tasksEdit
      summary: Edit a task
      tags:
        - name: tasks
      message:
        $ref: '#/components/messages/TasksEdit'

  tasks.{id}.comment:
    description: |
      Comment on a task. Stored as an `ObjectiveActivity` of type `comment`.

      **Difference from the previous api:** it did not check that the task existed, so commenting
      on a nonexistent id failed on the foreign key with a 500. Here it is validated and the
      reply is `objective_not_found`.
    parameters:
      id:
        description: Task id (`objectives.id`).
        schema:
          type: string
    publish:
      operationId: tasksComment
      summary: Comment on a task
      tags:
        - name: tasks
      message:
        $ref: '#/components/messages/TasksComment'

  # -------------------------------------------------------------------------
  # requirements
  # -------------------------------------------------------------------------

  requirements.new:
    description: |
      Requirement creation.

      **Files are linked, not confirmed from a draft** (REQ-001, S-003). `fileIds` carries ids of
      `files` that already exist on their own; the command creates the requirement and then, in
      the same transaction, validates ownership and inserts one `attachments` row per file. The
      requirement and its links commit together or not at all.

      Validation is deliberately **late** (after creating the entity) and that is safe: the
      dispatcher's rollback discards everything, which is the pattern
      `requirements-new.ts:116-121` already uses.
    publish:
      operationId: requirementsNew
      summary: Create a requirement
      tags:
        - name: requirements
      message:
        $ref: '#/components/messages/RequirementsNew'

  requirements.{id}.edit:
    description: |
      Partial edit of a requirement, with an activity log.

      The activity log is computed by the model's `@BeforeUpdate` hook, which fills `activityLog`
      and —when the state changes— sets the transition timestamps (`scheduledAt`,
      `inProgressAt`, ...). The command persists what the hook left behind. **This is a different
      mechanism from `tasks.{id}.edit`**, which computes it in the command.

      `fileIds` is the COMPLETE set that must end up linked: the ones that were not there get a
      new `attachments` row, and the ones no longer present have their **link** deleted — the
      file itself is always retained (REQ-001 D-04, S-003).

      `responsiblePersonIds` is a full replacement.
    parameters:
      id:
        description: Requirement id (`requirements.id`).
        schema:
          type: string
    x-req-007-state-workflow: |
      **REQ-007 (S-033) — the state transition table.** C-15 never existed on the server: it lived
      only in `web`. It is declared here as DATA, the same shape as the role -> method map, and
      validated **where the transition happens**, which is this channel.

      ```
      analisis  ->  planificacion  ->  en_cola  ->  desarrollo  ->  revision
                           └──────── incidencia ────────┘
      ```

      | From | To (allowed) |
      |---|---|
      | `analisis` | `planificacion` |
      | `planificacion` | `en_cola`, **`desarrollo` only if `type === 'incidencia'`** |
      | `en_cola` | `desarrollo` |
      | `desarrollo` | `revision` |
      | `revision` | `resuelto` |
      | *any non-terminal state* | `cancelado` |
      | *any non-terminal state* | `resuelto` **through the resolution path** (requires type + conclusion, C-17) |
      | `resuelto`, `cancelado` | *(terminal)* |
      | *one step back in the sequence* | allowed |

      Anything else: `invalid_state_transition`. A transition into `resuelto` without resolution
      type or conclusion: `resolution_required`.

      **`type` is read from the ROW, not from the payload** — a caller declaring itself an
      `incidencia` to skip `en_cola` would otherwise be forging the exception.

      **Existing rows in a state the sequence does not explain are NOT migrated.** The rule is
      about transitions, not about stored state, and since `cancelado` is reachable from any
      non-terminal state, none of them is trapped.
    publish:
      operationId: requirementsEdit
      summary: Edit a requirement
      tags:
        - name: requirements
      message:
        $ref: '#/components/messages/RequirementsEdit'

  requirements.{id}.resolve:
    description: |
      Resolve a requirement: moves it to `resuelto` and stores the reason.

      Inherited rule: an `incidencia` is not resolved without a conclusion. If none comes in the
      payload, the one already stored on the requirement is accepted.

      > **NO HTTP ROUTE PUBLISHES IT — but the rule IS enforced (REQ-007, S-033).** It is
      > implemented and tested, and resolution still comes in through `requirements.{id}.edit`,
      > which accepts `resolutionType`, `resolutionConclusion` and `resolutionComment` for exactly
      > that reason.
      >
      > **What changed.** This note used to end with *"the mandatory-conclusion rule lives only
      > here, so today it is not enforced"*. **That is derogated.** Both channels now share the
      > SAME validator — the state transition table (C-15) and the mandatory type + conclusion
      > (C-17) — so the rule applies **whichever way the change arrives**. Validating only here
      > would have left it exactly as unenforced as before.
    parameters:
      id:
        description: Requirement id (`requirements.id`).
        schema:
          type: string
    publish:
      operationId: requirementsResolve
      summary: Resolve a requirement
      tags:
        - name: requirements
      message:
        $ref: '#/components/messages/RequirementsResolve'

  requirements.{id}.comment:
    description: |
      Comment on a requirement. Stored as a `RequirementActivity` of type `comment`.

      It does not notify: notifications were removed from the product.
    parameters:
      id:
        description: Requirement id (`requirements.id`).
        schema:
          type: string
    publish:
      operationId: requirementsComment
      summary: Comment on a requirement
      tags:
        - name: requirements
      message:
        $ref: '#/components/messages/RequirementsComment'

  requirements.{id}.subscriptors.new:
    description: |
      Subscribe a user to a requirement.

      Core checks that the user exists and is not subscribed already. **The permission over the
      project is validated by the api**, because it depends on the role.
    parameters:
      id:
        description: Requirement id (`requirements.id`).
        schema:
          type: string
    publish:
      operationId: requirementsSubscriptorsNew
      summary: Subscribe a user to a requirement
      tags:
        - name: requirements
      message:
        $ref: '#/components/messages/RequirementsSubscriptorsNew'

  requirements.{id}.subscriptors.{userId}.delete:
    description: |
      Unsubscribe a user from a requirement. No body: the user comes in the subject.

      **Core does not check whose subscription it is** — "core deletes what it is told to".
      That somebody can only unsubscribe themselves is validated by the api.
    parameters:
      id:
        description: Requirement id (`requirements.id`).
        schema:
          type: string
      userId:
        description: |
          User id in the identity provider (`users.id`, string). It may contain characters that
          are not digits, and that is why subject matching is done by segments and not by regex.
        schema:
          type: string
    publish:
      operationId: requirementsSubscriptorsDelete
      summary: Unsubscribe a user from a requirement
      tags:
        - name: requirements
      message:
        $ref: '#/components/messages/EmptyBody'

  # -------------------------------------------------------------------------
  # times
  # -------------------------------------------------------------------------

  # -------------------------------------------------------------------------
  # files  (REQ-001 — S-002)
  #
  # The sixth module of core, and the first one that talks to an external system.
  # `core` becomes the SINGLE OWNER of the storage: the api keeps no S3 credentials.
  # -------------------------------------------------------------------------

  files.request-upload:
    description: |
      Upload permission. Validates the upload policy, builds the S3 key, creates the `files` row
      with the byte **unverified**, and signs a `PutObject` presigned URL.

      **The byte never travels over the bus** (`max_payload` is 1 MB and attachments reach 10 MB,
      ADR-002) **nor through the api**: the client PUTs it straight to S3 with the returned URL.

      **The uploader does not choose where the file is stored** (D-08): core builds the key as
      `{STORAGE_S3_KEY_PREFIX}/f/{uuid}{ext}`, with no `entityType` and no `entityId`.

      **The double allowlist is validated here, not in the api**: extension AND MIME type, both
      read live from `system_settings`. A new type has to be added to **both** lists (RF-17).

      **The byte is NOT verified.** No `headObject`, because a network call inside the
      dispatcher's transaction would risk the 5 s timeout of ADR-002. The failure surfaces on
      download, never as a corrupted row.

      > **Revised 2026-08-20.** It no longer surfaces as `file_not_available`: see
      > `files.{fileId}.request-download`, which stopped checking `byte_status`. A byte that
      > never arrived now reaches the browser as an opaque `NoSuchKey` from S3.
    publish:
      operationId: filesRequestUpload
      summary: Request permission to upload a file
      tags:
        - name: files
      message:
        $ref: '#/components/messages/FilesRequestUpload'

  files.{fileId}.request-download:
    description: |
      Read permission. Validates that the file exists and is alive, and signs a `GetObject`
      presigned URL over its `storage_key`.

      > **`byte_status` is NOT checked (revised 2026-08-20).** The original design answered
      > `file_not_available` for a `pending` byte (CA-15, RF-21, D-15). That was unachievable
      > together with RF-1 / CA-7: `pending` meant two things at once — "the byte never arrived"
      > and "not linked yet" — because `uploaded` is written by the LINKING commands, when the
      > entity is saved. Blocking it made every just-uploaded file unpreviewable **by
      > construction**, which is exactly the case this command exists to serve.
      >
      > **What is given up:** a file whose PUT failed silently no longer answers a readable 404.
      > The URL is signed, the browser follows the redirect and S3 answers an opaque `NoSuchKey`.
      >
      > To recover the 404 later, the way is NOT to restore the check — it would break the
      > preview again — but to separate the two meanings of `pending`: confirm the PUT on upload,
      > or sign anyway when the resolved actor is the file's `uploaded_by`.

      **`fileId` is the id of `files`** — the file, not the link. The parameter name is explicit
      on purpose so it is not confused with the `attachments` id that travels in the HTTP
      contract. The api holds the `file_id` already, because it read the `attachments` row to
      authorize.

      **It carries no `requester`: ownership does NOT apply to reading.** A file is read through
      the permission over the linked entity, not through who uploaded it. RF-12 is about
      *linking*, not *reading* — a requirement can hold attachments from several people and the
      whole project team has to be able to see them.

      **What core does NOT validate here is the permission over the entity.** That stays with the
      api (`canUserViewEntity` / `canUserAccessEntity`), because core knows nothing about roles or
      end users. The api authorizes first and only then publishes.

      > **Consequence to keep on the record (ADR-007 revision).** The command takes a `fileId`, so
      > anyone able to publish on the bus can ask for the URL of **any file in the catalog**,
      > bypassing the api's authorization. It is the same trust model ADR-007 already declares for
      > every write — the auth-callout is the only defence — but it now covers **reading**, and the
      > surface is the whole file catalog rather than the set of authorizable links. An optional
      > `attachmentId` for core to validate was evaluated and **discarded**, to keep this command
      > symmetric with `request-upload`; it stays available as an additive defence-in-depth.
    parameters:
      fileId:
        description: File id (`files.id`) — **not** the link id (`attachments.id`).
        schema:
          type: string
    publish:
      operationId: filesRequestDownload
      summary: Request permission to download a file
      tags:
        - name: files
      message:
        $ref: '#/components/messages/FilesRequestDownload'

  # -------------------------------------------------------------------------
  # attachments  (REQ-001 — S-004)
  # -------------------------------------------------------------------------

  attachments.{id}.delete:
    description: |
      Unlinks a file from an entity. **Deletes only the `attachments` row: the file is retained**
      (D-04), and so is the object in the bucket.

      With 0..N links per file, deleting the object would break the other links. Unlinking **is**
      deleting the `Attachment`.

      **Why it is a command and not a direct write.** It was the third implicit write of the api
      (row + object). If the link becomes a domain row, deleting it MUST go through core, or it
      would reopen through another door the ADR-001 exception this redesign closes.

      **The parameter is the id of `attachments`** — the link — which is the opposite of
      `files.{fileId}.request-download`. The name says so on purpose: `attachments.{id}.delete`
      is more honest than `files.{id}.unlink`.
    parameters:
      id:
        description: Link id (`attachments.id`).
        schema:
          type: string
    publish:
      operationId: attachmentsDelete
      summary: Unlink a file from an entity
      tags:
        - name: attachments
      message:
        $ref: '#/components/messages/AttachmentsDelete'

  worked-times.new:
    description: |
      Log worked time.

      Cap of 1440 minutes (24 h) per person per day, counting worked time only.

      `taskId` and `requirementId` are mutually exclusive (`oxor`). If `requirementId` is
      present, it has to belong to the given project. **REQ-007: this is now the ONLY definition
      of that exclusion** — the api's Joi `.oxor` was removed, so the two cannot diverge.

      > **REQ-007 — the submission window and who may log for someone else now live HERE.**
      > The previous wording said the window (the current day and the 10 before it) *"is validated
      > by the api, not core: it depends on the calendar and not on the data"*. **That is
      > derogated.** With the identity envelope core knows the end user, so:
      >
      > - **C-40, submission window** — `date` must fall between today and the 10 days before it.
      >   Outside it: `invalid_date_range`. **Both edges are part of the rule**: a future date is
      >   rejected too.
      > - **C-41, logging for someone else** — if the resolved `personId` is not the actor's own
      >   and the actor is not `admin`: `access_denied`.
      > - **`personId` default** — see the schema: when absent it is resolved from the actor.
    publish:
      operationId: workedTimesNew
      summary: Log worked time
      tags:
        - name: times
      message:
        $ref: '#/components/messages/WorkedTimesNew'

  worked-times.{id}.delete:
    description: |
      Delete a worked time entry. No body.

      > **REQ-007 — derogated.** This channel used to say *"core deletes what it is told to: that
      > the entry is the caller's own and that the date is within the allowed window is validated
      > by the api"*. **Both rules are enforced here now:**
      >
      > - **Ownership** — the entry has to belong to the actor's Person, unless the actor is
      >   `admin`. Otherwise: `access_denied`.
      > - **Submission window** — the entry's date has to be inside the window, same as on
      >   creation. Otherwise: `invalid_date_range`.
    parameters:
      id:
        description: Entry id (`worked_times.id`).
        schema:
          type: string
    publish:
      operationId: workedTimesDelete
      summary: Delete worked time
      tags:
        - name: times
      message:
        $ref: '#/components/messages/EmptyBody'

  unworked-times.new:
    description: |
      Record unworked time.

      Cap of 1440 minutes (24 h) per person per day, **adding up worked AND unworked time** —
      unlike `worked-times.new`, which only counts worked time.
    publish:
      operationId: unworkedTimesNew
      summary: Record unworked time
      tags:
        - name: times
      message:
        $ref: '#/components/messages/UnworkedTimesNew'

  unworked-times.{id}.delete:
    description: |
      Delete an unworked time record. No body.

      > **REQ-007 — derogated.** It used to say *"the permission is validated by the api"*.
      > Ownership by actor is enforced here: the record has to belong to the actor's Person unless
      > the actor is `admin`, otherwise `access_denied`. The shared 1440-minute daily cap was
      > already in core and does **not** move.
    parameters:
      id:
        description: Record id (`unworked_times.id`).
        schema:
          type: string
    publish:
      operationId: unworkedTimesDelete
      summary: Delete unworked time
      tags:
        - name: times
      message:
        $ref: '#/components/messages/EmptyBody'

  # -------------------------------------------------------------------------
  # week-assigned-times  (REQ-007 — S-032)
  # -------------------------------------------------------------------------

  week-assigned-times.replace:
    description: |
      **The 21st command.** Replaces a FULL WEEK of the project x person assignment grid.

      **Why it exists.** `PUT /api/week-assigned-times` was **the only domain write that did not
      go through core**: the api ran it with the ORM (`destroy` + `bulkCreate` in a transaction of
      its own) and `docs/flows/asignacion-semanal.md` documented it apart for that reason —
      *"core: **does not take part**"*. REQ-007 needs C-36 and C-38 enforced by the writer, and
      there was nowhere to put them. **This channel is that place.**

      **The HTTP contract does not change.** Same verb, same body, same statuses. What changes is
      who validates and who writes — and, with it, the credential: the grid is now written by
      core's owner user instead of the api's role.

      **Replace, not upsert.** Delete + recreate is the semantics the entity already has: it is
      the only entity that is *replaced by whole week*. The delete and the recreate happen
      **inside the dispatcher's transaction** (ADR-003), so a half-replaced week cannot survive.

      **Rules it enforces:**

      - **`admin` only (C-38)** — resolved by the **role -> method map**, NOT inside the command,
        because it does not depend on the payload. A `user` gets `caller_not_authorized`.
      - **No past weeks (C-36)** — `invalid_date_range`. This is `validateWeekNotPast`, which
        stops being an api rule.
      - **`dateFrom` must be a Monday** — `invalid_fields`. The week is identified by its Monday;
        accepting any day would let two weeks overlap.
      - **`internal` is DERIVED** from `projects.type === 'interno'`, never taken from the
        payload, exactly as the api did.
      - **Assignments with `minutes: 0` are discarded** — an empty grid cell is not a row.
    publish:
      operationId: weekAssignedTimesReplace
      summary: Replace a full week of assignments
      tags:
        - name: times
      message:
        $ref: '#/components/messages/WeekAssignedTimesReplace'

