  /opus/attachments/{id}/public:
    get:
      tags: [opus]
      summary: Sirve un adjunto público (SIN autenticación)
      description: |
        **El único endpoint exento de autenticación de toda la api**, declarado en
        `api/config/public.ts:20`.

        Está exento porque tiene su propio control de acceso: valida
        `visibilityLevel === 'public'` por cada `entityType` y responde **403** en cualquier otro
        caso. Manda `X-Content-Type-Options: nosniff` y una CSP de sandbox. Para archivos grandes
        redirige a una URL pre-firmada del storage.

        **Los ids son secuenciales, así que el endpoint es enumerable.** Es un riesgo aceptado y
        registrado: la protección es la validación de visibilidad, no la opacidad del id.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: El archivo
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '302':
          description: Redirección a una URL pre-firmada del storage (archivos grandes)
        '403':
          description: El adjunto no es público
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

