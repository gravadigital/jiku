  # ==========================================================================
  # worked-times
  # ==========================================================================

  /worked-times:
    get:
      tags: [worked-times]
      summary: Horas trabajadas de una persona en un día
      x-roles: [user, admin]
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: personId
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkedTimeWithRelations' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [worked-times]
      summary: Carga horas trabajadas
      description: |
        Publica `worked-times.new` (`objectiveId` viaja como `taskId`).

        **Tres reglas que viven en la api**, porque core no conoce roles ni calendario:
          - la fecha tiene que estar entre hoy y los 10 días previos (`invalid_date_range`)
          - solo un `admin` puede imputar horas a otra persona (`access_denied`)
          - si no viene `personId`, se resuelve desde el usuario autenticado (`person_not_found`
            si no tiene persona vinculada)

        `objectiveId` y `requirementId` son mutuamente excluyentes.

        Core puede rechazar con `daily_limit_exceeded`, que sale 400 y **agrega
        `remainingMinutes`** al cuerpo — recuperado parseando el mensaje, porque el formato de
        respuesta del bus no tiene dónde ponerlo.
      x-roles: [user, admin]
      x-bus-command: worked-times.new
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, minutes, projectId]
              properties:
                date: { type: string, format: date }
                minutes: { type: integer, minimum: 1 }
                projectId: { type: integer }
                objectiveId: { type: integer, nullable: true }
                requirementId: { type: integer, nullable: true }
                personId:
                  type: integer
                  description: Default, la persona del usuario autenticado. Solo `admin` puede indicar otra
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkedTimeWithRelations' }
        '400':
          description: Validación, ventana de fechas, o un rechazo de core
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalidDateRange:
                  value:
                    code: invalid_date_range
                    message: Solo se pueden cargar horas del día actual y los 10 días previos
                dailyLimitExceeded:
                  value:
                    code: daily_limit_exceeded
                    message: 'Minutos disponibles: 120'
                    remainingMinutes: 120
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Sin rol, o intento de cargar horas de otra persona sin ser `admin`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: access_denied, message: Solo podés cargar tus propias horas }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }

  /worked-times/{id}:
    delete:
      tags: [worked-times]
      summary: Borra un registro de horas
      description: |
        Publica `worked-times.{id}.delete`. Valida la ventana de fechas y que el registro sea del
        usuario, salvo `admin`.
      x-roles: [user, admin]
      x-bus-command: worked-times.{id}.delete
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acknowledgement' }
        '400':
          description: Fuera de la ventana de fechas, o el registro no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }

  /worked-times/person-objectives:
