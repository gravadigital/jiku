  # ==========================================================================
  # worked-times
  # ==========================================================================

  /worked-times:
    get:
      tags: [worked-times]
      summary: Horas trabajadas de una persona en un día
      x-roles: [user, admin]
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: personId
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkedTimeWithRelations' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [worked-times]
      summary: Carga horas trabajadas
      description: |
        Publica `worked-times.new` (`objectiveId` viaja como `taskId`).

        > **REQ-007 (S-031) — `- ELIMINADO`: las cuatro reglas se mudaron a `core`.**
        >
        > Acá decía: *"**Tres reglas que viven en la api**, porque core no conoce roles ni
        > calendario: la fecha tiene que estar entre hoy y los 10 días previos
        > (`invalid_date_range`); solo un `admin` puede imputar horas a otra persona
        > (`access_denied`); si no viene `personId`, se resuelve desde el usuario autenticado
        > (`person_not_found` si no tiene persona vinculada)"*. **Core sí conoce roles y usuario
        > final desde el sobre de S-029**, así que las tres se fueron, y con ellas el `.oxor`.
        >
        > - **`- ELIMINADO`** el middleware `validateDateRange`: la ventana de carga (C-40) la
        >   aplica `core` y devuelve `invalid_date_range` → 400, **con el mismo mensaje**
        > - **`- ELIMINADO`** el middleware `validatePersonPermission`: imputar a terceros (C-41)
        >   lo decide `core` y devuelve `access_denied` → 403, **con el mismo mensaje**
        > - **`- ELIMINADO`** el middleware `resolvePersonId`: el default de `personId` sale del
        >   **actor** en `core` (`SELECT id FROM people WHERE user_id = {actor}`); sin Persona
        >   vinculada, `person_not_found` → 400
        > - **`- ELIMINADO`** el `.oxor('objectiveId','requirementId')` de Joi: la exclusión (C-42)
        >   queda con **una sola definición**, la de `core`, que responde `invalid_fields` → 400.
        >   El comando **sí se publica** y es `core` quien rechaza
        >
        > **`+ NUEVO` en el orden, no en el contrato:** cuando fallan dos reglas a la vez el
        > código que se ve puede cambiar, porque todo lo mudado se evalúa **después** de lo que
        > queda en la api y `core` evalúa permiso antes que referencias. Fecha fuera de ventana
        > **y** proyecto inexistente sale ahora `project_not_found`; fecha fuera de ventana **y**
        > `personId` ajeno sale `access_denied`.
        >
        > **`+ CONSERVADO`:** la traducción `objectiveId` → `taskId` (es contrato, no regla),
        > `hasAnyRole(['user','admin'])`, la validación de la **forma** del input y la relectura
        > con relaciones (ADR-001). **El contrato HTTP no cambia:** mismo verbo, mismo cuerpo,
        > mismos status, mismos códigos.

        `objectiveId` y `requirementId` son mutuamente excluyentes — **lo valida `core`**.

        Core puede rechazar con `daily_limit_exceeded`, que sale 400 y **agrega
        `remainingMinutes`** al cuerpo — recuperado parseando el mensaje, porque el formato de
        respuesta del bus no tiene dónde ponerlo. (`core` ya emite además
        `errorDetails.remainingMinutes`; migrar el consumo es de FG-4.)
      x-roles: [user, admin]
      x-bus-command: worked-times.new
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, minutes, projectId]
              properties:
                date: { type: string, format: date }
                minutes: { type: integer, minimum: 1 }
                projectId: { type: integer }
                objectiveId: { type: integer, nullable: true }
                requirementId: { type: integer, nullable: true }
                personId:
                  type: integer
                  description: |
                    Opcional. Si no viene, **`core`** lo resuelve desde el actor del sobre. Si
                    viene y difiere de la Persona del actor, solo un `admin` puede — **lo verifica
                    `core`** (C-41), no la api. Cuando el cuerpo no lo trae, la api **no manda la
                    clave** en el comando.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkedTimeWithRelations' }
        '400':
          description: |
            Forma del input (la valida la api), o un rechazo de `core`: ventana de fechas
            (`invalid_date_range`), exclusión tarea/requisito (`invalid_fields`), actor sin Persona
            (`person_not_found`), tope diario o referencias inexistentes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalidDateRange:
                  value:
                    code: invalid_date_range
                    message: Solo se pueden cargar horas del día actual y los 10 días previos
                dailyLimitExceeded:
                  value:
                    code: daily_limit_exceeded
                    message: 'Minutos disponibles: 120'
                    remainingMinutes: 120
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            Sin rol (lo corta `hasAnyRole` **en la api**, sin publicar), o intento de cargar horas
            de otra persona sin ser `admin` (lo rechaza **`core`** con C-41 y llega por reply)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: access_denied, message: Solo podés cargar tus propias horas }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /worked-times/{id}:
    delete:
      tags: [worked-times]
      summary: Borra un registro de horas
      description: |
        Publica `worked-times.{id}.delete`.

        > **REQ-007 (S-031) — `- ELIMINADO`: la titularidad y la ventana se mudaron a `core`.**
        >
        > Acá decía: *"Valida la ventana de fechas y que el registro sea del usuario, salvo
        > `admin`"*. Ya no: hasta esta story `core` **"borraba lo que le decían"**, y ahora las dos
        > reglas viven en el único servicio que escribe.
        >
        > - **`- ELIMINADO`** `validateDeleteDateRange` → `core` responde `invalid_date_range`
        >   (**400**), con el mismo mensaje
        > - **`- ELIMINADO`** `validateDeletePermission` → `core` responde `access_denied`
        >   (**403**), con el mismo mensaje
        > - **`+ CONSERVADO`** `loadWorkedTime`, **y no es un descuido**: es el **404** que este
        >   contrato promete. `core`, para el mismo caso, responde `worked_time_not_found`, que la
        >   api mapea a **400**. Sin ese middleware el 404 se convertiría en 400
        >
        > **`+ NUEVO` en el orden:** un registro **ajeno y fuera de ventana** sale ahora
        > `access_denied` (403) donde antes salía `invalid_date_range` (400). `core` evalúa la
        > titularidad primero porque es la que menos revela.
      x-roles: [user, admin]
      x-bus-command: worked-times.{id}.delete
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acknowledgement' }
        '400':
          description: |
            Fuera de la ventana de fechas — **llega del reply de `core`** (`invalid_date_range`),
            no lo emite la api
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            Sin rol (lo corta la api), o el registro es de otra Persona — esto último **llega del
            reply de `core`** (`access_denied`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: access_denied, message: Solo podés eliminar tus propios registros }
        '404':
          description: |
            El registro no existe. **Lo sigue dando la api** (`loadWorkedTime`): `core` responde
            `worked_time_not_found`, que el mapa del servicio traduce a **400**
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: worked_time_not_found, message: Registro no encontrado }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

