  /auth/present:
    post:
      tags: [other]
      summary: Presenta al usuario (PROVISORIO — no-op)
      description: |
        **Hoy no hace nada: responde `200 {}` sin tocar la base.**

        Creaba o actualizaba el usuario en `users` con los datos de Zitadel en el primer login.
        Es la única escritura que quedó sin comando en el protocolo, y con la api conectando con
        un usuario de solo lectura ya no puede hacerla.

        La web ya trata el error como no fatal ("Failed to present in API, but continuing"), así
        que el 200 preserva su comportamiento.

        **Consecuencia:** un usuario nuevo de Zitadel **no queda dado de alta**, y si no está en
        `users` el resto de las rutas responden 401 `user_not_found`. Hoy la única vía es
        insertarlo directamente.

        Es también el único endpoint donde `validateToken` **no** exige que el usuario exista en
        `users` (`lib/utils/middlewares/validate-token.ts:115`).

        Pendiente: definir si el alta pasa a ser un comando de core, si la resuelve el
        auth-callout, o si esta ruta conserva escritura propia.
      responses:
        '200':
          description: OK. Cuerpo vacío
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }

# ============================================================================
# components
# ============================================================================

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT RS256 emitido por Zitadel, verificado contra su JWKS
        (`{IDENTITY_URL}/oauth/v2/keys`), resincronizado con reintentos cuando aparece un `kid`
        desconocido.

        **Solo por header.** El fallback por query param (`?jwt=`) se eliminó: los query params
        quedan en logs de acceso, historial y `Referer`.

        Los roles salen del claim `urn:zitadel:iam:org:project:roles`, como las claves del objeto.
        Roles del producto: `admin`, `user`, `external-user`.

        El `sub` tiene que existir en la tabla `users` o la respuesta es 401 `user_not_found`.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
    ProjIdPath:
      name: projid
      in: path
      required: true
      schema: { type: integer }
    ReqIdPath:
      name: reqid
      in: path
      required: true
      schema: { type: integer }
    Sort:
      name: sort
      in: query
      description: |
        Campo de ordenamiento. Prefijo `-` para descendente. Default `-createdAt`.
      schema: { type: string }
      example: '-createdAt'
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: |
        El esquema Joi lo acota a **30**, pero `parseLimit` usa **200** como fallback cuando el
        valor no cumple sus condiciones (`lib/utils/parse-query-params.ts:41-43`). En la práctica
        un valor mayor a 30 se rechaza antes con 400.
      schema: { type: integer, minimum: 1, maximum: 30, default: 200 }
    DateFromRequired:
      name: dateFrom
      in: query
      required: true
      schema: { type: string, format: date }
    DateToRequired:
      name: dateTo
      in: query
      required: true
      description: Tiene que ser mayor o igual a `dateFrom`
      schema: { type: string, format: date }

  responses:
    Unauthorized:
      description: Sin token, token inválido, o el `sub` no está en `users`
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            unauthorized:
              value: { code: unauthorized, message: Unauthorized }
            userNotFound:
              value: { code: user_not_found, message: User not found }
    AccessDenied:
      description: Autenticado, pero el rol o el permiso de proyecto no alcanzan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: access_denied, message: Access denied }
    InvalidFields:
      description: Validación de Joi fallida. Devuelve **solo el primer** error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: invalid_fields, message: 'Invalid field - "title" is required' }
    NotFound:
      description: No existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: not_found, message: Not found }
    ProjectNotFound:
      description: El proyecto no existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: project_not_found, message: Project not found }
    RequirementNotFound:
      description: El requisito no existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: requirement_not_found, message: Requirement not found }
    InternalError:
      description: Error inesperado. El detalle va al log, no a la respuesta
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: internal_error, message: Internal error }
    BusUnavailable:
      description: |
        El bus no respondió dentro de `NATS_REQUEST_TIMEOUT_MS` (default 5000 ms), o no está
        disponible. **Sin JetStream no hay reintento: la operación no ocurrió.**
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: service_unavailable
            message: El servicio no está disponible en este momento

  schemas:

    # ---- errores y acuses ----

    Error:
      type: object
      description: |
        La forma de error de toda la api. `message` es **texto de interfaz**: los frontends lo
        muestran tal cual al usuario. Están mezclados entre inglés y español.
      required: [code, message]
      properties:
        code:
          type: string
          description: Código estable. Los frontends hacen `switch` sobre él
        message: { type: string }
        remainingMinutes:
          type: integer
          description: |
            Solo en `daily_limit_exceeded`. Se recupera parseando el mensaje con un regex, porque
            el formato de respuesta del bus no tiene dónde poner datos extra de un error. Es una
            solución de transición

    Acknowledgement:
      type: object
      description: Acuse de una edición que no devuelve el recurso
      properties:
        code: { type: string }
        message: { type: string }

    # ---- enums ----

    VisibilityLevel:
      type: string
      enum: [public, internal]
      description: |
        Visibilidad de una actividad. Los cambios de estado, título y descripción son `public`;
        el resto `internal`. Solo los comentarios permiten elegir
        (`lib/utils/visibility-helper.ts`)

    ObjectiveState:
      type: string
      enum: [backlog, activo, finalizado, cancelado, en_revision]

    ObjectiveArea:
      type: string
      enum: [diseño, desarrollo, gestion, investigacion]

    ProjectType:
      type: string
      enum: [interno, comercial, investigacion, propuesta]

    ProjectStatus:
      type: string
      enum: [analisis, activo, inactivo, finalizado, cancelado]

    RequirementState:
      type: string
      description: |
        Los valores salen del enum del modelo compartido
        (`packages/models/src/requirement.model.ts`). `en_cola` se agregó en la migración
        `20260707_01`. Default en la base: `analisis`
      enum: [analisis, planificacion, en_cola, desarrollo, revision, resuelto, cancelado]

    RequirementType:
      type: string
      enum: [funcionalidad, mejora, incidencia, otro]

    RequirementPriority:
      type: string
      enum: [sin_prioridad, baja, media, alta, urgente]

    RequirementResolution:
      type: string
      description: |
        Tipo de resolución. Obligatorio, junto con la conclusión, para pasar una incidencia a
        `resuelto`
      enum: [error_interno, fuera_de_alcance, error_externo, discutible, otro]

    UnworkedReason:
      type: string
      enum:
        - tramite
        - corte_servicios
        - vacaciones
        - dia_no_laborable
        - personal
        - medico
        - estudio
        - enfermedad
        - otro

    AttachmentEntityType:
      type: string
      description: |
        Tipo de entidad a la que se ancla un adjunto. `comment` es **legado** (filas no migradas,
        pendiente S-096) y `stage` quedó huérfano: la tabla ya no existe, así que sus adjuntos
        históricos **nunca se autorizan**
      enum:
        - project
        - requirement
        - objective
        - requirement_comment
        - objective_comment
        - comment
        - comment_draft
        - requirement_draft
        - objective_draft
        - stage

    Tag:
      type: object
      description: Par clave/valor. Se guardan como `jsonb` en `requirements.tags`
      properties:
        key: { type: string }
        value: { type: string }

    # ---- entidades ----

    Client:
      type: object
      description: Actor. "Actor" en la UI, `clients` en la base
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProjectInput:
      type: object
      description: |
        Cuerpo de alta y edición de proyecto. El esquema Joi exige `name`, `code`, `status`,
        `type`, `description` e `initDate` **también en el PATCH**
      required: [name, code, status, type, description, initDate]
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string }
        clientId: { type: integer }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        type: { $ref: '#/components/schemas/ProjectType' }
        description: { type: string }
        initDate: { type: string, format: date }
        endDate:
          type: string
          format: date
          description: |
            Si no viene en el PATCH, la api manda `endDate: null` explícito al bus, preservando
            el comportamiento heredado de vaciar el campo
        keyValuePairs:
          type: object
          description: |
            Enlaces del proyecto. Se traduce a `properties` (lista de `{code, value}`) para el
            bus. Las tres primeras se validan como URI
          properties:
            documentacion: { type: string, format: uri, nullable: true }
            diseño: { type: string, format: uri, nullable: true }
            board_de_tareas: { type: string, format: uri, nullable: true }
            mattermost_group_name: { type: string, nullable: true }

    Project:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/ProjectType' }
        description: { type: string }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        initDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time, nullable: true }
        priority: { type: integer, nullable: true }
        originId: { type: integer, nullable: true }
        keyValuePairs:
          type: object
          additionalProperties: { type: string, nullable: true }
          description: Los `null` se devuelven como string vacío en los listados
        ticketSlug: { type: string, nullable: true }
        clientId: { type: integer, nullable: true }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProjectSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }

    User:
      type: object
      description: Usuario. El `id` es el `sub` de Zitadel, no un entero
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        username: { type: string }

    Person:
      type: object
      description: |
        Persona del equipo. Distinta de `User`: una persona puede no tener usuario, y es a la
        persona a la que se imputan horas
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        enabled: { type: boolean }
        mustChargeWorkedTime: { type: boolean }
        userId: { type: string, nullable: true }

    PersonSummary:
      type: object
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }

    Objective:
      type: object
      description: Tarea. `objective` en HTTP y en la base, `task` en el bus
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        estimatedFinishDate: { type: string, nullable: true }
        finishedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Lo setea y lo limpia un hook `@BeforeUpdate` del modelo según la transición de estado
        state: { $ref: '#/components/schemas/ObjectiveState' }
        area: { $ref: '#/components/schemas/ObjectiveArea' }
        priority: { type: integer, description: 0-5 }
        visibilityLevel: { $ref: '#/components/schemas/VisibilityLevel' }
        projectId: { type: integer }
        requirementId: { type: integer, nullable: true }
        createdBy: { type: string }
        externalProjectId: { type: integer, nullable: true }
        externalIssueId: { type: string, nullable: true }
        externalIssueKey: { type: string, nullable: true }
        externalUrl: { type: string, nullable: true }
        lastSyncedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ObjectiveSummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        state: { $ref: '#/components/schemas/ObjectiveState' }
        projectId: { type: integer }
        requirementId: { type: integer, nullable: true }

    ObjectiveWithWorkedTime:
      allOf:
        - $ref: '#/components/schemas/Objective'
        - type: object
          properties:
            project: { $ref: '#/components/schemas/Project' }
            persons:
              type: array
              items: { $ref: '#/components/schemas/Person' }
            workedMinutes:
              type: integer
              description: Suma de todos los minutos imputados
            workedTime:
              type: array
              description: Agrupado por persona
              items: { $ref: '#/components/schemas/WorkedTimeSummary' }
            workedTimeDetailed:
              type: array
              description: Cada registro sin agrupar
              items: { $ref: '#/components/schemas/WorkedTimeSummary' }

    ObjectiveActivity:
      type: object
      description: 'Actividad de una tarea: cambio de campo o comentario'
      properties:
        id: { type: integer }
        objectiveId: { type: integer }
        typeOfActivity: { type: string }
        visibilityLevel: { $ref: '#/components/schemas/VisibilityLevel' }
        createdAt: { type: string, format: date-time }

    Requirement:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        type:
          allOf: [{ $ref: '#/components/schemas/RequirementType' }]
          nullable: true
        priority: { $ref: '#/components/schemas/RequirementPriority' }
        state: { $ref: '#/components/schemas/RequirementState' }
        visibilityLevel: { $ref: '#/components/schemas/VisibilityLevel' }
        estimatedFinishDate: { type: string, format: date, nullable: true }
        projectId: { type: integer }
        createdBy: { type: string }
        resolutionType:
          allOf: [{ $ref: '#/components/schemas/RequirementResolution' }]
          nullable: true
        resolutionConclusion: { type: string, nullable: true }
        resolutionComment: { type: string, nullable: true }
        scope: { type: string, nullable: true }
        technicalSolution: { type: string, nullable: true }
        acceptanceCriteria: { type: string, nullable: true }
        tags:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Tag' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RequirementSummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        state: { $ref: '#/components/schemas/RequirementState' }
        projectId: { type: integer }

    RequirementWithRelations:
      allOf:
        - $ref: '#/components/schemas/Requirement'
        - type: object
          properties:
            project: { $ref: '#/components/schemas/ProjectSummary' }
            creator: { $ref: '#/components/schemas/User' }
            responsiblePeople:
              type: array
              description: |
                Aplanado por el handler: `isLeader` sale de la tabla intermedia
                `people_requirements` y queda al mismo nivel que los campos de la persona
              items:
                type: object
                properties:
                  id: { type: integer }
                  firstName: { type: string }
                  lastName: { type: string }
                  isLeader: { type: boolean, nullable: true }

    RequirementActivity:
      type: object
      properties:
        id: { type: integer }
        requirementId: { type: integer }
        typeOfActivity: { type: string }
        visibilityLevel: { $ref: '#/components/schemas/VisibilityLevel' }
        createdAt: { type: string, format: date-time }

    WorkedTimeSummary:
      type: object
      properties:
        id: { type: integer }
        minutes: { type: integer }
        person: { $ref: '#/components/schemas/PersonSummary' }
        personId: { type: integer }
        date: { type: string, format: date }
        createdAt: { type: string, format: date-time }

    WorkedTimeWithRelations:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        minutes: { type: integer }
        projectId: { type: integer }
        project:
          allOf: [{ $ref: '#/components/schemas/ProjectSummary' }]
          nullable: true
        objectiveId: { type: integer, nullable: true }
        objective:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            title: { type: string }
        requirementId: { type: integer, nullable: true }
        requirement:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            title: { type: string }
        personId: { type: integer }
        createdAt: { type: string, format: date-time }

    UnworkedTime:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        minutes: { type: integer }
        reason: { $ref: '#/components/schemas/UnworkedReason' }
        personId: { type: integer }
        createdAt: { type: string, format: date-time }

    WeekAssignedTime:
      type: object
      properties:
        id: { type: integer }
        personId: { type: integer }
        projectId: { type: integer }
        minutes: { type: integer }
        internal:
          type: boolean
          description: Derivado del tipo de proyecto (`interno`), no enviado por el cliente
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date, description: Lunes + 4 días }

    Attachment:
      type: object
      properties:
        id: { type: integer }
        entityType: { $ref: '#/components/schemas/AttachmentEntityType' }
        entityId:
          type: integer
          nullable: true
          description: Nulo en un draft anclado al usuario, donde la titularidad va por `uploadedBy`
        fileName: { type: string, description: El nombre original. No es la clave en el storage }
        fileSize: { type: integer, description: Máximo 10 MB }
        mimeType: { type: string }
        storageKey:
          type: string
          description: |
            `{STORAGE_S3_KEY_PREFIX}/{entityType}/{entityId ?? draft}/{uuid}{ext}`. Cambiar el
            prefijo en una instalación con datos deja inaccesibles los adjuntos existentes
        storageBucket: { type: string }
        storageRegion: { type: string }
        uploadedBy: { type: string }
        description: { type: string, nullable: true }
        checksum: { type: string, description: sha256 en hexadecimal }
        createdAt: { type: string, format: date-time }
