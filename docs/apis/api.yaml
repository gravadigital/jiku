  # ==========================================================================

  /opus/projects:
    get:
      tags: [opus]
      summary: Proyectos visibles en el portal
      description: |
        Solo proyectos con `status: activo`. Un `external-user` ve **únicamente** los concedidos
        en `user_project_permissions`: la restricción se aplica acotando la query, no con un 403.
      x-roles: [user, external-user]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    name: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }

  /opus/projects/{projid}/requirements:
    get:
      tags: [opus]
      summary: Requisitos de un proyecto en el portal
      description: |
        **Nota sobre el código:** los filtros se validan con `validateBodyFields`, no con
        `validateQueryParams` (`opus-projects-projid-requirements-get.ts:63`), así que el esquema
        se aplica al cuerpo de una request GET. Los parámetros que el handler realmente lee son
        los de query.
      x-roles: [user, external-user]
      parameters:
        - $ref: '#/components/parameters/ProjIdPath'
        - name: state
          in: query
          description: Uno o varios estados
          schema:
            oneOf:
              - { $ref: '#/components/schemas/RequirementState' }
              - type: array
                items: { $ref: '#/components/schemas/RequirementState' }
        - name: sort
          in: query
          schema: { type: string, enum: [createdAt, title], default: createdAt }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
        - name: skip
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Requirement'
                    - type: object
                      properties:
                        creator: { $ref: '#/components/schemas/AuthorUser' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
