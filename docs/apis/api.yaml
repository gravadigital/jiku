      x-roles: [admin, user]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  hoursPerDay: { type: number }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/present:
    post:
      tags: [other]
      summary: Presenta al usuario (PROVISORIO — no-op)
      description: |
        **Hoy no hace nada: responde `200 {}` sin tocar la base.**

        Creaba o actualizaba el usuario en `users` con los datos de Zitadel en el primer login.
        Es la única escritura que quedó sin comando en el protocolo, y con la api conectando con
        un usuario de solo lectura ya no puede hacerla.

        La web ya trata el error como no fatal ("Failed to present in API, but continuing"), así
        que el 200 preserva su comportamiento.

        > **REQ-007 (S-034) — la razón de ser de este no-op DESAPARECE.**
        >
        > Acá decía que *"un usuario nuevo de Zitadel no queda dado de alta, y si no está en
        > `users` el resto de las rutas responden 401 `user_not_found`"*, que este era *"el único
        > endpoint donde `validateToken` no exige que el usuario exista en `users`"*, y que para
        > el usuario de `web` / `opus-web` *"la pregunta sigue abierta"*. **Las tres cosas quedan
        > derogadas:**
        >
        > - **el 401 `user_not_found` ya no existe en ninguna ruta**, así que no hay nada que
        >   evitar
        > - **la excepción de `validate-token.ts:115` se eliminó**: ya no hay chequeo del que
        >   eximir a esta ruta
        > - **el alta la resuelve el comando**: `core` espeja la identidad en `users` desde el
        >   sobre que la api transporta, así que la fila se crea la primera vez que la persona
        >   escribe, sin que nadie la inserte a mano
        >
        > **La ruta sigue siendo un no-op y sigue devolviendo 200.** Lo que cambia es que ahora es
        > un no-op sin consecuencia.
      responses:
        '200':
          description: OK. Cuerpo vacío
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }

# ============================================================================
# components
# ============================================================================

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT RS256 emitido por Zitadel, verificado contra su JWKS
        (`{IDENTITY_URL}/oauth/v2/keys`), resincronizado con reintentos cuando aparece un `kid`
        desconocido.

        **Solo por header.** El fallback por query param (`?jwt=`) se eliminó: los query params
        quedan en logs de acceso, historial y `Referer`.

        Los roles salen del claim `urn:zitadel:iam:org:project:roles`, como las claves del objeto.
        Roles del producto: `admin`, `user`, `external-user`.

        > **REQ-007 (S-034) — `- ELIMINADO`.** Acá decía: *"El `sub` tiene que existir en la
        > tabla `users` o la respuesta es 401 `user_not_found`"*. **Ese 401 ya no existe en
        > ninguna de las 61 rutas.**
        >
        > `validateToken` **dejó de hacer `User.findByPk(sub)`** y arma `req.user` con
        > `{ id, name, username, email, roles }` **del claim ya verificado** — que es la fuente
        > que ADR-007 declara autoritativa (*"los roles DEBEN leerse del claim […] NO SE DEBEN
        > almacenar roles en la base ni derivarlos de otra fuente"*). Con eso:
        >
        > - una identidad autenticada **opera aunque no tenga fila previa**, y la fila queda
        >   creada la primera vez que ejecuta un comando (`core` la espeja desde el sobre)
        > - **se elimina un `SELECT` por request** en toda la superficie HTTP
        > - `POST /api/auth/present` **deja de necesitar su excepción**: ya no hay chequeo del
        >   que eximirlo
        >
        > **El `401 unauthorized` (sin token / token inválido) NO cambia.**

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
    ProjIdPath:
      name: projid
      in: path
      required: true
      schema: { type: integer }
    ReqIdPath:
      name: reqid
      in: path
      required: true
      schema: { type: integer }
    Sort:
      name: sort
      in: query
      description: |
        Campo de ordenamiento. Prefijo `-` para descendente. Default `-createdAt`.
      schema: { type: string }
      example: '-createdAt'
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: |
        El esquema Joi lo acota a **30**, pero `parseLimit` usa **200** como fallback cuando el
        valor no cumple sus condiciones (`lib/utils/parse-query-params.ts:41-43`). En la práctica
        un valor mayor a 30 se rechaza antes con 400.
      schema: { type: integer, minimum: 1, maximum: 30, default: 200 }
    DateFromRequired:
      name: dateFrom
      in: query
      required: true
      schema: { type: string, format: date }
    DateToRequired:
      name: dateTo
      in: query
      required: true
      description: Tiene que ser mayor o igual a `dateFrom`
      schema: { type: string, format: date }

  responses:
    Unauthorized:
      # REQ-007 (S-034): `- ELIMINADO` el ejemplo `userNotFound`. El `sub` ya NO tiene que estar
      # en `users`: `req.user` se arma del claim. Queda una sola causa de 401.
      description: Sin token o token inválido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            unauthorized:
              value: { code: unauthorized, message: Unauthorized }
    AccessDenied:
      description: Autenticado, pero el rol o el permiso de proyecto no alcanzan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: access_denied, message: Access denied }
    InvalidFields:
      description: Validación de Joi fallida. Devuelve **solo el primer** error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: invalid_fields, message: 'Invalid field - "title" is required' }
    NotFound:
      description: No existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: not_found, message: Not found }
    AttachmentNotAvailable:
      description: |
        No existe o no está disponible (REQ-001, S-005). Tres causas distinguibles por el `code`:

        - **el vínculo no existe** o fue eliminado — lo resuelve la api, **sin publicar** ningún
          comando (CA-29, CA-30)
        - `file_not_found` — el archivo fue borrado (`retention_status` distinto de `active`)
        - `file_not_available` — **el byte nunca llegó al storage** (`byte_status: 'pending'`).
          `core` lo resuelve por la fila, **sin tocar S3**

        > **`file_not_available` es un código propio a propósito** (RF-21, CA-15, D-15). Con el
        > byte sin verificar (D-13), el caso probable no es un link viejo: es el usuario que acaba
        > de subir y adjuntar un archivo cuyo PUT falló en silencio. Se detecta **antes** de
        > redirigir, así que ve un mensaje entendible en lugar de un error opaco de S3 al final de
        > una redirección.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            notFound:
              value: { code: not_found, message: Not found }
            fileNotFound:
              value: { code: file_not_found, message: File not found }
            fileNotAvailable:
              value: { code: file_not_available, message: El archivo no está disponible }
    ProjectNotFound:
      description: El proyecto no existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: project_not_found, message: Project not found }
    RequirementNotFound:
      description: El requisito no existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: requirement_not_found, message: Requirement not found }
    InternalError:
      description: Error inesperado. El detalle va al log, no a la respuesta
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: internal_error, message: Internal error }
    BusUnavailable:
      description: |
        **No hay ningún suscriptor del subject:** el server contesta *"no responders"* **en
        milisegundos**, no al vencer el timeout. Es la señal de un problema de **despliegue**.

        **La operación no ocurrió**, y sin JetStream no hay reintento — así que **reintentar es
        seguro**.

        No cubre el timeout: eso es `504` (`GatewayTimeout`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: service_unavailable
            message: El servicio no está disponible en este momento
    GatewayTimeout:
      description: |
        **La respuesta no llegó dentro de `NATS_REQUEST_TIMEOUT_MS`** (default 5000 ms). Había
        alguien escuchando y no contestó a tiempo: es la señal de un problema de **performance**,
        no de despliegue.

        **LA OPERACIÓN PUDO HABER OCURRIDO.** Es el modo de falla más confuso del sistema: sin
        JetStream no hay acuse ni idempotencia (ADR-002), así que core puede haber escrito y la
        respuesta haberse perdido. **Reintentar a ciegas puede duplicar.** El `message` no invita
        a reintentar, a propósito.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: gateway_timeout
            message: La operación tardó demasiado

  schemas:

    # ---- errores y acuses ----

    Error:
      type: object
      description: |
        La forma de error de toda la api. `message` es **texto de interfaz**: los frontends lo
        muestran tal cual al usuario. Están mezclados entre inglés y español.
      required: [code, message]
      properties:
        code:
          type: string
          description: Código estable. Los frontends hacen `switch` sobre él
        message: { type: string }
        remainingMinutes:
          type: integer
          description: |
            Solo en `daily_limit_exceeded`. Se recupera parseando el mensaje con un regex, porque
            el formato de respuesta del bus no tiene dónde poner datos extra de un error. Es una
            solución de transición

    Acknowledgement:
      type: object
      description: Acuse de una edición que no devuelve el recurso
      properties:
        code: { type: string }
        message: { type: string }

    # ---- enums ----

    VisibilityLevel:
      type: string
      enum: [public, internal]
      description: |
        Visibilidad de una actividad. Los cambios de estado, título y descripción son `public`;
        el resto `internal`. Solo los comentarios permiten elegir
        (`lib/utils/visibility-helper.ts`)

    ObjectiveState:
      type: string
      enum: [backlog, activo, finalizado, cancelado, en_revision]

    ObjectiveArea:
      type: string
      enum: [diseño, desarrollo, gestion, investigacion]

    ProjectType:
      type: string
      enum: [interno, comercial, investigacion, propuesta]

    ProjectStatus:
      type: string
      enum: [analisis, activo, inactivo, finalizado, cancelado]

    RequirementState:
      type: string
      description: |
        Los valores salen del enum del modelo compartido
        (`packages/models/src/requirement.model.ts`). `en_cola` se agregó en la migración
        `20260707_01`. Default en la base: `analisis`
      enum: [analisis, planificacion, en_cola, desarrollo, revision, resuelto, cancelado]

    RequirementType:
      type: string
      enum: [funcionalidad, mejora, incidencia, otro]

    RequirementPriority:
      type: string
      enum: [sin_prioridad, baja, media, alta, urgente]

    RequirementResolution:
      type: string
      description: |
        Tipo de resolución. Obligatorio, junto con la conclusión, para pasar una incidencia a
        `resuelto`
      enum: [error_interno, fuera_de_alcance, error_externo, discutible, otro]

    UnworkedReason:
      type: string
      enum:
        - tramite
        - corte_servicios
        - vacaciones
        - dia_no_laborable
        - personal
        - medico
        - estudio
        - enfermedad
        - otro

    FileIds:
      type: array
      maxItems: 10
      description: |
        Ids de `files` a vincular (REQ-001, S-003). **Reemplaza a `attachmentIds`.**

        Cada uno tiene que existir, estar vivo, y **haber sido subido por el actor de este
        comando** (RF-12): si alguno no cumple, la respuesta es **403 `file_not_owned`** y se
        descarta toda la escritura — ni la entidad ni un solo vínculo. Los `files` sí sobreviven,
        sin vínculo, que es un estado válido.

        **La titularidad no tiene excepción por rol** (RF-13): un administrador tampoco puede
        vincular un archivo que no subió.

        El tope de **10 es regla fija, no configurable** (D-20). Dejó de ser un límite de
        transporte de `multer` y pasó a ser contrato del bus, validable por Joi.
      items: { type: integer, minimum: 1 }

    AttachmentEntityType:
      type: string
      description: |
        Tipo de entidad a la que se vincula un archivo.

        **De 10 valores a 5 con REQ-001 (S-001, S-004).** Los cinco que se van los resuelve el
        backfill de la migración `resolve_legacy_and_draft_rows`:

        - `comment_draft`, `requirement_draft`, `objective_draft` — **no hay draft** (D-01). El
          archivo existe por sí solo y el vínculo se crea contra la entidad ya existente. Las
          filas draft se borran y su `File` queda **sin vínculo**, que es un estado válido
        - `comment` — legado que `20260729_01` dejó a medias. Se migra a `requirement_comment` o
          `objective_comment` según a qué tabla de actividad apunte su `entity_id`
        - `stage` — huérfano: la tabla ya no existe y sus adjuntos eran **pérdida de datos
          silenciosa**. El vínculo se borra y el `File` se recupera como archivo sin vínculo,
          alcanzable por su `uploaded_by`
      enum:
        - project
        - requirement
        - objective
        - requirement_comment
        - objective_comment
        # - comment            - ELIMINADO (legado, resuelto en el backfill)
        # - comment_draft      - ELIMINADO (D-01: no hay draft)
        # - requirement_draft  - ELIMINADO (D-01)
        # - objective_draft    - ELIMINADO (D-01)
        # - stage              - ELIMINADO (resuelto en el backfill)

    Tag:
      type: object
      description: Par clave/valor. Se guardan como `jsonb` en `requirements.tags`
      properties:
        key: { type: string }
        value: { type: string }

    # ---- entidades ----

    Client:
      type: object
      description: Actor. "Actor" en la UI, `clients` en la base
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProjectInput:
      type: object
      description: |
        Cuerpo de alta y edición de proyecto. El esquema Joi exige `name`, `code`, `status`,
        `type`, `description` e `initDate` **también en el PATCH**
      required: [name, code, status, type, description, initDate]
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string }
        clientId: { type: integer }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        type: { $ref: '#/components/schemas/ProjectType' }
        description: { type: string }
        initDate: { type: string, format: date }
        endDate:
          type: string
          format: date
          description: |
            Si no viene en el PATCH, la api manda `endDate: null` explícito al bus, preservando
            el comportamiento heredado de vaciar el campo
        keyValuePairs:
          type: object
          description: |
            Enlaces del proyecto. Se traduce a `properties` (lista de `{code, value}`) para el
            bus. Las tres primeras se validan como URI
          properties:
            documentacion: { type: string, format: uri, nullable: true }
            diseño: { type: string, format: uri, nullable: true }
            board_de_tareas: { type: string, format: uri, nullable: true }
            mattermost_group_name: { type: string, nullable: true }

    Project:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/ProjectType' }
        description: { type: string }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        initDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time, nullable: true }
        priority: { type: integer, nullable: true }
        originId: { type: integer, nullable: true }
        keyValuePairs:
          type: object
          additionalProperties: { type: string, nullable: true }
          description: Los `null` se devuelven como string vacío en los listados
        ticketSlug: { type: string, nullable: true }
        clientId: { type: integer, nullable: true }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProjectSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }

    User:
      type: object
      description: |
        Usuario. El `id` es el `sub` de Zitadel, no un entero.

        **Ni `roles` ni `identityType` están acá, y en los dos casos la omisión es deliberada —
        pero por razones distintas, y desde S-019 hay que distinguirlas:**

        - **`roles` no sale en NINGUNA respuesta HTTP, y sigue siendo así** (S-015, D-12 de
          REQ-005). Este schema es alcanzable por `external-user` a través de
          `GET /opus/projects/{projid}/users`, y exponer ahí el modelo de roles del producto
          sería filtrar información de autorización a la superficie **menos confiable**.
        - **`identityType` sí sale, pero solo en los payloads de autoría** — ver `AuthorUser`
          (S-019, CA-1). **No sale en este schema ni en el selector de personas**: ese endpoint
          ya está filtrado a `identityType: 'person'`, así que el campo sería constante.

        **La garantía no la da este schema: la dan los `include` acotados.** El default de
        Sequelize es devolver todas las columnas del modelo, así que un `include` de `User` sin
        `attributes` devolvería las dos columnas **sin ningún cambio de spec que lo delate**. Si
        agregás un `include` de `User`, declarale `attributes: ['id', 'name', 'email']` — o
        `['id', 'name', 'email', 'identityType']` si el usuario es un **autor**.
      properties:
        id: { type: string }
        name: { type: string }
        email:
          type: [string, 'null']
          format: email
          description: |
            **`null` para una identidad de servicio.** Un machine user de Zitadel no tiene
            dirección de correo —`userinfo` no devuelve el claim—, así que la fila espejada de
            `users` la deja vacía. Ver la nota de `users.email` en `docs/db-schemas/jiku.md`.

            **Para una persona nunca es `null`**: el consumidor del evento descarta un evento de
            persona sin email, así que esa fila no llega a existir.

            Ningún frontend lo renderiza hoy — lo único que se muestra es el email de la sesión
            propia, que siempre es de una persona.
        username: { type: string }

    AuthorUser:
      type: object
      description: |
        El usuario cuando aparece como **autor** de algo: creador de un proyecto, un requisito o
        una tarea, y autor de una entrada de actividad o de un comentario.

        Es un schema distinto de `User` a propósito (S-019, CA-1 y CA-2). Declara `identityType`
        porque la interfaz necesita distinguir a una persona de una identidad automática y
        marcarla; **`User` no lo declara** porque es alcanzable por `external-user` a través de
        `GET /opus/projects/{projid}/users`, un **selector de personas** ya filtrado a
        `identityType: 'person'`, donde el campo sería constante.

        **`roles` no sale acá ni en ningún otro schema.** Ese es el argumento de seguridad de
        D-12 de REQ-005, y sigue en pie: exponer el modelo de roles del producto en una respuesta
        HTTP sería filtrar información de autorización. La garantía no la da este schema: la dan
        los `include` acotados de la api.

        **No cubre a todo `User` embebido.** Un `uploader` de adjunto, un suscriptor y el
        `creator` de `GET /projects` **no** son `AuthorUser`: siguen devolviendo tres campos. El
        arreglo completo de la deriva —un `UserSummary` para todo usuario embebido— sigue
        pendiente y va por `/product-change-technical-definition`.
      properties:
        id: { type: string }
        name: { type: string }
        email:
          type: [string, 'null']
          format: email
          description: |
            **`null` para una identidad de servicio**, que es exactamente la que `identityType`
            marca: los dos campos describen la misma distinción desde dos ángulos. Ver `User.email`.
        identityType:
          type: string
          enum: [person, service]
          description: |
            Marca de identidad automática en la interfaz. `service` es una identidad de servicio
            —un conector externo, no una persona—, y el front renderiza la marca **solo** si el
            valor es exactamente `service`. Los dos valores están en inglés porque no los elige
            el producto: son el `type` de `deploy/nats/auth-callout/rules.yaml`. La palabra que
            ve el usuario la elige el front.

    Person:
      type: object
      description: |
        Persona del equipo. Distinta de `User`: una persona puede no tener usuario, y es a la
        persona a la que se imputan horas
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        enabled: { type: boolean }
        mustChargeWorkedTime: { type: boolean }
        userId: { type: string, nullable: true }

    PersonSummary:
      type: object
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }

    Objective:
      type: object
      description: Tarea. `objective` en HTTP y en la base, `task` en el bus
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        estimatedFinishDate: { type: string, nullable: true }
        finishedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Lo setea y lo limpia un hook `@BeforeUpdate` del modelo según la transición de estado
        state: { $ref: '#/components/schemas/ObjectiveState' }
        area: { $ref: '#/components/schemas/ObjectiveArea' }
        priority: { type: integer, description: 0-5 }
        visibilityLevel: { $ref: '#/components/schemas/VisibilityLevel' }
        projectId: { type: integer }
        requirementId: { type: integer, nullable: true }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ObjectiveSummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        state: { $ref: '#/components/schemas/ObjectiveState' }
        projectId: { type: integer }
        requirementId: { type: integer, nullable: true }

    ObjectiveWithWorkedTime:
      allOf:
        - $ref: '#/components/schemas/Objective'
        - type: object
          properties:
            project: { $ref: '#/components/schemas/Project' }
            creator: { $ref: '#/components/schemas/AuthorUser' }
            ObjectiveActivity:
              type: array
              description: |
                **La clave es literalmente `ObjectiveActivity`**: es el nombre de la asociación,
                sin alias. De esta única lista salen las DOS listas de `detalle-tarea` —el
                historial y los comentarios—: el front las parte filtrando por
                `typeOfActivity === 'comment'` (S-019, CA-5).
              items:
                allOf:
                  - $ref: '#/components/schemas/ObjectiveActivity'
                  - type: object
                    properties:
                      changedBy: { type: string }
                      previousValue: { type: string }
                      newValue: { type: string }
                      user: { $ref: '#/components/schemas/AuthorUser' }
            persons:
              type: array
              items: { $ref: '#/components/schemas/Person' }
            workedMinutes:
              type: integer
              description: Suma de todos los minutos imputados
            workedTime:
              type: array
              description: Agrupado por persona
              items: { $ref: '#/components/schemas/WorkedTimeSummary' }
            workedTimeDetailed:
              type: array
              description: Cada registro sin agrupar
              items: { $ref: '#/components/schemas/WorkedTimeSummary' }

    ObjectiveActivity:
      type: object
      description: 'Actividad de una tarea: cambio de campo o comentario'
      properties:
        id: { type: integer }
        objectiveId: { type: integer }
        typeOfActivity: { type: string }
        visibilityLevel: { $ref: '#/components/schemas/VisibilityLevel' }
