  /opus/requirements:
    post:
      tags: [opus]
      summary: Crea un requisito desde el portal
      description: |
        Usa el **mismo comando** que la ruta interna (`requirements.new`); lo que cambia es el rol
        que lo habilita y que acá el creador puede suscribir a otros usuarios de una.

        Las suscripciones son comandos aparte: se publica un
        `requirements.{id}.subscriptors.new` por cada usuario. **El creador queda suscripto
        siempre.**

        Los `fileIds` son ids de `files`, ya subidos por quien publica el requisito.
        `attachmentScope` **desaparece** (REQ-001, S-003): existía solo para elegir el anclaje del
        draft, y no hay draft.

        No notifica: las notificaciones están fuera del alcance.
      x-roles: [user, external-user]
      x-bus-command: requirements.new
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, projectId]
              properties:
                title: { type: string }
                description: { type: string }
                projectId: { type: integer }
                priority: { $ref: '#/components/schemas/RequirementPriority' }
                type: { $ref: '#/components/schemas/RequirementType' }
                estimatedFinishDate: { type: string, format: date }
                subscriberUserIds:
                  type: array
                  items: { type: string }
                  description: Ids de usuario de Zitadel
                fileIds:
                  $ref: '#/components/schemas/FileIds'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requirement' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /opus/requirements/{reqid}:
    parameters:
      - $ref: '#/components/parameters/ReqIdPath'
    get:
      tags: [opus]
      summary: Detalle de un requisito en el portal
      description: |
        Filtra las actividades por visibilidad: un `external-user` no ve las `internal`.

        **La respuesta real NO es `RequirementWithRelations`.** Este handler es el único de la
        api que no serializa el modelo: `sendResponse` construye el objeto campo por campo
        (`opus-requirements-id-get.ts:61-96`). Lo que devuelve, con los nombres exactos:

        - `creator` — un `AuthorUser` (el `pie-autoria` de `opus-web`).
        - `requirementActivity[]` — el feed y los comentarios; cada entrada trae `user`, también
          un `AuthorUser`.
        - `subscriptors[]` — **tres campos** (`id`, `name`, `email`) y nada más: es un
          **selector** de suscriptores, no una autoría, así que **no** lleva `identityType`.
        - `lastActivityAt` — derivado de la última actividad pública.

        El `$ref` de abajo quedó desalineado con el handler **antes** de S-019 y sigue así: su
        arreglo va por `/product-change-technical-definition`.
      x-roles: [user, external-user]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequirementWithRelations' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/RequirementNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [opus]
      summary: Cambia estado o prioridad de un requisito
      description: |
        Publica `requirements.{id}.edit` con solo esos dos campos.

        **Declara `hasAnyRole(['user', 'admin'])` — sin `external-user`**, a diferencia del resto
        de la superficie opus (`opus-requirements-id-patch.ts:30`). Si es intencional o un
        descuido está sin confirmar.
      x-roles: [user, admin]
      x-bus-command: requirements.{id}.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state: { $ref: '#/components/schemas/RequirementState' }
                priority: { $ref: '#/components/schemas/RequirementPriority' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acknowledgement' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/RequirementNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

