openapi: 3.0.3

# Contrato HTTP de `api` — los 61 endpoints que sirve.
#
# EXTRAÍDO DEL CÓDIGO
#   Los paths salen de `api/lib/routes/*.ts`; los request bodies y query params, de los esquemas
#   Joi de cada archivo; los roles, de las llamadas a `hasAnyRole`; y los códigos de error, de los
#   `res.status().json()` y del mapa `STATUS_BY_ERROR_CODE` de `lib/utils/bus/protocol.ts`.
#
# LO QUE ESTE DOCUMENTO NO PUEDE PRECISAR
#   Los response schemas se derivan de lo que el handler arma leyendo los modelos Sequelize. Donde
#   la respuesta es una fila con sus relaciones, se describe la forma observada; no hay DTOs en el
#   código contra los que validarla. Los `$ref` a entidades reflejan las columnas del modelo
#   compartido (`@jiku/models`), documentadas en docs/db-schemas/jiku.md.
#
# AUTENTICACIÓN: SE APLICA GLOBAL, NO POR RUTA
#   `api/app.ts:32-35` instala `validateToken` para TODO path excepto las exenciones de
#   `api/config/public.ts`, armadas como regex de lookahead negativo. Es deny-by-default. Por eso
#   `security` se declara a nivel raíz y **no se sobreescribe en ninguna operación**: desde REQ-002
#   la lista de exenciones está vacía en los cuatro métodos. El mecanismo se conserva —agregar una
#   ruta pública sigue siendo un cambio de una línea en `api/config/public.ts`— pero ninguna ruta lo
#   usa, así que no queda una sola operación con `security: []`.
#
# REQ-007 — LA API DEJA DE AUTORIZAR, Y `x-roles` CAMBIA DE SIGNIFICADO
#   La api conserva exactamente TRES responsabilidades sobre la escritura: autenticar el token
#   contra Zitadel, publicar el comando y traducir el código de error del reply a HTTP. **No evalúa
#   rol, ni permiso de proyecto, ni regla de negocio.**
#
#   `x-roles` NO SE ELIMINA DE ESTE SPEC, y no es una inconsistencia. Deja de ser "lo que la api
#   verifica" y pasa a ser DOCUMENTACIÓN DE QUÉ ROL AUTORIZA `core` en su mapa rol -> comando.
#   Borrarlo dejaría el contrato HTTP sin decir quién puede llamar a cada ruta, que es información
#   que los dos frontends usan para pintar la UI.
#
#   QUÉ SE ELIMINÓ, Y DÓNDE NO. De las RUTAS DE ESCRITURA se van `hasAnyRole` y
#   `validateProjectPermissions` / `canUserAccessEntity`. **Las 28 rutas `GET` los CONSERVAN**: el
#   fuera-de-alcance del REQ mantiene vigente REQ-006 §37 —ninguna de las 28 lecturas se muda al
#   bus— y quitarles el rol sin que nadie lo aplique del otro lado ABRIRÍA LA LECTURA. Es el límite
#   más fácil de cruzar de todo el requerimiento.
#
#   EL SOBRE DE IDENTIDAD. Cada comando que la api publica lleva la clave reservada `actor`
#   —`{ id, roles, name?, username?, email? }`, armada CON EL CLAIM YA VERIFICADO y no con una
#   lectura a `users`—, y `core` la espeja en `users` antes de autorizar. Contrato en
#   `components/schemas/Actor` de core.yaml. **Solo el publicador de confianza puede transportarla.**
#
#   UN CÓDIGO NUEVO EN `STATUS_BY_ERROR_CODE`: `access_denied` -> 403. Sin él caería en el `|| 500`
#   y el frontend lo trataría como error de servidor en vez de mostrar el mensaje.

info:
  title: Jiku api — contrato HTTP
  version: 1.0.0
  description: |
    Única puerta HTTP del producto. Autentica contra Zitadel, autoriza por rol y por entidad,
    **lee la base de datos directamente** y convierte toda mutación en un comando publicado en
    NATS que atiende `core`.

    **Las escrituras pasan por el bus.** Los endpoints marcados con `x-bus-command` publican un
    comando y esperan respuesta. Eso agrega **tres** modos de falla a todos ellos:

    - **`503` (`service_unavailable`) — problema de despliegue.** No hay **ningún suscriptor** del
      subject. El server contesta *"no responders"* **en milisegundos**, no al vencer el timeout.
      La operación **no ocurrió**, así que reintentar es seguro.
    - **`504` (`gateway_timeout`) — problema de performance.** Había alguien escuchando, pero la
      respuesta no llegó dentro de `NATS_REQUEST_TIMEOUT_MS` (default 5000 ms). **La operación
      pudo haber ocurrido**: sin JetStream no hay acuse, así que reintentar a ciegas puede
      duplicar.
    - **Los códigos de error que devuelve core**, traducidos a HTTP por `httpStatusFor`.

    Los dos primeros los genera la api en su `catch`; **`gateway_timeout` NO es un `errorCode` de
    core** y por eso **no está en `STATUS_BY_ERROR_CODE`**. Separarlos es lo que permite distinguir
    "no desplegué core" de "core está lento" sin mirar los logs. El contrato del bus está en
    [core.yaml](./core.yaml).

    **Después de publicar, la api relee la base.** Core solo devuelve el `id`, pero el contrato
    con los frontends es el recurso completo con sus relaciones.

    **Una sola excepción que escribe sin el bus: las migraciones** (credenciales propias).

    > **REQ-007 (S-032) cerró la otra.** `PUT /api/week-assigned-times` era *"la única deuda
    > conocida"*: escribía con el ORM y no publicaba ningún comando. Ahora publica
    > **`week-assigned-times.replace`** —el comando 21— y relee, como el resto. Con eso **el rol de
    > PostgreSQL de la api puede endurecerse a `SELECT` puro** para la escritura de dominio, que es
    > lo que ADR-001 quería desde el principio. **No se endurece en este REQ**: es un cambio de
    > infraestructura con su propio riesgo.

    > **REQ-001 cerró la tercera.** La fila de `attachments` ya no se escribe desde acá: subir,
    > vincular y desvincular pasan por comandos de `core`. Y el alcance de ADR-001 se amplía del
    > "solo core escribe la base" al **"solo core accede al storage"**: la api **pierde sus
    > credenciales de S3** y las lecturas de adjuntos pasan a ser un 302 a una URL que firmó
    > `core`. Es una garantía de infraestructura, no de disciplina.
    >
    > **El precio, y hay que decirlo:** la consecuencia positiva de ADR-001 "si core está caído el
    > producto sigue siendo consultable" **deja de valer para los adjuntos**. Los cuatro caminos de
    > lectura publican un comando y sin JetStream no hay reintento.

    **Los mensajes de error son texto de interfaz:** los frontends los muestran tal cual al
    usuario. Están mezclados entre inglés y español.

    **No hay catálogo cerrado de códigos de error.** Los documentados acá son los que el código
    produce hoy.
  license:
    name: Apache-2.0
  contact:
    name: Grava Digital

servers:
  - url: http://localhost:3000/api
    description: Desarrollo local
  - url: http://api:3000/api
    description: Red interna del compose (es como lo consumen `web` y `opus-web`)

tags:
  - name: clients
    description: Actores. Se llaman "actores" en la UI y `clients` en la base
  - name: projects
    description: Proyectos
  - name: requirements
    description: Requisitos
  - name: objectives
    description: Tareas. `objective` en HTTP y en la base, `task` en el bus
  - name: worked-times
    description: Horas trabajadas y sus reportes
  - name: unworked-times
    description: Horas no trabajadas (ausencias)
  - name: week-assigned-times
    description: Asignación semanal de tiempo
  - name: attachments
    description: Adjuntos. Autorizan por entidad, no por rol
  - name: opus
    description: Portal de clientes. Superficie de `opus-web`, acotada por permiso de proyecto
  - name: other
    description: Personas, settings y el present de auth

security:
  - bearerAuth: []

paths:

  # ==========================================================================
  # clients — actores
  # ==========================================================================

  /clients:
    get:
      tags: [clients]
      summary: Lista todos los actores
      description: Con sus proyectos, ordenados por nombre. Sin chequeo de rol.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Client'
                    - type: object
                      properties:
                        projects:
                          type: array
                          items: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [clients]
      summary: Crea un actor
      description: |
        Publica `clients.new` y devuelve el actor leído de la base. Sin chequeo de rol.
      x-bus-command: clients.new
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description:
                  type: string
                  description: Opcional. Acepta string vacío
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /clients/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [clients]
      summary: Detalle de un actor
      description: |
        Responde **400** `client_not_found` cuando no existe, no 404: es el comportamiento
        heredado del endpoint.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '400':
          description: El actor no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: client_not_found, message: Client not found }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [clients]
      summary: Edita un actor
      description: Publica `clients.{id}.edit`. Devuelve un acuse, no el recurso.
      x-bus-command: clients.{id}.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acknowledgement' }
              example: { code: client_updated, message: Client Updated }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /clients/{clientId}/projects:
    get:
      tags: [clients]
      summary: Proyectos de un actor
      x-roles: [user, admin]
      parameters:
        - name: clientId
          in: path
          required: true
          schema: { type: integer }
        - name: status
          in: query
          description: |
            Uno o varios estados separados por coma. Validado con un patrón, no con un enum:
            `analisis|activo|inactivo|finalizado|cancelado`.
          schema: { type: string }
          example: activo,analisis
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404':
          description: El actor no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: client_not_found, message: Client not found }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==========================================================================
  # projects
  # ==========================================================================

  /projects:
    get:
      tags: [projects]
      summary: Lista proyectos
      description: |
        Incluye el creador. Los `null` de `keyValuePairs` se devuelven como string vacío, porque
        es lo que espera la web.
      parameters:
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          description: Búsqueda parcial sobre el nombre (`ILIKE`)
          schema: { type: string }
        - name: type
          in: query
          schema:
            type: string
            enum: [interno, comercial, investigacion, propuesta]
        - name: state
          in: query
          description: Uno o varios estados separados por coma
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Project'
                    - type: object
                      properties:
                        # NO es AuthorUser: `projects-get.ts:31` mantiene ['id','name','email']
                        # y `listado-proyectos` quedó fuera de S-019 (CA-15). Este `creator` es
                        # `UserSummary`-shaped y el spec lo sobredeclara con `User` (que trae
                        # `username`). La deriva es preexistente —ver Hallazgo 4 del plan de
                        # S-015 (api)— y su arreglo va por
                        # /product-change-technical-definition.
                        creator: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [projects]
      summary: Crea un proyecto
      description: |
        Publica `projects.new`. `keyValuePairs` (objeto plano) se traduce a `properties` (lista de
        `{code, value}`) para el bus. Sin chequeo de rol.
      x-bus-command: projects.new
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /projects/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [projects]
      summary: Detalle de un proyecto
      description: |
        Responde **400** `project_not_found` cuando no existe, no 404.

        Devuelve `creator` y `client` embebidos. `creator` es un `AuthorUser`: alimenta la fila
        "Creado por" de `detalle-proyecto` (S-019, CA-4).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Project'
                  - type: object
                    properties:
                      creator: { $ref: '#/components/schemas/AuthorUser' }
        '400':
          description: El proyecto no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: project_not_found, message: Project not found }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [projects]
      summary: Edita un proyecto
      description: |
        Publica `projects.{id}.edit`.

        **Detalle heredado:** cuando el cuerpo no trae `endDate`, la api manda `endDate: null`
        explícito. Core tiene semántica de edición parcial (lo que no llega queda como estaba),
        pero la api vaciaba el campo, y el comportamiento para la web no cambia.

        El comando **no** lleva `editor`: `projects` no registra actividad.

        Aunque la mayoría de los campos son opcionales en el contrato conceptual, el esquema Joi
        exige `name`, `code`, `status`, `type`, `description` e `initDate` en cada PATCH.
      x-bus-command: projects.{id}.edit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acknowledgement' }
              example: { code: project_updated, message: Project Updated }
        '400':
          description: Validación fallida, o `project_not_found` desde core
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /projects/{projid}/persons:
    get:
      tags: [projects]
      summary: Personas de un proyecto
      x-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/ProjIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PersonSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /projects/objectives-summary:
    get:
      tags: [projects]
      summary: Resumen de tareas por proyecto
      description: |
        Agregación de tareas por proyecto. Devuelve `[]` cuando no hay datos. Sin chequeo de rol.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: |
                    Fila de resumen por proyecto con sus tareas agregadas. La forma exacta la arma
                    el handler; ver `lib/routes/projects-objectives-summary-get.ts`.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==========================================================================
  # requirements
  # ==========================================================================

  /requirements:
    get:
      tags: [requirements]
      summary: Lista requisitos
      x-roles: [user, admin]
      parameters:
        - name: projectId
          in: query
          schema: { type: integer }
        - name: state
          in: query
          description: |
            Uno o varios estados separados por coma. Devuelve los requisitos que estén en
            **cualquiera** de ellos (OR). Un valor fuera del enum `RequirementState` invalida el
            parámetro completo y responde 400 `invalid_fields`.
          schema: { type: string }
          example: planificacion,en_cola,desarrollo,revision
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/RequirementType' }
        - name: priority
          in: query
          schema: { type: string }
        - name: createdBy
          in: query
          description: Id de usuario de Zitadel
          schema: { type: string }
        - name: estimatedFinishDate
          in: query
          schema: { type: string, format: date }
        - name: tag
          in: query
          description: |
            Filtro por tag en formato `clave:valor`. Se resuelve con un contains sobre la columna
            `jsonb`.
          schema: { type: string }
          example: modulo:facturacion
        - name: search
          in: query
          description: Búsqueda parcial sobre el título (`ILIKE`)
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          description: Aceptado por el esquema pero **no usado**; el orden es siempre `createdAt DESC`
          schema: { type: string }
        - name: count
          in: query
          description: |
            Si es `true`, devuelve la cantidad de requisitos que satisfacen los mismos filtros en
            vez del listado. `page` y `limit` se ignoran. Mismo contrato que `count` en
            `GET /objectives`.
          schema: { type: boolean }
        - name: include
          in: query
          description: |
            Lista de campos calculados adicionales, separados por coma. Único valor aceptado:
            `totalMinutes`. Ausente, la respuesta no lo trae y las subconsultas no se ejecutan.
            Un valor fuera de la lista responde 400 `invalid_fields`.

            **`count=true` lo ignora:** el conteo devuelve un entero y no hay dónde poner el
            campo, así que las subconsultas no se arrastran a un `COUNT`.
          schema: { type: string }
          example: totalMinutes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/RequirementWithRelations' }
                  - type: integer
                    description: Cantidad de requisitos que satisfacen los filtros. Solo con `count=true`.
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [requirements]
      summary: Crea un requisito
      description: |
        Publica `requirements.new` y rearma la respuesta con proyecto y responsables.

        El proyecto se valida **en la api** porque esta ruta responde 404, mientras que core
        devuelve `project_not_found` con 400.
      x-roles: [user, admin]
      x-bus-command: requirements.new
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, projectId]
              properties:
                title: { type: string }
                description: { type: string }
                projectId: { type: integer }
                type:
                  allOf: [{ $ref: '#/components/schemas/RequirementType' }]
                  nullable: true
                priority: { $ref: '#/components/schemas/RequirementPriority' }
                state: { $ref: '#/components/schemas/RequirementState' }
                visibilityLevel: { $ref: '#/components/schemas/VisibilityLevel' }
                responsiblePersonIds:
                  type: array
                  nullable: true
                  items: { type: integer }
                estimatedFinishDate: { type: string, format: date, nullable: true }
                fileIds:
                  $ref: '#/components/schemas/FileIds'
                tags:
                  type: array
                  items: { $ref: '#/components/schemas/Tag' }
                scope: { type: string }
                technicalSolution: { type: string }
                acceptanceCriteria: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequirementWithRelations' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /requirements/report:
    get:
      tags: [requirements]
      summary: Reporte de requisitos
      x-roles: [user, admin]
      parameters:
        - name: search
          in: query
          description: |
            Si es solo dígitos, busca por id exacto; si no, búsqueda parcial sobre el título.
          schema: { type: string }
        - name: createdFrom
          in: query
          schema: { type: string, format: date }
        - name: createdTo
          in: query
          schema: { type: string, format: date }
        - name: projectId
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }

  /requirements/tags/suggestions:
    get:
      tags: [requirements]
      summary: Sugerencias de tags de un proyecto
      description: |
        Claves y valores distintos usados en los tags de los requisitos del proyecto. Se resuelve
        con SQL crudo sobre `jsonb_array_elements`.
      x-roles: [user, admin]
      parameters:
        - name: projectId
          in: query
          required: true
          schema: { type: integer }
        - name: keyQuery
          in: query
          description: Filtra las sugerencias por clave
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tag' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }

  /requirements/{reqid}:
    parameters:
      - $ref: '#/components/parameters/ReqIdPath'
    get:
      tags: [requirements]
      summary: Detalle de un requisito
      x-roles: [user, admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequirementWithRelations' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/RequirementNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [requirements]
      summary: Edita un requisito
      description: |
        Publica `requirements.{id}.edit` y rearma la respuesta.

        > **REQ-012 — la secuencia de estados (C-15) se deroga; C-17 se acota de nuevo a
        > `incidencia`.**
        >
        > - **C-15** (la secuencia de estados): la nota de REQ-007 decía *"nace en `core` con esta
        >   entrega: hasta hoy vivía únicamente en `web`"*. **Eso se deroga.** `core` deja de
        >   validar secuencia: un requisito alcanza cualquier estado desde cualquier otro, hacia
        >   adelante o atrás, incluidos `resuelto` y `cancelado` (dejan de ser terminales).
        >   `invalid_state_transition` **deja de emitirse** para requisitos — ya no aparece entre
        >   los códigos que este endpoint puede devolver.
        > - **C-17** (tipo + conclusión al resolver) la sigue aplicando `core` en
        >   `requirements.{id}.edit` **y** en `.resolve`, con el mismo validador, pero **solo
        >   cuando `type === 'incidencia'`**. Para `funcionalidad`, `mejora` y `otro` ambos campos
        >   son siempre opcionales. Devuelve `resolution_required` cuando falta, con el mismo
        >   status **400**.
        >
        > **El bloque `'400'` no cambia de forma:** `resolution_required` sigue siendo 400 y el
        > ejemplo de abajo sigue siendo válido. Lo que cambia es que `invalid_state_transition` ya
        > no es un código posible de esta respuesta.
      x-roles: [user, admin]
      x-bus-command: requirements.{id}.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                type:
                  allOf: [{ $ref: '#/components/schemas/RequirementType' }]
                  nullable: true
                priority: { $ref: '#/components/schemas/RequirementPriority' }
                estimatedFinishDate: { type: string, format: date }
                state: { $ref: '#/components/schemas/RequirementState' }
                resolutionType:
                  allOf: [{ $ref: '#/components/schemas/RequirementResolution' }]
                  nullable: true
                resolutionConclusion: { type: string, nullable: true }
                resolutionComment: { type: string, nullable: true }
                visibilityLevel: { $ref: '#/components/schemas/VisibilityLevel' }
                responsiblePersonIds:
                  type: array
                  nullable: true
                  items: { type: integer }
                scope: { type: string, nullable: true }
                technicalSolution: { type: string, nullable: true }
                acceptanceCriteria: { type: string, nullable: true }
                tags:
                  type: array
                  nullable: true
                  items: { $ref: '#/components/schemas/Tag' }
                fileIds:
                  $ref: '#/components/schemas/FileIds'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequirementWithRelations' }
        '400':
          description: |
            Validación fallida, `resolution_required`, o un código de core traducido a 400.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                resolutionRequired:
                  value:
                    code: resolution_required
                    message: Se requiere tipo y conclusión para resolver una incidencia
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/RequirementNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

