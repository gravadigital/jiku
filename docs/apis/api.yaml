        createdAt: { type: string, format: date-time }

    WeekAssignedTime:
      type: object
      properties:
        id: { type: integer }
        personId: { type: integer }
        projectId: { type: integer }
        minutes: { type: integer }
        internal:
          type: boolean
          description: Derivado del tipo de proyecto (`interno`), no enviado por el cliente
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date, description: Lunes + 4 días }

    UploadTicket:
      type: object
      description: |
        Respuesta de `POST /api/attachments` y `POST /api/opus/attachments` con REQ-001 (S-004).
        Reemplaza al `array<Attachment>` que devolvían.

        **Los frontends no pierden nada.** Hoy leen `fileName`, `fileSize` y `mimeType` de la
        respuesta para el preview embebido; ahora **los tienen antes de llamar** — salen del `File`
        del input del navegador, no de la api. Lo único que necesitan de vuelta es el `fileId` y la
        URL. Lo que se pierde es el `Attachment` completo, que en ese punto del flujo ya no existe.
      required: [fileId, uploadUrl, expiresIn]
      properties:
        fileId:
          type: integer
          description: |
            Id de `files`. **Es lo que viaja en `fileIds`** al guardar la entidad.

            En el bus el campo se llama `id` y acá `fileId`: en el bus `id` es la convención de
            todas las creaciones, y en HTTP `fileId` dice de qué id se trata, que importa porque
            este contrato maneja **dos** espacios de ids (el del vínculo y el del archivo).
        uploadUrl:
          type: string
          description: |
            URL pre-firmada de **PUT**, de un solo objeto y TTL corto (D-10). El navegador la usa
            directo contra el storage: **no pasa por la api ni por el bus**. No autoriza listar,
            leer ni borrar.
        expiresIn:
          type: integer
          description: |
            Segundos de validez. Sale de `system_settings` (`upload-url-ttl-seconds`, default
            300), configurable en caliente.

    Attachment:
      type: object
      description: |
        **El vínculo entre una entidad y un archivo.** Con REQ-001 (S-001) el archivo pasa a vivir
        en la tabla `files` y esta fila queda con el vínculo y su `file_id`.

        **Los 9 campos del archivo se mantienen aplanados en la respuesta a propósito** (S-004):
        se leen de `files` por un `include`, pero conservar la forma deja intacto el contrato con
        los dos frontends, cuyos tipos están escritos a mano y **no fallan en compilación si
        divergen**. Anidar el archivo obligaría a tocar todos los consumidores por un beneficio de
        forma.
      properties:
        id:
          type: integer
          description: |
            Id del **vínculo**, no del archivo. **Se preserva a través de la migración** (D-06,
            CA-14): las URLs públicas en circulación lo usan y tienen que seguir resolviendo.
        entityType: { $ref: '#/components/schemas/AttachmentEntityType' }
        entityId:
          type: integer
          description: |
            **Ya no es nullable** (D-01, S-001). Era nullable desde `20260612_03` para sostener el
            patrón *draft*, que este rediseño elimina: un vínculo siempre apunta a una entidad que
            existe.
        fileId:
          type: integer
          description: 'FK a `files`. La primera FK real que esta tabla tiene hacia el contenido.'
        fileName: { type: string, description: El nombre original. No es la clave en el storage }
        fileSize:
          type: integer
          description: |
            El máximo lo fija `file-max-size-bytes` de `system_settings` (default 10485760),
            configurable en caliente. **Ya no está hardcodeado.**
        mimeType: { type: string }
        storageKey:
          type: string
          description: |
            La construye `core` y **ya no depende de la entidad** (D-02):
            `{STORAGE_S3_KEY_PREFIX}/f/{uuid}{ext}`.

            **Los archivos migrados conservan su clave vieja**
            (`{prefix}/{entityType}/{entityId ?? draft}/{uuid}{ext}`) y ningún objeto se mueve en
            el bucket. **No son dos casos: nadie parsea la clave** — `core` la pasa opaca al
            firmador de S3 y es el único que la toca. El namespace `/f/` existe solo para que el
            backfill no colisione con una clave existente.

            Cambiar el prefijo en una instalación con datos sigue dejando inaccesibles los
            adjuntos existentes.
        storageBucket: { type: string }
        storageRegion: { type: string }
        uploadedBy:
          type: string
          description: |
            Quién subió el **archivo**. **Contra esto se valida la titularidad al vincular**
            (RF-12): solo quien lo subió puede vincularlo, **sin excepción por rol** (RF-13).
        byteStatus:
          type: string
          enum: [pending, uploaded]
          description: |
            Estado del byte (D-03). `pending` significa que el PUT nunca se confirmó, y la lectura
            responde `file_not_available` en lugar de redirigir a un objeto que no está.

            El byte **no se verifica** contra el storage (D-13): el cliente reporta el PUT y se le
            cree. El índice `(uploaded_by, byte_status)` hace que los abandonados sean
            identificables por consulta, aunque el barrido esté fuera del alcance de REQ-001.
        checksum: { type: string, description: sha256 en hexadecimal declarado por el cliente. Nadie lo verifica (D-25) }
        # description - ELIMINADO por REQ-001 (S-001): columna muerta confirmada, vacía en todas
        #               las filas por construcción
        createdAt: { type: string, format: date-time }
