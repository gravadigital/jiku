        date: { type: string, format: date }
        minutes: { type: integer }
        projectId: { type: integer }
        project:
          allOf: [{ $ref: '#/components/schemas/ProjectSummary' }]
          nullable: true
        objectiveId: { type: integer, nullable: true }
        objective:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            title: { type: string }
        requirementId: { type: integer, nullable: true }
        requirement:
          type: object
          nullable: true
