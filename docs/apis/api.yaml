    RequirementSummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        state: { $ref: '#/components/schemas/RequirementState' }
        projectId: { type: integer }

    RequirementWithRelations:
      description: |
        **Lo referencian cinco respuestas, y solo dos devuelven `creator` de verdad:**
        `GET /requirements/{reqid}` y `GET /opus/requirements/{reqid}`. `GET /requirements`,
        `POST /requirements` y `PATCH /requirements/{reqid}` **no** tienen el `include` de
        `creator` (ni el del feed), así que para esos tres el schema sobredeclara. La deriva es
        preexistente —Hallazgo 4 del plan de S-015 (api)— y su arreglo va por
        `/product-change-technical-definition`.

        **`GET /opus/requirements/{reqid}` además no devuelve este schema:** su handler arma la
        respuesta campo por campo (proyección a mano). Ver la `description` de ese endpoint.
      allOf:
        - $ref: '#/components/schemas/Requirement'
        - type: object
          properties:
            project: { $ref: '#/components/schemas/ProjectSummary' }
            creator: { $ref: '#/components/schemas/AuthorUser' }
            activity:
              type: array
              description: |
                El feed del requisito. **El handler la rebautiza:** la asociación es
                `requirementActivities` y la clave de la respuesta es `activity`
                (`requirements-id-get.ts:43-44`). Solo la devuelve
                `GET /requirements/{reqid}`.
              items:
                allOf:
                  - $ref: '#/components/schemas/RequirementActivity'
                  - type: object
                    properties:
                      changedBy: { type: string }
                      previousValue: { type: string }
                      newValue: { type: string }
                      changedByUser: { $ref: '#/components/schemas/AuthorUser' }
            responsiblePeople:
              type: array
              description: |
                Aplanado por el handler: `isLeader` sale de la tabla intermedia
                `people_requirements` y queda al mismo nivel que los campos de la persona
              items:
                type: object
                properties:
                  id: { type: integer }
                  firstName: { type: string }
                  lastName: { type: string }
                  isLeader: { type: boolean, nullable: true }
            totalMinutes:
              type: integer
              description: |
                Minutos imputados al requisito más los de sus tareas. **Solo presente con
                `include=totalMinutes` en `GET /requirements`**: son dos subconsultas
                correlacionadas por fila y no se pagan si no se piden. Misma gradación que el
                incluible homónimo de `core-queries.yaml`. Mismo valor que devuelve
                `GET /requirements/{reqid}/worked-hours`.

    RequirementActivity:
      type: object
      properties:
        id: { type: integer }
        requirementId: { type: integer }
        typeOfActivity: { type: string }
        visibilityLevel: { $ref: '#/components/schemas/VisibilityLevel' }
        createdAt: { type: string, format: date-time }

    WorkedTimeSummary:
      type: object
      properties:
        id: { type: integer }
        minutes: { type: integer }
        person: { $ref: '#/components/schemas/PersonSummary' }
