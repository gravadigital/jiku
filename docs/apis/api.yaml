  # ==========================================================================
  # unworked-times
  # ==========================================================================

  /unworked-times:
    get:
      tags: [unworked-times]
      summary: Horas no trabajadas de una persona en un día
      description: Sin chequeo de rol.
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: personId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UnworkedTime' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [unworked-times]
      summary: Registra horas no trabajadas
      description: |
        Publica `unworked-times.new`. Sin chequeo de rol en la api.

        > **REQ-007 (S-031) — `+ NUEVO`: `core` puede rechazar por titularidad.**
        >
        > - **`+ NUEVO`** cargar una ausencia **de otra Persona** sin ser `admin` lo rechaza
        >   ahora `core` con `access_denied` → **403** (CA-10). Antes esta ruta no tenía la regla
        >   por ningún lado
        > - **`+ SIN CAMBIOS` en el código de la api:** esta ruta **no perdió ni una línea**, y es
        >   deliberado. `UnworkedTimesNewPayload` de `docs/apis/core.yaml` mantiene
        >   `required: [date, minutes, reason, personId]` — a diferencia de `worked-times.new`, en
        >   ausencias **`personId` NO pasó a opcional**. Por eso la api conserva su
        >   `resolvePersonId` y **el campo siempre viaja** en el comando. Borrarlo "para que quede
        >   igual que en horas" haría que `core` respondiera `invalid_fields`
        > - **`+ SIN CAMBIOS`** el tope diario compartido (horas trabajadas **+** ausencias): ya
        >   vivía en `core`
      x-bus-command: unworked-times.new
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, minutes, reason]
              properties:
                date: { type: string, format: date, pattern: '^\d{4}-\d{2}-\d{2}$' }
                minutes: { type: integer, minimum: 1 }
                reason: { $ref: '#/components/schemas/UnworkedReason' }
                personId:
                  type: integer
                  minimum: 1
                  description: |
                    Opcional en el contrato HTTP: si no viene, **la api** lo resuelve desde el
                    usuario autenticado. **En el comando es obligatorio**, así que siempre viaja
                    (a diferencia de `worked-times.new`). Que sea de otra Persona lo decide
                    **`core`**: solo un `admin` puede.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnworkedTime' }
        '400':
          description: |
            Forma del input (la valida la api), o un rechazo de `core`: `person_not_found` o
            `daily_limit_exceeded`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            La ausencia es de otra Persona y el actor no es `admin`. **Llega del reply de `core`**
            (`access_denied`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: access_denied, message: Solo podés cargar tus propias ausencias }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /unworked-times/{id}:
    delete:
      tags: [unworked-times]
      summary: Borra un registro de horas no trabajadas
      description: |
        Publica `unworked-times.{id}.delete`.

        > **REQ-007 (S-031) — `- ELIMINADO` la titularidad; `+ CONSERVADO` el deadline.**
        >
        > Acá decía: *"Valida titularidad y un deadline propio de la api"*. De los dos, **se fue
        > uno solo**.
        >
        > - **`- ELIMINADO`** `validateDeletePermission`: la titularidad la aplica ahora `core` y
        >   devuelve `access_denied` → **403**, con el mismo mensaje (CA-10)
        > - **`+ CONSERVADO`** `validateDeadline`, **y no es un olvido**: NO es la ventana de
        >   carga con otro nombre. Compara **`created_at`** (no `date`) y responde
        >   **`deadline_exceeded`**, un código que **emite la api** y que por eso **no está en el
        >   mapa de códigos del bus**. `docs/apis/core.yaml` lo confirma del otro lado:
        >   `invalid_date_range` lo emite **solo** `worked-times.{id}.delete`. Mudarla exigiría un
        >   código nuevo en el protocolo, y `core` decidió no tomarla. **Queda como deuda
        >   declarada**
        > - **`+ CONSERVADO`** `loadUnworkedTime`: da el **404** del path y además es lo que
        >   alimenta a `validateDeadline`
        >
        > **`+ NUEVO` en el orden:** una ausencia **ajena y vencida** sale ahora
        > `deadline_exceeded` (400) donde antes salía `access_denied` (403) — el deadline se quedó
        > en la api y corre **antes** de publicar; la titularidad se fue a `core`, que corre
        > después.
      x-bus-command: unworked-times.{id}.delete
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acknowledgement' }
        '400':
          description: |
            Fuera del deadline de creación. **Lo emite la api** (`deadline_exceeded`), que corta
            sin publicar — no llega del reply de `core`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: deadline_exceeded
                message: Solo se pueden eliminar registros creados en los últimos 10 días
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            El registro es de otra Persona. **Llega del reply de `core`** (`access_denied`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: access_denied, message: Solo podés eliminar tus propios registros }
        '404':
          description: |
            El registro no existe. **Lo sigue dando la api** (`loadUnworkedTime`): `core` responde
            `unworked_time_not_found`, que el mapa del servicio traduce a **400**
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: unworked_time_not_found
                message: Registro de tiempo no trabajado no encontrado
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /unworked-times/reasons:
    get:
      tags: [unworked-times]
      summary: Motivos de horas no trabajadas
      description: El enum, para poblar el selector. Sin chequeo de rol.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UnworkedReason' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /unworked-times/report:
    get:
      tags: [unworked-times]
      summary: Reporte de horas no trabajadas de una persona
      description: Sin chequeo de rol.
      parameters:
        - name: dateFrom
          in: query
          required: true
          schema: { type: string, format: date, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: dateTo
          in: query
          required: true
          schema: { type: string, format: date, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: personId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==========================================================================
  # week-assigned-times
  # ==========================================================================

  /week-assigned-times:
    get:
      tags: [week-assigned-times]
      summary: Asignación semanal
      description: |
        Devuelve las asignaciones de la semana más las personas habilitadas que deben cargar
        horas y los proyectos activos o en análisis: todo lo que la grilla necesita.
      x-roles: [admin, user]
      parameters:
        - name: weekStart
          in: query
          required: true
          description: Lunes de la semana. `weekEnd` se deriva sumando 4 días
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  allocations:
                    type: array
                    items: { $ref: '#/components/schemas/WeekAssignedTime' }
                  persons:
                    type: array
                    items: { $ref: '#/components/schemas/PersonSummary' }
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/ProjectSummary' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [week-assigned-times]
      summary: Reemplaza la asignación de una semana
      description: |
        Reemplaza la semana completa de la grilla proyecto x persona. **El contrato HTTP no
        cambia:** mismo verbo, mismo cuerpo, mismos status.

        Reemplazo total: lo que no venga en `allocations` se pierde. Las asignaciones con
        `minutes: 0` se descartan, e `internal` se deriva del tipo de proyecto (`interno`).

        > **REQ-007 (S-032) — `-> MODIFICADO`: de escritura con ORM a comando + relectura.**
        >
        > Acá decía: *"El único `PUT` de la api, y la única ruta que escribe con el ORM. **No
        > publica ningún comando**: borra las asignaciones de la semana y las recrea (`destroy` +
        > `bulkCreate`) en una transacción. Es la única ruta que usa los middlewares de
        > transacción. […] Su futuro está sin decidir"*. **Su futuro se decidió.**
        >
        > - **`+ NUEVO`** publica `week-assigned-times.replace` —el **comando 21**— y **relee la
        >   base** para responder, como el resto de las escrituras (ADR-001)
        > - **`- ELIMINADO`** el `destroy` + `bulkCreate` con el ORM
        > - **`- ELIMINADO`** el middleware `validateWeekNotPast`: la regla (C-36) la aplica
        >   `core` y devuelve `invalid_date_range` → 400
        > - **`- ELIMINADO`** el `hasAnyRole(['admin'])`: C-38 la resuelve el **mapa rol → comando**
        >   de `core` y devuelve `caller_not_authorized` → 403
        > - **`- ELIMINADO`** el uso de los **middlewares de transacción**, que era **la única ruta
        >   que los usaba** — con lo que quedan sin ningún consumidor
        >
        > **Gana dos desenlaces que nunca tuvo:** `503` y `504` de ADR-002. Un `504` significa
        > *"pudo haberse guardado"* sobre una grilla entera, y la recuperación correcta es
        > **recargar la semana antes de reintentar** — la pantalla todavía no lo dice (gap
        > declarado de REQ-007).

        **`x-roles: [admin]` sigue declarado, pero ya NO es lo que la api verifica**: documenta
        qué rol autoriza `core`.
      x-roles: [admin]
      x-bus-command: week-assigned-times.replace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weekStart, allocations]
              properties:
                weekStart: { type: string, format: date }
                allocations:
                  type: array
                  items:
                    type: object
                    required: [personId, projectId, minutes]
                    properties:
                      personId: { type: integer }
                      projectId: { type: integer }
                      minutes: { type: integer, minimum: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  weekStart: { type: string, format: date }
                  weekEnd: { type: string, format: date }
                  allocations:
                    type: array
                    items: { $ref: '#/components/schemas/WeekAssignedTime' }
        '400':
          description: Validación fallida, o semana pasada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: invalid_date_range, message: No se pueden modificar semanas pasadas }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==========================================================================
  # attachments
  # ==========================================================================

  /attachments:
    get:
      tags: [attachments]
      summary: Lista adjuntos de una entidad
      description: |
        **Sin `hasAnyRole`.** Autoriza por entidad con `canUserViewEntity`, que restringe a
        `external-user` por permiso de proyecto.

        **El contrato no cambia con REQ-001; sí la implementación** (S-005): el
        `WHERE entity_type/entity_id` sigue sobre `attachments` y los campos del archivo salen de
        un `include` a `files`. La respuesta sigue aplanada para no romper a los frontends.
      parameters:
        - name: entityType
          in: query
          schema: { $ref: '#/components/schemas/AttachmentEntityType' }
        - name: entityId
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [attachments]
      summary: Pide permiso para subir un archivo
      description: |
        **Pide permiso de subida. NO recibe el binario** (REQ-001, S-004).

        Publica `files.request-upload` y devuelve un `UploadTicket`: el `fileId` y una URL
        pre-firmada de **PUT**. El navegador sube el byte **directo al storage** con esa URL — no
        pasa por la api ni por el bus.

        **Un archivo por request** (D-07). Tres archivos son tres requests independientes, y el
        fallo de uno no afecta a los otros.

        **Ya no escribe la base.** Se elimina `Attachment.create()`, y con eso la **excepción 2 de
        ADR-001** queda cerrada. También se elimina `multer`: el proceso deja de bufferizar hasta
        10 MB × 10 archivos en memoria.

        **No valida tipo ni tamaño**: eso es de `core` ahora (D-08), que lee las listas y el
        máximo de `system_settings` en caliente. La validación del cliente queda como conveniencia,
        no como fuente de verdad.

        **Autorización: solo el JWT.** `canUserAccessEntity` deja de aplicar porque ya no hay
        entidad declarada; el control de entidad se corre al momento de vincular, donde la entidad
        existe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, mimeType, fileSize]
              properties:
                fileName: { type: string, maxLength: 255 }
                mimeType: { type: string, maxLength: 100 }
                fileSize: { type: integer, minimum: 1 }
                checksum:
                  type: string
                  nullable: true
                  description: 'sha256 declarado por el cliente. **Nadie lo verifica** (D-25).'
                # files       - ELIMINADO: el byte no pasa por acá (D-09)
                # entityType  - ELIMINADO: subir no menciona la entidad (D-12)
                # entityId    - ELIMINADO: idem
                # description - ELIMINADO: columna muerta confirmada
      responses:
        '201':
          description: Ticket de subida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadTicket' }
        '400':
          description: Tipo no permitido, tamaño excedido o campos inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                fileTypeNotAllowed:
                  value: { code: file_type_not_allowed, message: File type is not allowed }
                fileTooLarge:
                  value: { code: file_too_large, message: File exceeds the configured maximum size }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /attachments/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [attachments]
      summary: Metadatos de un adjunto
      description: |
        Recibe el id **del vínculo** (D-16), que se preserva a través de la migración de REQ-001
        (D-06), así que los ids que ya circulan siguen resolviendo.

        Los campos del archivo salen de un `include` a `files` (S-005).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [attachments]
      summary: Desvincula un archivo de una entidad
      description: |
        **Borra solo el vínculo; el archivo se retiene** (REQ-001 D-04, S-004). Es un cambio de
        comportamiento observable: antes borraba la fila **y el objeto del bucket**.

        Con 0..N vínculos por archivo, borrar el objeto rompería los otros vínculos. Desvincular
        **es** borrar el `Attachment`.

        **Pasa por el bus:** la api autoriza sobre la entidad del vínculo y publica
        `attachments.{id}.delete`. Era la tercera escritura implícita de la api y dejarla afuera
        habría reabierto por otra puerta la excepción de ADR-001 que este rediseño cierra.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acknowledgement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /attachments/{id}/download:
    get:
      tags: [attachments]
      summary: Descarga un adjunto
      description: |
        **Responde 302, no el binario** (REQ-001, S-005).

        La api **autoriza** (`canUserAccessEntity` sobre la entidad del vínculo), **resuelve el
        `file_id`** de la fila que ya leyó para autorizar, publica
        `files.{fileId}.request-download` con `disposition: attachment`, y **redirige** a la URL
        pre-firmada que firmó `core`. El navegador baja de S3 directo.

        **La api deja de leer del storage y pierde sus credenciales de S3.** Es lo que hace que la
        garantía sea de infraestructura y no de disciplina.

        El `Content-Disposition` con el nombre original viaja **firmado en la URL**, así que el
        nombre se respeta sin que nadie arme el header ni toque el byte.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '302':
          description: |
            Redirección a la URL pre-firmada que firmó `core`. **Es el camino normal**, no una
            rama para archivos grandes. Los metadatos (`fileName`, `mimeType`, `fileSize`) viajan
            en los headers de esta respuesta, así que el `HEAD` que los frontends usan para
            resolver nombre y tamaño sigue funcionando.

            `Content-Type` y `Content-Disposition` van en el `GET` y en el `HEAD`.
            **`Content-Length` va SOLO en el `HEAD`**: describe el archivo que está del otro lado
            de la redirección, y en un `GET` prometería un cuerpo que un 302 no tiene —el cliente
            se quedaría esperando bytes que no llegan—. En el `HEAD`, que por definición no lleva
            body, el header describe el recurso y es correcto.
          headers:
            Location:
              schema: { type: string }
              description: URL pre-firmada de `GetObject`, con el `Content-Disposition` firmado.
        # '200' con application/octet-stream - ELIMINADO: el byte no pasa por la api
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/AttachmentNotAvailable' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /attachments/{id}/preview:
    get:
      tags: [attachments]
      summary: Previsualiza un adjunto
      description: |
        **Responde 302, no el binario** (REQ-001, S-005). Idéntico a `/download` salvo que publica
        el comando con `disposition: inline`.

        Autoriza con `canUserViewEntity`, resuelve el `file_id` y redirige a la pre-firmada de
        `core`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '302':
          description: |
            Redirección a la URL pre-firmada que firmó `core`. **Es el camino normal**, no una
            rama para archivos grandes. Los metadatos (`fileName`, `mimeType`, `fileSize`) viajan
            en los headers de esta respuesta, así que el `HEAD` que los frontends usan para
            resolver nombre y tamaño sigue funcionando.

            `Content-Type` y `Content-Disposition` van en el `GET` y en el `HEAD`.
            **`Content-Length` va SOLO en el `HEAD`**: describe el archivo que está del otro lado
            de la redirección, y en un `GET` prometería un cuerpo que un 302 no tiene —el cliente
            se quedaría esperando bytes que no llegan—. En el `HEAD`, que por definición no lleva
            body, el header describe el recurso y es correcto.
          headers:
            Location:
              schema: { type: string }
              description: URL pre-firmada de `GetObject`, con el `Content-Disposition` firmado.
        # '200' con application/octet-stream - ELIMINADO: el byte no pasa por la api
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/AttachmentNotAvailable' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /files/{id}/preview:
    get:
      tags: [attachments]
      summary: Previsualiza un archivo SIN vínculo
      description: |
        **Camino nuevo de REQ-001 (S-005), y es lo que hace coherente al modelo consigo mismo.**

        Un archivo **sin ningún vínculo es un estado válido** (RF-1, CA-7): el usuario que subió
        tres archivos y todavía no guardó el requisito tiene que poder previsualizar lo que acaba
        de subir, y los dos frontends ya muestran preview antes de guardar. Sin vínculo no hay id
        de `attachments` con el que pedirlo, así que este camino recibe el **`fileId`**.

        **Autorización: solo el JWT.** Sin vínculo no hay entidad contra la que validar permiso de
        proyecto, igual que en la subida.

        > **DECIDIDO E IMPLEMENTADO (S-005): ruta propia**, no un parámetro sobre la ruta
        > existente. `GET /api/attachments/{id}/preview` entra por `attachments.id`, y
        > sobrecargar ese path con un segundo espacio de ids —el de `files`— sobre el mismo
        > parámetro es exactamente la confusión que D-16 evita. Dos espacios de identificadores
        > distintos merecen dos rutas distintas.
        >
        > El handler **no consulta la base**: la existencia, la retención y el `byte_status` los
        > valida `core`, que es el dueño del storage. Traducir esas reglas también en la `api`
        > sería duplicarlas en dos servicios y dejarlas divergir.
        >
        > **No hay `/files/{id}/download`.** CA-12 pide previsualizar lo recién subido; la descarga
        > siempre ocurre sobre un adjunto ya vinculado. Cada endpoint de lectura es superficie que
        > después hay que justificar.
      parameters:
        - name: id
          in: path
          required: true
          description: '`files.id` — el id del **archivo**, no el del vínculo.'
          schema: { type: integer }
      responses:
        '302':
          description: |
            Redirección a la URL pre-firmada que firmó `core`. **Es el camino normal**, no una
            rama para archivos grandes. Los metadatos (`fileName`, `mimeType`, `fileSize`) viajan
            en los headers de esta respuesta, así que el `HEAD` que los frontends usan para
            resolver nombre y tamaño sigue funcionando.

            `Content-Type` y `Content-Disposition` van en el `GET` y en el `HEAD`.
            **`Content-Length` va SOLO en el `HEAD`**: describe el archivo que está del otro lado
            de la redirección, y en un `GET` prometería un cuerpo que un 302 no tiene —el cliente
            se quedaría esperando bytes que no llegan—. En el `HEAD`, que por definición no lleva
            body, el header describe el recurso y es correcto.
          headers:
            Location:
              schema: { type: string }
              description: URL pre-firmada de `GetObject`, con el `Content-Disposition` firmado.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AttachmentNotAvailable' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  # ==========================================================================
