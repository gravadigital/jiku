  # ==========================================================================
  # week-assigned-times
  # ==========================================================================

  /week-assigned-times:
    get:
      tags: [week-assigned-times]
      summary: Asignación semanal
      description: |
        Devuelve las asignaciones de la semana más las personas habilitadas que deben cargar
        horas y los proyectos activos o en análisis: todo lo que la grilla necesita.
      x-roles: [admin, user]
      parameters:
        - name: weekStart
          in: query
          required: true
          description: Lunes de la semana. `weekEnd` se deriva sumando 4 días
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  allocations:
                    type: array
                    items: { $ref: '#/components/schemas/WeekAssignedTime' }
                  persons:
                    type: array
                    items: { $ref: '#/components/schemas/PersonSummary' }
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/ProjectSummary' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [week-assigned-times]
      summary: Reemplaza la asignación de una semana
      description: |
        **El único `PUT` de la api, y la única ruta que escribe con el ORM.** No publica ningún
        comando: borra las asignaciones de la semana y las recrea (`destroy` + `bulkCreate`) en
        una transacción. Es la única ruta que usa los middlewares de transacción.

        Reemplazo total: lo que no venga en `allocations` se pierde. Las asignaciones con
        `minutes: 0` se descartan, e `internal` se deriva del tipo de proyecto (`interno`).

        Solo `admin`, y `validateWeekNotPast` rechaza semanas anteriores a la actual.

        Su futuro está sin decidir: puede mantenerse, rehacerse o eliminarse.
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weekStart, allocations]
              properties:
                weekStart: { type: string, format: date }
                allocations:
                  type: array
                  items:
                    type: object
                    required: [personId, projectId, minutes]
                    properties:
                      personId: { type: integer }
                      projectId: { type: integer }
                      minutes: { type: integer, minimum: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  weekStart: { type: string, format: date }
                  weekEnd: { type: string, format: date }
                  allocations:
                    type: array
                    items: { $ref: '#/components/schemas/WeekAssignedTime' }
        '400':
          description: Validación fallida, o semana pasada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: invalid_week, message: No se pueden modificar semanas pasadas }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==========================================================================
  # attachments
  # ==========================================================================

  /attachments:
    get:
      tags: [attachments]
      summary: Lista adjuntos de una entidad
      description: |
        **Sin `hasAnyRole`.** Autoriza por entidad con `canUserViewEntity`, que restringe a
        `external-user` por permiso de proyecto.
      parameters:
        - name: entityType
          in: query
          schema: { $ref: '#/components/schemas/AttachmentEntityType' }
        - name: entityId
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [attachments]
      summary: Sube adjuntos
      description: |
        Hasta **10 archivos de 10 MB** cada uno, en un `multipart/form-data`. Valida extensión
        **y** MIME type contra listas blancas, calcula un sha256 por archivo y guarda en storage
        S3-compatible.

        **No pasa por el bus:** crea la fila de `attachments` directamente. Es una de las dos
        escrituras con ORM que quedan en la api.

        Si un archivo falla a mitad de la tanda, **borra del bucket los ya subidos**.

        `requirement_draft` admite subida sin `entityId`: el requisito todavía no existe y el
        adjunto se ancla al usuario por `uploaded_by`.

        Sin `hasAnyRole`: autoriza por entidad con `canUserAccessEntity`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files, entityType]
              properties:
                files:
                  type: array
                  maxItems: 10
                  items: { type: string, format: binary }
                entityType: { $ref: '#/components/schemas/AttachmentEntityType' }
                entityId:
                  type: integer
                  description: Obligatorio salvo para `requirement_draft`
                description: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Attachment' }
        '400':
          description: Sin archivos, tipo no permitido, tamaño excedido o campos inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalidEntityType:
                  value: { code: invalid_entity_type, message: '"entityType" must be one of: ...' }
                noFiles:
                  value: { code: no_files, message: At least one file is required }
                uploadFailed:
                  value: { code: upload_failed, message: File size exceeds maximum of 10MB }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Sin permiso sobre la entidad
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: access_denied
                message: You do not have permission to attach files to this entity
        '500': { $ref: '#/components/responses/InternalError' }

  /attachments/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [attachments]
      summary: Metadatos de un adjunto
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [attachments]
      summary: Borra un adjunto
      description: Borra la fila y el objeto del bucket.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acknowledgement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /attachments/{id}/download:
    get:
      tags: [attachments]
      summary: Descarga un adjunto
      description: 'Stream con `Content-Disposition: attachment` y el nombre original.'
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: El archivo
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /attachments/{id}/preview:
