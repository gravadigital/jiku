openapi: 3.0.3

# Contrato HTTP de `api` — los 61 endpoints que sirve.
#
# EXTRAÍDO DEL CÓDIGO
#   Los paths salen de `api/lib/routes/*.ts`; los request bodies y query params, de los esquemas
#   Joi de cada archivo; los roles, de las llamadas a `hasAnyRole`; y los códigos de error, de los
#   `res.status().json()` y del mapa `STATUS_BY_ERROR_CODE` de `lib/utils/bus/protocol.ts`.
#
# LO QUE ESTE DOCUMENTO NO PUEDE PRECISAR
#   Los response schemas se derivan de lo que el handler arma leyendo los modelos Sequelize. Donde
#   la respuesta es una fila con sus relaciones, se describe la forma observada; no hay DTOs en el
#   código contra los que validarla. Los `$ref` a entidades reflejan las columnas del modelo
#   compartido (`@jiku/models`), documentadas en docs/db-schemas/jiku.md.
#
# AUTENTICACIÓN: SE APLICA GLOBAL, NO POR RUTA
#   `api/app.ts:32-35` instala `validateToken` para TODO path excepto las exenciones de
#   `api/config/public.ts`, armadas como regex de lookahead negativo. Es deny-by-default. Por eso
#   `security` se declara a nivel raíz y solo se sobreescribe en el único endpoint exento.

info:
  title: Jiku api — contrato HTTP
  version: 1.0.0
  description: |
    Única puerta HTTP del producto. Autentica contra Zitadel, autoriza por rol y por entidad,
    **lee la base de datos directamente** y convierte toda mutación en un comando publicado en
    NATS que atiende `core`.

    **Las escrituras pasan por el bus.** Los endpoints marcados con `x-bus-command` publican un
    comando y esperan respuesta. Eso agrega dos modos de falla a todos ellos: `503`
    (`service_unavailable`) si el bus no responde dentro de `NATS_REQUEST_TIMEOUT_MS`, y los
    códigos de error que devuelve core, traducidos a HTTP por `httpStatusFor`. El contrato del
    bus está en [core.yaml](./core.yaml).

    **Después de publicar, la api relee la base.** Core solo devuelve el `id`, pero el contrato
    con los frontends es el recurso completo con sus relaciones.

    **Tres excepciones que escriben sin el bus:** las migraciones (credenciales propias), la fila
    de `attachments`, y `PUT /api/week-assigned-times`. Las dos últimas son deuda conocida.

    **Los mensajes de error son texto de interfaz:** los frontends los muestran tal cual al
    usuario. Están mezclados entre inglés y español.

    **No hay catálogo cerrado de códigos de error.** Los documentados acá son los que el código
    produce hoy.
  license:
    name: Apache-2.0
  contact:
    name: Grava Digital

servers:
  - url: http://localhost:3000/api
    description: Desarrollo local
  - url: http://api:3000/api
    description: Red interna del compose (es como lo consumen `web` y `opus-web`)

tags:
  - name: clients
    description: Actores. Se llaman "actores" en la UI y `clients` en la base
  - name: projects
    description: Proyectos
  - name: requirements
    description: Requisitos
  - name: objectives
    description: Tareas. `objective` en HTTP y en la base, `task` en el bus
  - name: worked-times
    description: Horas trabajadas y sus reportes
  - name: unworked-times
    description: Horas no trabajadas (ausencias)
  - name: week-assigned-times
    description: Asignación semanal de tiempo
  - name: attachments
    description: Adjuntos. Autorizan por entidad, no por rol
  - name: opus
    description: Portal de clientes. Superficie de `opus-web`, acotada por permiso de proyecto
  - name: other
    description: Personas, settings y el present de auth

security:
  - bearerAuth: []

paths:

  # ==========================================================================
  # clients — actores
  # ==========================================================================

  /clients:
    get:
      tags: [clients]
      summary: Lista todos los actores
      description: Con sus proyectos, ordenados por nombre. Sin chequeo de rol.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Client'
                    - type: object
                      properties:
                        projects:
                          type: array
                          items: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [clients]
      summary: Crea un actor
      description: |
        Publica `clients.new` y devuelve el actor leído de la base. Sin chequeo de rol.
      x-bus-command: clients.new
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description:
                  type: string
                  description: Opcional. Acepta string vacío
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }

  /clients/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [clients]
      summary: Detalle de un actor
      description: |
        Responde **400** `client_not_found` cuando no existe, no 404: es el comportamiento
        heredado del endpoint.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '400':
          description: El actor no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: client_not_found, message: Client not found }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [clients]
      summary: Edita un actor
      description: Publica `clients.{id}.edit`. Devuelve un acuse, no el recurso.
      x-bus-command: clients.{id}.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acknowledgement' }
              example: { code: client_updated, message: Client Updated }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }

  /clients/{clientId}/projects:
    get:
      tags: [clients]
      summary: Proyectos de un actor
      x-roles: [user, admin]
      parameters:
        - name: clientId
          in: path
          required: true
          schema: { type: integer }
        - name: status
          in: query
          description: |
            Uno o varios estados separados por coma. Validado con un patrón, no con un enum:
            `analisis|activo|inactivo|finalizado|cancelado`.
          schema: { type: string }
          example: activo,analisis
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404':
          description: El actor no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: client_not_found, message: Client not found }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==========================================================================
  # projects
  # ==========================================================================

  /projects:
    get:
      tags: [projects]
      summary: Lista proyectos
      description: |
        Incluye el creador. Los `null` de `keyValuePairs` se devuelven como string vacío, porque
        es lo que espera la web.
      parameters:
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          description: Búsqueda parcial sobre el nombre (`ILIKE`)
          schema: { type: string }
        - name: type
          in: query
          schema:
            type: string
            enum: [interno, comercial, investigacion, propuesta]
        - name: state
          in: query
          description: Uno o varios estados separados por coma
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Project'
                    - type: object
                      properties:
                        creator: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [projects]
      summary: Crea un proyecto
      description: |
        Publica `projects.new`. `keyValuePairs` (objeto plano) se traduce a `properties` (lista de
        `{code, value}`) para el bus. Sin chequeo de rol.
      x-bus-command: projects.new
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }

  /projects/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [projects]
      summary: Detalle de un proyecto
      description: Responde **400** `project_not_found` cuando no existe, no 404.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400':
          description: El proyecto no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: project_not_found, message: Project not found }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [projects]
      summary: Edita un proyecto
      description: |
        Publica `projects.{id}.edit`.

        **Detalle heredado:** cuando el cuerpo no trae `endDate`, la api manda `endDate: null`
        explícito. Core tiene semántica de edición parcial (lo que no llega queda como estaba),
        pero la api vaciaba el campo, y el comportamiento para la web no cambia.

        El comando **no** lleva `editor`: `projects` no registra actividad.

        Aunque la mayoría de los campos son opcionales en el contrato conceptual, el esquema Joi
        exige `name`, `code`, `status`, `type`, `description` e `initDate` en cada PATCH.
      x-bus-command: projects.{id}.edit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acknowledgement' }
              example: { code: project_updated, message: Project Updated }
        '400':
          description: Validación fallida, o `project_not_found` desde core
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }

  /projects/{projid}/persons:
    get:
      tags: [projects]
      summary: Personas de un proyecto
      x-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/ProjIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PersonSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /projects/objectives-summary:
    get:
      tags: [projects]
      summary: Resumen de tareas por proyecto
      description: |
        Agregación de tareas por proyecto. Devuelve `[]` cuando no hay datos. Sin chequeo de rol.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: |
                    Fila de resumen por proyecto con sus tareas agregadas. La forma exacta la arma
                    el handler; ver `lib/routes/projects-objectives-summary-get.ts`.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==========================================================================
  # requirements
  # ==========================================================================

  /requirements:
    get:
      tags: [requirements]
      summary: Lista requisitos
      x-roles: [user, admin]
      parameters:
        - name: projectId
          in: query
          schema: { type: integer }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/RequirementState' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/RequirementType' }
        - name: priority
          in: query
          schema: { type: string }
        - name: createdBy
          in: query
          description: Id de usuario de Zitadel
          schema: { type: string }
        - name: estimatedFinishDate
          in: query
          schema: { type: string, format: date }
        - name: tag
          in: query
          description: |
            Filtro por tag en formato `clave:valor`. Se resuelve con un contains sobre la columna
            `jsonb`.
          schema: { type: string }
          example: modulo:facturacion
        - name: search
          in: query
          description: Búsqueda parcial sobre el título (`ILIKE`)
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          description: Aceptado por el esquema pero **no usado**; el orden es siempre `createdAt DESC`
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RequirementWithRelations' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [requirements]
      summary: Crea un requisito
      description: |
        Publica `requirements.new` y rearma la respuesta con proyecto y responsables.

        El proyecto se valida **en la api** porque esta ruta responde 404, mientras que core
        devuelve `project_not_found` con 400.
      x-roles: [user, admin]
      x-bus-command: requirements.new
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, projectId]
              properties:
                title: { type: string }
                description: { type: string }
                projectId: { type: integer }
                type:
                  allOf: [{ $ref: '#/components/schemas/RequirementType' }]
                  nullable: true
                priority: { $ref: '#/components/schemas/RequirementPriority' }
                state: { $ref: '#/components/schemas/RequirementState' }
                visibilityLevel: { $ref: '#/components/schemas/VisibilityLevel' }
                responsiblePersonIds:
                  type: array
                  nullable: true
                  items: { type: integer }
                estimatedFinishDate: { type: string, format: date, nullable: true }
                attachmentIds:
                  type: array
                  items: { type: integer, minimum: 1 }
                tags:
                  type: array
                  items: { $ref: '#/components/schemas/Tag' }
                scope: { type: string }
                technicalSolution: { type: string }
                acceptanceCriteria: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequirementWithRelations' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/ProjectNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }

  /requirements/report:
    get:
      tags: [requirements]
      summary: Reporte de requisitos
      x-roles: [user, admin]
      parameters:
        - name: search
          in: query
          description: |
            Si es solo dígitos, busca por id exacto; si no, búsqueda parcial sobre el título.
          schema: { type: string }
        - name: createdFrom
          in: query
          schema: { type: string, format: date }
        - name: createdTo
          in: query
          schema: { type: string, format: date }
        - name: projectId
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }

  /requirements/tags/suggestions:
    get:
      tags: [requirements]
      summary: Sugerencias de tags de un proyecto
      description: |
        Claves y valores distintos usados en los tags de los requisitos del proyecto. Se resuelve
        con SQL crudo sobre `jsonb_array_elements`.
      x-roles: [user, admin]
      parameters:
        - name: projectId
          in: query
          required: true
          schema: { type: integer }
        - name: keyQuery
          in: query
          description: Filtra las sugerencias por clave
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tag' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }

  /requirements/{reqid}:
    parameters:
      - $ref: '#/components/parameters/ReqIdPath'
    get:
      tags: [requirements]
      summary: Detalle de un requisito
      x-roles: [user, admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequirementWithRelations' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/RequirementNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [requirements]
      summary: Edita un requisito
      description: |
        Publica `requirements.{id}.edit` y rearma la respuesta.

        **Regla propia de la api:** una incidencia no pasa a `resuelto` sin tipo y conclusión de
        resolución. La validación combina lo que llega en el cuerpo con lo que ya tiene el
        requisito, y devuelve `resolution_required` (400) — un código que no está en el protocolo
        del bus.
      x-roles: [user, admin]
      x-bus-command: requirements.{id}.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                type:
                  allOf: [{ $ref: '#/components/schemas/RequirementType' }]
                  nullable: true
                priority: { $ref: '#/components/schemas/RequirementPriority' }
                estimatedFinishDate: { type: string, format: date }
                state: { $ref: '#/components/schemas/RequirementState' }
                resolutionType:
                  allOf: [{ $ref: '#/components/schemas/RequirementResolution' }]
                  nullable: true
                resolutionConclusion: { type: string, nullable: true }
                resolutionComment: { type: string, nullable: true }
                visibilityLevel: { $ref: '#/components/schemas/VisibilityLevel' }
                responsiblePersonIds:
                  type: array
                  nullable: true
                  items: { type: integer }
                scope: { type: string, nullable: true }
                technicalSolution: { type: string, nullable: true }
                acceptanceCriteria: { type: string, nullable: true }
                tags:
                  type: array
                  nullable: true
                  items: { $ref: '#/components/schemas/Tag' }
                attachmentIds:
                  type: array
                  items: { type: integer, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequirementWithRelations' }
        '400':
          description: |
            Validación fallida, `resolution_required`, o un código de core traducido a 400.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                resolutionRequired:
                  value:
                    code: resolution_required
                    message: Se requiere tipo y conclusión para resolver una incidencia
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/RequirementNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }

  /requirements/{reqid}/comments:
    post:
      tags: [requirements]
      summary: Comenta un requisito
      description: Publica `requirements.{id}.comment`. No notifica.
      x-roles: [user, admin]
      x-bus-command: requirements.{id}.comment
      parameters:
        - $ref: '#/components/parameters/ReqIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string }
                visibilityLevel:
                  allOf: [{ $ref: '#/components/schemas/VisibilityLevel' }]
                  default: internal
                attachmentIds:
                  type: array
                  items: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequirementActivity' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/RequirementNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }

  /requirements/{reqid}/worked-hours:
    get:
      tags: [requirements]
      summary: Horas trabajadas imputadas a un requisito
      x-roles: [user, admin]
      parameters:
        - $ref: '#/components/parameters/ReqIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/RequirementNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==========================================================================
  # objectives — tareas
  # ==========================================================================

  /objectives:
    get:
      tags: [objectives]
      summary: Lista tareas
      description: |
        Cada tarea trae los minutos trabajados en tres formas: `workedMinutes` (total),
        `workedTime` (agrupado por persona) y `workedTimeDetailed` (cada registro).
      parameters:
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          description: Búsqueda parcial sobre el título
          schema: { type: string }
        - name: state
          in: query
          description: Uno o varios estados separados por coma
          schema: { type: string }
        - name: area
          in: query
          schema: { $ref: '#/components/schemas/ObjectiveArea' }
        - name: projectId
          in: query
          schema: { type: integer }
        - name: projectName
          in: query
          description: Búsqueda parcial sobre el nombre del proyecto
          schema: { type: string }
        - name: personId
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ObjectiveWithWorkedTime' }
        '400': { $ref: '#/components/responses/InvalidFields' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [objectives]
      summary: Crea una tarea
      description: |
        Publica `tasks.new`. Traducciones al bus: `personIds` → `responsiblePersonIds`,
        `priority` numérica → enum (más `priorityValue` con el número original, escape transitorio
        porque el enum no cubre los 6 valores).

        `stageId` se sigue aceptando y reenviando: el concepto de etapa se eliminó del producto,
        pero la web todavía lo manda.

        Sin chequeo de rol.
      x-bus-command: tasks.new
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, state, area, priority, projectId, personIds]
              properties:
                title: { type: string }
                description: { type: string }
                estimatedFinishDate: { type: string, format: date }
                state: { $ref: '#/components/schemas/ObjectiveState' }
                area: { $ref: '#/components/schemas/ObjectiveArea' }
                priority:
                  type: integer
                  description: 0-5. El 5 se trata como `urgente`, igual que en core
                projectId: { type: integer }
                personIds:
                  type: array
                  items: { type: integer }
                visibilityLevel: { $ref: '#/components/schemas/VisibilityLevel' }
                requirementId: { type: integer, nullable: true }
                stageId:
                  type: integer
                  nullable: true
                  description: Legado. La tabla `stages` ya no existe
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Objective'
                  - type: object
                    properties:
                      personIds:
                        type: array
                        items: { type: integer }
        '400':
          description: |
            Validación fallida, o `project_not_found` / `person_not_found` desde core.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/BusUnavailable' }

  /objectives/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [objectives]
