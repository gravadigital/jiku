# The whole product on one machine, from a clean clone with only Docker: `make up`.
#
# Every external system has a local stand-in, so nothing here needs a credential:
#   - identity (Zitadel)   -> fake-idp (deploy/test/fake-idp): same endpoints, same claims.
#                             Pick the user on its page, or see deploy/test/fake-idp/users.json.
#   - S3 storage           -> MinIO
#   - SMTP                 -> Mailpit (http://localhost:8025)
# The NATS identity and the JetStream state are generated by the scripts of deploy/nats/,
# inside containers, into volumes.
#
# Two names are reachable both from the browser and from inside the containers, because the
# browser and the services must use the same URL: `idp.localhost` (the issuer) and
# `storage.localhost` (the presigned URLs). Browsers resolve *.localhost to this machine,
# where the ports are published; inside the network they are aliases of the containers.
#
# Servers do not use this file: deploy/docker-compose.yml (and .dev / .local) are the
# deployment composes, against the real identity provider and storage.
#
# Profile `test`: postgres-test, the database of the integration tests (`make test-integration`).
name: jiku

x-node-logs: &node-logs
  # NODE_ENV=production (the images) makes the logger write to files and require these paths.
  LOGGER_INFO_PATH: /tmp/info.log
  LOGGER_INFO_LEVEL: info
  LOGGER_ERROR_PATH: /tmp/error.log
  LOGGER_ERROR_LEVEL: error
  LOGGER_FILE_MAX_SIZE: "1000000"
  LOGGER_MAX_FILES: "5"

x-bus: &bus
  NATS_URL: nats://nats:4222
  NATS_CREDS: /nats-creds/sentinel-client.creds
  NATS_INSTANCE: ${NATS_INSTANCE:-local}
  NATS_COMMAND_SERVICE: ${NATS_COMMAND_SERVICE:-jiku-commands}
  NATS_QUERY_SERVICE: ${NATS_QUERY_SERVICE:-jiku-queries}
  NATS_PROTOCOL_VERSION: ${NATS_PROTOCOL_VERSION:-v1}
  NATS_EVENTS_VERSION: ${NATS_EVENTS_VERSION:-v1}
  ZITADEL_ISSUER_URL: http://fake-idp:9400
  ZITADEL_PROJECT_ID: ${IDENTITY_PROJECT_ID:-jiku-project}

services:
  postgres:
    image: postgres:15.4-alpine3.18
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-jiku}
      POSTGRES_USER: ${DATABASE_USER:-jiku}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-jiku}
      DATABASE_READONLY_USER: ${DATABASE_READONLY_USER:-jiku_readonly}
      DATABASE_READONLY_PASSWORD: ${DATABASE_READONLY_PASSWORD:-jiku_readonly}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/compose/postgres-init.sh:/docker-entrypoint-initdb.d/10-readonly-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The database of the integration tests: empty, ephemeral, one database per service suite.
  postgres-test:
    image: postgres:15.4-alpine3.18
    profiles: [test]
    environment:
      POSTGRES_DB: gestionTest
      POSTGRES_USER: test
      POSTGRES_PASSWORD: testing
    ports:
      - "${TEST_DATABASE_PORT:-55433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d gestionTest"]
      interval: 2s
      timeout: 3s
      retries: 30

  fake-idp:
    build: ./deploy/test/fake-idp
    environment:
      FAKE_IDP_ISSUER: http://idp.localhost:9400
      FAKE_IDP_PROJECT_ID: ${IDENTITY_PROJECT_ID:-jiku-project}
      FAKE_IDP_KEYS_DIR: /keys
    ports:
      - "9400:9400"
    volumes:
      - idp-keys:/keys
    networks:
      default:
        aliases: [idp.localhost]

  storage:
    # MinIO stopped publishing images to Docker Hub; this is Chainguard's build, pinned by digest.
    image: cgr.dev/chainguard/minio@sha256:b288eaa709ba2f799a39e9a8ceda71a08fabf90109b12c90badba9afff29485c
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_CREDENTIALS_ACCESSKEY:-jiku-local}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_CREDENTIALS_SECRETKEY:-jiku-local-secret}
      # The browser PUTs the file straight to the bucket from both frontends.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000,http://localhost:3001
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data
    networks:
      default:
        aliases: [storage.localhost]
    healthcheck:
      # The image has neither curl, wget nor grep: a raw HTTP request through bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200'* ]]"]
      interval: 2s
      timeout: 3s
      retries: 30

  storage-setup:
    # The server image carries `mc` and bash; the client image has no shell.
    image: cgr.dev/chainguard/minio@sha256:b288eaa709ba2f799a39e9a8ceda71a08fabf90109b12c90badba9afff29485c
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - mc alias set local http://storage:9000 "$$ACCESS" "$$SECRET" && mc mb --ignore-existing "local/$$BUCKET"
    environment:
      ACCESS: ${STORAGE_S3_CREDENTIALS_ACCESSKEY:-jiku-local}
      SECRET: ${STORAGE_S3_CREDENTIALS_SECRETKEY:-jiku-local-secret}
      BUCKET: ${STORAGE_S3_BUCKETNAME:-jiku}
      MC_CONFIG_DIR: /tmp/mc
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "8025:8025"
      - "1025:1025"

  # The NATS identity (operator, accounts, callout), generated once into a volume.
  nats-identity:
    build:
      context: ./deploy/compose
      dockerfile: nats-tools.Dockerfile
    image: jiku-nats-tools:local
    command: ["/scripts/nats-identity.sh"]
    environment:
      NATS_INSTANCE: ${NATS_INSTANCE:-local}
    volumes:
      - ./deploy/nats:/nats:ro
      - nats-creds:/nats/creds
      - ./deploy/compose:/scripts:ro
    restart: "no"

  nats:
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/nats-server.conf"]
    depends_on:
      nats-identity:
        condition: service_completed_successfully
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - ./deploy/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats-creds:/etc/nats/creds:ro
      - nats-jetstream:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  nats-setup:
    image: jiku-nats-tools:local
    command: ["/scripts/nats-setup.sh"]
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NATS_INSTANCE: ${NATS_INSTANCE:-local}
    volumes:
      - ./deploy/nats:/nats:ro
      - nats-creds:/nats/creds:ro
      - ./deploy/compose:/scripts:ro
    restart: "no"

  auth-callout:
    image: ${AUTH_CALLOUT_IMAGE:-gravadigital/nats-zitadel-auth-callout}:${AUTH_CALLOUT_VERSION:-1.1.0}
    depends_on:
      nats:
        condition: service_healthy
      fake-idp:
        condition: service_healthy
    environment:
      CALLOUT_SERVER_MODE: operator
      CALLOUT_NATS_URL: nats://nats:4222
      CALLOUT_HANDLER_CREDS: /etc/nats-creds/sentinel-handler.creds
      CALLOUT_APP_ACCOUNT_SK_SEED: /etc/nats-creds/app-account.sk.seed
      CALLOUT_APP_ACCOUNT_PUB: /etc/nats-creds/app-account.pub
      CALLOUT_AUTH_ACCOUNT_SK_SEED: /etc/nats-creds/auth-account.sk.seed
      CALLOUT_XKEY_SEED: /etc/nats-creds/callout-xkey.seed
      CALLOUT_RULES_PATH: /etc/auth-callout/rules.yaml
      CALLOUT_INSTANCE: ${NATS_INSTANCE:-local}
      CALLOUT_IDP_MODE: zitadel
      # Discovery by the service name; the issuer the tokens carry comes from the discovery.
      CALLOUT_ZITADEL_ISSUER_URL: http://fake-idp:9400
      CALLOUT_ZITADEL_PROJECT_ID: ${IDENTITY_PROJECT_ID:-jiku-project}
      # #626 (DEC-T35): the token's `aud` must include the project and roles come only from the
      # project's claim, so a user of another project of the instance does not connect.
      CALLOUT_ZITADEL_REQUIRE_PROJECT_AUDIENCE: "true"
      CALLOUT_LOG_LEVEL: info
      CALLOUT_EVENTS_SUBJECT: ${NATS_INSTANCE:-local}.events.auth
      CALLOUT_EVENTS_CREDS: /etc/nats-creds/callout-events.creds
      CALLOUT_IDP_ENRICH: profile
    volumes:
      - ./deploy/nats/auth-callout:/etc/auth-callout:ro
      - nats-creds:/etc/nats-creds:ro
    restart: unless-stopped

  # Stand-in for the optional jiku-docs module (deploy/test/fake-docs): machine user `jiku-docs`
  # (role `docs`), registered in JIKU_MODULES, answers `shares.resolve` for one fixed test token.
  fake-docs:
    build: ./deploy/test/fake-docs
    depends_on:
      nats-setup:
        condition: service_completed_successfully
      fake-idp:
        condition: service_healthy
      auth-callout:
        condition: service_started
    environment:
      NATS_URL: nats://nats:4222
      NATS_CREDS: /nats-creds/sentinel-client.creds
      NATS_INSTANCE: ${NATS_INSTANCE:-local}
      ZITADEL_ISSUER_URL: http://fake-idp:9400
      ZITADEL_PROJECT_ID: ${IDENTITY_PROJECT_ID:-jiku-project}
      ZITADEL_SERVICE_USER_KEY: /idp-keys/jiku-docs.json
    volumes:
      - nats-creds:/nats-creds:ro
      - idp-keys:/idp-keys:ro
    restart: unless-stopped

  # The api owns the schema: the baseline and the migrations, as the owner of the database.
  migrate:
    # The image the `api` service builds (Compose builds before it creates any container).
    image: jiku-api:local
    pull_policy: never
    command: ["npm", "run", "upgrade-db"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_DB: ${DATABASE_NAME:-jiku}
      POSTGRESQL_USER: ${DATABASE_USER:-jiku}
      POSTGRESQL_PASSWORD: ${DATABASE_PASSWORD:-jiku}
    restart: "no"

  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    image: jiku-core:local
    # `make dev`: rebuilt and restarted when its code or the shared packages change.
    develop:
      watch:
        - action: rebuild
          path: ./services/core
        - action: rebuild
          path: ./packages
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats-setup:
        condition: service_completed_successfully
      auth-callout:
        condition: service_started
      fake-idp:
        condition: service_healthy
      storage-setup:
        condition: service_completed_successfully
    environment:
      <<: [*node-logs, *bus]
      POSTGRESQL_HOST: postgres
      POSTGRESQL_DB: ${DATABASE_NAME:-jiku}
      POSTGRESQL_USER: ${DATABASE_USER:-jiku}
      POSTGRESQL_PASSWORD: ${DATABASE_PASSWORD:-jiku}
      POSTGRESQL_READ_USER: ${DATABASE_READONLY_USER:-jiku_readonly}
      POSTGRESQL_READ_PASSWORD: ${DATABASE_READONLY_PASSWORD:-jiku_readonly}
      POSTGRESQL_READ_POOL_MAX: ${POSTGRESQL_READ_POOL_MAX:-10}
      POSTGRESQL_STATEMENT_TIMEOUT_MS: ${POSTGRESQL_STATEMENT_TIMEOUT_MS:-8000}
      POSTGRESQL_READ_RANDOM_PAGE_COST: ${POSTGRESQL_READ_RANDOM_PAGE_COST:-1.1}
      ZITADEL_SERVICE_USER_KEY: /idp-keys/jiku-core.json
      NATS_EVENTS_QUEUE: ${NATS_EVENTS_QUEUE:-jiku-events}
      SERVICE_VERSION: ${SERVICE_VERSION:-1.0.0}
      # The `sub` of the api's machine user in deploy/test/fake-idp/users.json.
      CORE_TRUSTED_PUBLISHER_ID: ${CORE_TRUSTED_PUBLISHER_ID:-300000000000000101}
      OPUS_URL: http://localhost:3001
      STORAGE_S3_ENDPOINT: http://storage.localhost:9000
      STORAGE_S3_CREDENTIALS_ACCESSKEY: ${STORAGE_S3_CREDENTIALS_ACCESSKEY:-jiku-local}
      STORAGE_S3_CREDENTIALS_SECRETKEY: ${STORAGE_S3_CREDENTIALS_SECRETKEY:-jiku-local-secret}
      STORAGE_S3_BUCKETNAME: ${STORAGE_S3_BUCKETNAME:-jiku}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_FORCEPATHSTYLE: "true"
      STORAGE_S3_KEY_PREFIX: ${STORAGE_S3_KEY_PREFIX:-jiku-local}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: jiku
      SMTP_PASSWORD: jiku
      SMTP_FROM: ${SMTP_FROM:-Jiku <jiku@jiku.test>}
    volumes:
      - nats-creds:/nats-creds:ro
      - idp-keys:/idp-keys:ro
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: jiku-api:local
    # `make dev`: rebuilt and restarted when its code or the shared packages change.
    develop:
      watch:
        - action: rebuild
          path: ./services/api
        - action: rebuild
          path: ./packages
    depends_on:
      migrate:
        condition: service_completed_successfully
      core:
        condition: service_started
      fake-idp:
        condition: service_healthy
    environment:
      <<: [*node-logs, *bus]
      POSTGRESQL_HOST: postgres
      POSTGRESQL_DB: ${DATABASE_NAME:-jiku}
      POSTGRESQL_USER: ${DATABASE_READONLY_USER:-jiku_readonly}
      POSTGRESQL_PASSWORD: ${DATABASE_READONLY_PASSWORD:-jiku_readonly}
      POSTGRESQL_MIGRATION_USER: ${DATABASE_USER:-jiku}
      POSTGRESQL_MIGRATION_PASSWORD: ${DATABASE_PASSWORD:-jiku}
      IDENTITY_URL: http://fake-idp:9400
      # The issuer the tokens carry (#626): the public one, not the address the keys come from.
      IDENTITY_ISSUER: http://idp.localhost:9400
      KEY_SYNC_ATTEMPS: "3"
      ZITADEL_SERVICE_USER_KEY: /idp-keys/jiku-api.json
      NATS_REQUEST_TIMEOUT_MS: ${NATS_REQUEST_TIMEOUT_MS:-5000}
      NATS_QUERY_TIMEOUT_MS: ${NATS_QUERY_TIMEOUT_MS:-10000}
      JIKU_PUBLIC_URL: http://127.0.0.1:3100
      LAST_WEEK_MISSING_HOURS_ENABLED: "false"
      CURRENT_WEEK_MISSING_HOURS_ENABLED: "false"
      CONSOLIDATED_HOURS_REMINDER_ENABLED: "false"
    ports:
      - "3100:3000"
    volumes:
      - nats-creds:/nats-creds:ro
      - idp-keys:/idp-keys:ro
    # Ready when it answers HTTP: any /api route without a token is a 401. `make up` waits for it.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/projects').then((r) => process.exit(r.status === 401 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    image: jiku-web:local
    # `make dev`: rebuilt and restarted when its code or the shared packages change.
    develop:
      watch:
        - action: rebuild
          path: ./services/web
        - action: rebuild
          path: ./packages
    depends_on:
      api:
        condition: service_started
      fake-idp:
        condition: service_healthy
    environment:
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ${WEB_AUTH_SECRET:-local-only-web-auth-secret-change-me}
      AUTH_TRUST_HOST: "true"
      ZITADEL_ISSUER: http://idp.localhost:9400
      ZITADEL_CLIENT_ID: ${IDENTITY_CLIENT_ID:-jiku-web}
      ZITADEL_PROJECT_ID: ${IDENTITY_PROJECT_ID:-jiku-project}
      API_URL: http://api:3000/
    ports:
      - "3000:3000"
    # Ready when the login page answers. `make up` waits for it.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  opus-web:
    build:
      context: .
      dockerfile: services/opus-web/Dockerfile
    image: jiku-opus-web:local
    # `make dev`: rebuilt and restarted when its code or the shared packages change.
    develop:
      watch:
        - action: rebuild
          path: ./services/opus-web
        - action: rebuild
          path: ./packages
    depends_on:
      api:
        condition: service_started
      fake-idp:
        condition: service_healthy
    environment:
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${OPUS_AUTH_SECRET:-local-only-opus-auth-secret-change-me}
      AUTH_TRUST_HOST: "true"
      ZITADEL_ISSUER: http://idp.localhost:9400
      ZITADEL_CLIENT_ID: ${IDENTITY_CLIENT_ID:-jiku-web}
      ZITADEL_PROJECT_ID: ${IDENTITY_PROJECT_ID:-jiku-project}
      API_URL: http://api:3000/
    ports:
      - "3001:3000"
    # Ready when the login page answers. `make up` waits for it.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: unless-stopped

volumes:
  postgres-data:
  storage-data:
  nats-creds:
  nats-jetstream:
  idp-keys:
